<!--
  Placeholder variations, after Fomantic's docs (elements/placeholder.html, "Variations").
  Fomantic's inverted placeholder sits on an inverted segment;  here, a dark box.
-->
<div class="ui-stack">
  <section>
    <h4>Line length</h4>
    <div class="ui placeholder">
      <div class="full line"></div>
      <div class="very long line"></div>
      <div class="long line"></div>
      <div class="medium line"></div>
      <div class="short line"></div>
      <div class="very short line"></div>
    </div>
  </section>

  <section>
    <h4>Fluid</h4>
    <div class="ui fluid placeholder">
      <div class="image header">
        <div class="line"></div>
        <div class="line"></div>
      </div>
      <div class="paragraph">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
      </div>
    </div>
  </section>

  <section>
    <h4>Inverted</h4>
    <div class="ui-dark" style="padding: 1em; border-radius: var(--ui-radius); background: var(--ui-background)">
      <div class="ui inverted placeholder">
        <div class="image header">
          <div class="line"></div>
          <div class="line"></div>
        </div>
        <div class="paragraph">
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
        </div>
      </div>
    </div>
  </section>
</div>
