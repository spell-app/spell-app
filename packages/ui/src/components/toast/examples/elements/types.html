<!-- `src/components/toast/examples/types.html` as element markup:  toasts in the page, no display time. -->
<div class="ui-stack">
  <section>
    <h4>Toast</h4>
    <ui-toast message="I am a toast, nice to meet you!"></ui-toast>
  </section>

  <section>
    <h4>Titled</h4>
    <ui-toast header="Better?" message="Hey, I am a nice message!"></ui-toast>
  </section>

  <section>
    <h4>Consequences</h4>
    <ui-toast type="info" icon message="An info toast, with its icon."></ui-toast>
    <ui-toast type="success" message="You're using the good framework!"></ui-toast>
    <ui-toast type="warning" message="Your battery is running low."></ui-toast>
    <ui-toast type="error" message="We couldn't save your changes."></ui-toast>
  </section>

  <section>
    <h4>Close icon</h4>
    <ui-toast closable message="Close me with the icon."></ui-toast>
  </section>
</div>
