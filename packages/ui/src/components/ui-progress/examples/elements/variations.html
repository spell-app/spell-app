<!-- `src/components/ui-progress/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Inverted</h4>
    <ui-segment inverted>
      <ui-progress inverted value="64" bar-text="percent" label="Uploading Files"></ui-progress>
      <ui-progress inverted color="red" value="38" label="Red"></ui-progress>
    </ui-segment>
  </section>

  <section>
    <h4>Attached</h4>
    <ui-segment>
      <ui-progress attached="top" value="30" aria-label="Top"></ui-progress>
      <p>A segment with a progress bar along its top and bottom edges.</p>
      <ui-progress attached="bottom" value="70" aria-label="Bottom"></ui-progress>
    </ui-segment>
  </section>

  <section>
    <h4>Sizes</h4>
    <div class="ui-stack">
      <ui-progress size="tiny" value="20" label="Tiny"></ui-progress>
      <ui-progress size="small" value="40" label="Small"></ui-progress>
      <ui-progress size="large" value="60" label="Large"></ui-progress>
      <ui-progress size="big" value="80" label="Big"></ui-progress>
    </div>
  </section>

  <section>
    <h4>Colors</h4>
    <div class="ui-stack">
      <ui-progress color="red" value="30" aria-label="Red"></ui-progress>
      <ui-progress color="teal" value="50" aria-label="Teal"></ui-progress>
      <ui-progress color="violet" value="70" aria-label="Violet"></ui-progress>
    </div>
  </section>

  <section>
    <h4>Multiple</h4>
    <ui-progress value="15,25,35" bar-colors="red green blue" bar-text="percent" aria-label="Disk usage"></ui-progress>
  </section>

  <section>
    <h4>Indeterminate</h4>
    <div class="ui-stack">
      <ui-progress indeterminate aria-label="Waiting"></ui-progress>
      <ui-progress indeterminate="filling" color="teal" aria-label="Filling"></ui-progress>
      <ui-progress indeterminate="sliding" color="blue" aria-label="Sliding"></ui-progress>
      <ui-progress indeterminate="swinging" speed="slow" color="green" aria-label="Swinging"></ui-progress>
    </div>
  </section>
</div>
