approvedGitRepositories:
  - "**"

enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

# Each workspace gets its own complete `node_modules`, as when these were separate repos:  scripts, tests and the
# VS Code extension find tools at `<package>/node_modules/...`.  Phase 3 lifts this, for one copy of Solid.
nmHoistingLimits: workspaces

npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.18.0.cjs
