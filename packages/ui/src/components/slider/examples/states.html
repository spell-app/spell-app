<!--
  Slider states, after Fomantic's docs (modules/slider.html, "States").
-->
<div class="ui-stack">
  <section>
    <h4>Disabled</h4>
    <div class="ui disabled slider">
      <div class="inner" style="--_slider-to: 0.4">
        <div class="track"></div>
        <div class="track-fill"></div>
        <div class="thumb" style="--_slider-at: 0.4"></div>
      </div>
    </div>
  </section>

  <section>
    <h4>Read-only</h4>
    <div class="ui read-only slider">
      <div class="inner" style="--_slider-to: 0.6">
        <div class="track"></div>
        <div class="track-fill"></div>
        <div class="thumb" style="--_slider-at: 0.6"></div>
      </div>
    </div>
  </section>
</div>
