<!-- `src/components/ui-progress/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Active</h4>
    <ui-progress active value="42" bar-text="percent" label="Uploading Files"></ui-progress>
  </section>

  <section>
    <h4>Success</h4>
    <ui-progress value="100" bar-text="percent" label="Everything worked, your file is all ready."></ui-progress>
  </section>

  <section>
    <h4>Warning</h4>
    <ui-progress state="warning" value="100" bar-text="percent">
      Your file didn't meet the minimum resolution requirements.
    </ui-progress>
  </section>

  <section>
    <h4>Error</h4>
    <ui-progress state="error" value="100" bar-text="percent" label="There was an error."></ui-progress>
  </section>

  <section>
    <h4>Disabled</h4>
    <ui-progress disabled value="80" bar-text="percent" label="This progress bar is disabled"></ui-progress>
  </section>
</div>
