<!--
  Feed states, after Fomantic's docs (views/feed.html, "States").
  Static class grammar `UIFeed.css` styles:  the feed, its events (`.ui.feed > .event`) and their labels, and the
  content parts (`in-feed`, as `UIParts.css` expects static parts);  element markup renders the same.
-->

    <h4>Disabled event</h4>

      <div class="disabled event">

            alt=""
          />
        </div>
        <div class="content in-feed">
          <div class="summary in-feed">
            <a class="author in-feed" href="#elliot-fu">Elliot Fu</a> added you as a friend
            <time class="date in-feed">1 Hour Ago</time>
          </div>
          <div class="meta in-feed">
            <a class="like" href="#elliot-fu-likes"
              ><span class="ui icon"
                ><svg viewBox="0 0 512 512" aria-hidden="true">

                    fill="currentColor"
