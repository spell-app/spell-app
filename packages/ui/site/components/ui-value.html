<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Value | Spell UI</title>
    <meta
      name="description"
      content="A value is what a statistic shows:  a number, a word, an icon or an image."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../_assets/site.css" />
    <script type="module" src="../_assets/site.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Value">
      <ui-segment vertical class="site-masthead">
        <ui-container>
          <ui-menu icon floated="right" class="site-page-links" aria-label="About this page">
            <ui-item
              href="https://github.com/spell-app/spell-app/blob/main/packages/ui/site/components/ui-value.html"
              icon="pen to square"
              aria-label="This page's source on GitHub"
              title="This page's source on GitHub"
            ></ui-item>
            <ui-item
              href="https://github.com/spell-app/spell-app/issues/new?title=ui-value%3A%20%20"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Value
            <ui-header>A value is what a statistic shows:  a number, a word, an icon or an image.</ui-header>
          </ui-header>
          <ui-docs-themes for="ui-value" show="theme" class="site-themes"></ui-docs-themes>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history basic appearance="segmented" alignment="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  `<ui-value>` in each owner that gives it a look (from the owners' own pages and
              `src/components/ui-parts/examples/elements/`), then its attributes.  The Content parts page
              (`ui-header.html`) shows every part together.
            -->
            <ui-section id="examples-owners" header="Owners" sticky collapsible dividing>
              <ui-section id="examples-owners-statistic" header="Statistic" sticky collapsible dividing>
                <ui-docs-example description="A statistic's value, above its label.">
                  <ui-statistics>
                    <ui-statistic>
                      <ui-value>40,509</ui-value>
                      <ui-label>Views</ui-label>
                    </ui-statistic>
                    <ui-statistic horizontal>
                      <ui-value>2,204</ui-value>
                      <ui-label>Downloads</ui-label>
                    </ui-statistic>
                  </ui-statistics>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-variations" header="Variations" sticky collapsible dividing>
              <ui-section id="examples-variations-text-value" header="Text Value" sticky collapsible dividing>
                <ui-docs-example description="`text` makes a word value, smaller and bold.">
                  <ui-statistic>
                    <ui-value text>Three<br />Thousand</ui-value>
                    <ui-label>Signups</ui-label>
                  </ui-statistic>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-variations-icon-and-image" header="Icon and Image" sticky collapsible dividing>
                <ui-docs-example description="A value can hold an icon or an image beside the number.">
                  <ui-statistics>
                    <ui-statistic>
                      <ui-value><ui-icon name="plane"></ui-icon> 5</ui-value>
                      <ui-label>Flights</ui-label>
                    </ui-statistic>
                    <ui-statistic>
                      <ui-value><ui-image circular inline src="../images/avatar/small/joe.jpg" alt=""></ui-image> 42</ui-value>
                      <ui-label>Team Members</ui-label>
                    </ui-statistic>
                  </ui-statistics>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <ui-section id="usage-using-it" header="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-value>` is what a statistic shows: a number, a word, an icon or an image, with a `<ui-label>` naming it. In a
                  search result it is the price.

                  - `text` makes a word value: smaller and bold, so "Three Thousand" fits.
                  - Put a `<ui-icon>` or `<ui-image>` inside it beside the number.
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-owners" header="Owners" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-value>` finds its nearest owner and sets `:state(in-<owner>)` on itself; `ui-parts.css` styles it by that
                  state. Its owners, and what each makes of it:

                  - [Statistic](ui-statistic.html) (`:state(in-statistic)`): large and light, above the label;  the statistic's `size` scales it
                  - [Search](ui-search.html) (`:state(in-search)`): a search result's price, on the right

                  Anywhere else it is an unstyled block. More on how parts find their owners: [Content parts](ui-header.html#usage-owners).
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-accessibility" header="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - The value and its label are read in order ("40,509 Views"); keep them next to each other in the markup.
                  - An icon inside a value is decorative: the number and the label carry the meaning.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json`);  nothing to write. -->
            <ui-docs-api tag="ui-value"></ui-docs-api>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
