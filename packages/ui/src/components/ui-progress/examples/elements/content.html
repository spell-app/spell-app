<!-- `src/components/ui-progress/examples/content.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Bar</h4>
    <ui-progress value="30" aria-label="Bar only"></ui-progress>
  </section>

  <section>
    <h4>Progress</h4>
    <ui-progress value="60" bar-text="percent" aria-label="With percent"></ui-progress>
  </section>

  <section>
    <h4>Ratio</h4>
    <ui-progress value="9" total="20" bar-text="ratio" aria-label="With ratio"></ui-progress>
  </section>

  <section>
    <h4>Label</h4>
    <ui-progress value="55" bar-text="percent">Uploading Files</ui-progress>
  </section>
</div>
