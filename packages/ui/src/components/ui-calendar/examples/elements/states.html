<!-- `src/components/ui-calendar/examples/states.html` as element markup:  bounds, disabled days, disabled, read-only. -->
<div class="ui-stack">
  <section>
    <h4>Minimum and maximum</h4>
    <ui-calendar
      inline
      type="date"
      value="2026-09-18"
      min="2026-09-07"
      max="2026-09-25"
      locale="en-US"
      aria-label="Bounded date"
    ></ui-calendar>
  </section>

  <section>
    <h4>Disabled</h4>
    <ui-calendar disabled type="date" value="2026-09-30" locale="en-US" placeholder="Disabled date"></ui-calendar>
  </section>

  <section>
    <h4>Read-only</h4>
    <ui-calendar readonly type="date" value="2026-09-30" locale="en-US" placeholder="Read-only date"></ui-calendar>
  </section>

  <section>
    <h4>Required, in a form</h4>
    <form>
      <ui-calendar required name="due" type="date" locale="en-US" placeholder="Due date"></ui-calendar>
    </form>
  </section>
</div>
