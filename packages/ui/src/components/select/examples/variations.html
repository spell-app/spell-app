<!--
  Select variations, after Fomantic's docs (modules/dropdown.html, "Variations"):  sizes, fluid, compact,
  inverted.
-->
<div class="ui-stack">
  <section>
    <h4>Sizes</h4>
    <div class="ui-stack">
      <select class="ui mini select" aria-label="Mini">
        <option class="item" value="a"><span class="text">Mini</span></option>
      </select>
      <select class="ui small select" aria-label="Small">
        <option class="item" value="a"><span class="text">Small</span></option>
      </select>
      <select class="ui medium select" aria-label="Medium">
        <option class="item" value="a"><span class="text">Medium</span></option>
      </select>
      <select class="ui large select" aria-label="Large">
        <option class="item" value="a"><span class="text">Large</span></option>
      </select>
      <select class="ui massive select" aria-label="Massive">
        <option class="item" value="a"><span class="text">Massive</span></option>
      </select>
    </div>
  </section>

  <section>
    <h4>Fluid</h4>
    <select class="ui fluid select" aria-label="Fluid">
      <option class="placeholder" value="">Fills its container</option>
      <option class="item" value="a"><span class="text">A</span></option>
    </select>
  </section>

  <section>
    <h4>Compact</h4>
    <select class="ui compact select" aria-label="Compact">
      <option class="item" value="a"><span class="text">Or</span></option>
      <option class="item" value="b"><span class="text">And</span></option>
    </select>
  </section>

  <section>
    <h4>Inverted</h4>
    <div class="ui-dark" style="padding: 1em; background: var(--ui-surface); color: var(--ui-text-color)">
      <select class="ui inverted select" aria-label="Inverted">
        <option class="placeholder" value="">Inverted</option>
        <option class="item" value="a"><span class="text">A</span></option>
      </select>
    </div>
  </section>
</div>
