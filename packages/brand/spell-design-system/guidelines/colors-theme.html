<!-- @dsCard group="Colors" viewport="700x200" name="Theme: light & dark" subtitle="Semantic surface/text/accent tokens per mode" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;box-sizing:border-box}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div  style="background:var(--bg-canvas);padding:14px;border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;box-shadow:inset 0 0 0 1px var(--border-subtle)">
<div><div style="height:34px;border-radius:8px;background:var(--bg-canvas);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">canvas</div></div><div><div style="height:34px;border-radius:8px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">card</div></div><div><div style="height:34px;border-radius:8px;background:var(--surface-tint);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">tint</div></div><div><div style="height:34px;border-radius:8px;background:var(--surface-warm);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">warm</div></div>
<div><div style="height:34px;border-radius:8px;background:var(--text-strong)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">strong</div></div><div><div style="height:34px;border-radius:8px;background:var(--text-body)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">body</div></div><div><div style="height:34px;border-radius:8px;background:var(--text-muted)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">muted</div></div><div><div style="height:34px;border-radius:8px;background:var(--accent)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">accent</div></div></div><div data-theme="dark" style="background:var(--bg-canvas);padding:14px;border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;box-shadow:inset 0 0 0 1px var(--border-subtle)">
<div><div style="height:34px;border-radius:8px;background:var(--bg-canvas);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">canvas</div></div><div><div style="height:34px;border-radius:8px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">card</div></div><div><div style="height:34px;border-radius:8px;background:var(--surface-tint);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">tint</div></div><div><div style="height:34px;border-radius:8px;background:var(--surface-warm);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">warm</div></div>
<div><div style="height:34px;border-radius:8px;background:var(--text-strong)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">strong</div></div><div><div style="height:34px;border-radius:8px;background:var(--text-body)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">body</div></div><div><div style="height:34px;border-radius:8px;background:var(--text-muted)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">muted</div></div><div><div style="height:34px;border-radius:8px;background:var(--accent)"></div><div style="font:400 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:4px">accent</div></div></div></div></body></html>
