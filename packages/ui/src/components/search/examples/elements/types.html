<!--
  `src/components/search/examples/types.html` as element markup.  `source` is a PROPERTY;  plain HTML can write it
  as a JSON attribute, as here.
-->
<div class="ui-stack" style="padding-bottom: 16em">
  <section>
    <h4>Standard</h4>
    <ui-search
      placeholder="Common passwords..."
      source='[{"title":"123456"},{"title":"password"},{"title":"qwerty"},{"title":"letmein"},{"title":"dragon"}]'
    ></ui-search>
  </section>

  <section>
    <h4>With descriptions, prices and links</h4>
    <ui-search
      aria-label="Fruit"
      highlight-matches
      source='[{"title":"Apple","description":"Crisp and sweet"},{"title":"Apricot","description":"Soft, from Valencia","price":"$2.00"},{"title":"Grape","url":"#grape"}]'
    ></ui-search>
  </section>
</div>

<div class="ui-stack" style="padding-bottom: 16em">
  <section>
    <h4>Category</h4>
    <ui-search
      category
      aria-label="Food"
      source='[{"title":"Apple","category":"Fruit"},{"title":"Banana","category":"Fruit"},{"title":"Asparagus","category":"Vegetables"}]'
    ></ui-search>
  </section>
</div>
