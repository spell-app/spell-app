<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Date | Spell UI</title>
    <meta
      name="description"
      content="A date says when something happened, inline and small inside a feed event."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../_assets/site.css" />
    <script type="module" src="../_assets/site.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Date">
      <ui-segment vertical class="site-masthead">
        <ui-container>
          <ui-menu icon floated="right" class="site-page-links" aria-label="About this page">
            <ui-item
              href="https://github.com/spell-app/spell-app/blob/main/packages/ui/site/components/ui-date.html"
              icon="pen to square"
              aria-label="This page's source on GitHub"
              title="This page's source on GitHub"
            ></ui-item>
            <ui-item
              href="https://github.com/spell-app/spell-app/issues/new?title=ui-date%3A%20%20"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Date
            <ui-header>A date says when something happened, inline and small inside a feed event.</ui-header>
          </ui-header>
          <ui-docs-themes for="ui-date" show="theme" class="site-themes"></ui-docs-themes>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history basic appearance="segmented" alignment="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  `<ui-date>` in each owner that gives it a look (from the owners' own pages and
              `src/components/ui-parts/examples/elements/`), then its attributes.  The Content parts page
              (`ui-header.html`) shows every part together.
            -->
            <ui-section id="examples-owners" header="Owners" sticky collapsible dividing>
              <ui-section id="examples-owners-feed" header="Feed" sticky collapsible dividing>
                <ui-docs-example description="A date above an event's summary, and one inline at its end.">
                  <ui-feed>
                    <ui-event>
                      <ui-content>
                        <ui-date datetime="P3D">3 days ago</ui-date>
                        <ui-summary>You added Jenny Hess to your coworker group.</ui-summary>
                      </ui-content>
                    </ui-event>
                    <ui-event>
                      <ui-content>
                        <ui-summary>
                          <ui-author href="#jenny">Jenny Hess</ui-author> added you as a friend
                          <ui-date datetime="PT4H">4 hours ago</ui-date>
                        </ui-summary>
                      </ui-content>
                    </ui-event>
                  </ui-feed>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-content" header="Content" sticky collapsible dividing>
              <ui-section
                id="examples-content-machine-readable-date"
                header="Machine-readable date"
                sticky
                collapsible
                dividing
              >
                <ui-docs-example
                  description="`datetime` renders a `<time datetime>`;  the text stays what readers see."
                >
                  <ui-feed>
                    <ui-event>
                      <ui-content>
                        <ui-summary>
                          Release 2.0 shipped
                          <ui-date datetime="2026-10-04">Today</ui-date>
                        </ui-summary>
                      </ui-content>
                    </ui-event>
                  </ui-feed>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <ui-section id="usage-using-it" header="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-date>` says when something happened: a feed event's date, inline and small inside its summary or above it.

                  - `datetime` makes it a real `<time datetime>`, so machines read the date too: an ISO date
                    (`2026-10-04`), a time, or a duration (`P3D`).
                  - The text is what readers see: "3 days ago", "Today".
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-owners" header="Owners" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-date>` finds its nearest owner and sets `:state(in-<owner>)` on itself; `ui-parts.css` styles it by that
                  state. Its owners, and what each makes of it:

                  - [Feed](ui-feed.html) (`:state(in-feed)`): small and muted:  above the summary, or inline at its end

                  Anywhere else it is an unstyled block. More on how parts find their owners: [Content parts](ui-header.html#usage-owners).
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-accessibility" header="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - With `datetime` it renders a `<time datetime>`: the visible text ("3 days ago") is read aloud, the exact date is
                    there for machines.
                  - No role or tab stop of its own.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json`);  nothing to write. -->
            <ui-docs-api tag="ui-date"></ui-docs-api>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
