<!doctype html>
<!--
  Smoke page for the site bundle (P2):  `_assets/site.js` loads, `<ui-root>` lazy-loads the families it finds
  (`<ui-docs-example>` included), icons come from non-default packs over HTTP, `<ui-code>` highlights.  Temporary:
  the real pages (P3+) replace it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site bundle smoke</title>
    <link rel="stylesheet" href="_assets/site.css" />
    <script type="module" src="_assets/site.js"></script>
  </head>
  <body class="ui-body">
    <spell-site-header></spell-site-header>
    <ui-root icons="fa7-brands, fomantic">
      <ui-container>
        <ui-header level="1">Site bundle smoke</ui-header>

        <ui-docs-example
          header="Emphasis"
          description="A button can be formatted to show different levels of `emphasis`."
          code
        >
          <ui-button primary>Save</ui-button>
          <ui-button>Discard</ui-button>
        </ui-docs-example>

        <ui-docs-example
          header="Icons from other packs"
          description="A brand icon (`fa7-brands`) and a Fomantic name (`fomantic`), loaded over HTTP from `_assets/icon-packs/`."
        >
          <ui-icon name="github" size="big"></ui-icon>
          <ui-icon name="address book" size="big"></ui-icon>
          <ui-button icon="heart" label="2,048">Like</ui-button>
        </ui-docs-example>

        <ui-docs-example header="From a template" description="The markup is shown exactly as written." variation>
          <template>
            <ui-label color="teal">Template</ui-label>
          </template>
        </ui-docs-example>

        <ui-code language="ts">const answer: number = 42 // highlighted lazily</ui-code>
      </ui-container>
    </ui-root>
  </body>
</html>
