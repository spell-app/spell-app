<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Status roles map to set steps" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;box-sizing:border-box}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;border-radius:12px;background:var(--success-soft, var(--accent-75));display:grid;place-items:center;font:600 14px var(--font-sans);color:var(--success)">Success</div><div style="font:400 10px/1.2 var(--font-mono);color:var(--text-muted);font-size:10.5px">green-700 / 75</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;border-radius:12px;background:var(--warning-soft, var(--accent-75));display:grid;place-items:center;font:600 14px var(--font-sans);color:var(--warning)">Warning</div><div style="font:400 10px/1.2 var(--font-mono);color:var(--text-muted);font-size:10.5px">amber-700 / 75</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;border-radius:12px;background:var(--danger-soft, var(--accent-75));display:grid;place-items:center;font:600 14px var(--font-sans);color:var(--danger)">Danger</div><div style="font:400 10px/1.2 var(--font-mono);color:var(--text-muted);font-size:10.5px">red-600 / 75</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;border-radius:12px;background:var(--spark-soft, var(--accent-75));display:grid;place-items:center;font:600 14px var(--font-sans);color:var(--spark)">Spark</div><div style="font:400 10px/1.2 var(--font-mono);color:var(--text-muted);font-size:10.5px">amber-400</div></div></div></body></html>
