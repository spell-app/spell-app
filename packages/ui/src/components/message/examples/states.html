<!--
  Message states, after Fomantic's docs (collections/message.html, "States").
  The element uses the `hidden` attribute;  the classes stay for static markup.
-->
<div class="ui-stack">
  <section>
    <h4>Hidden</h4>
    <div class="ui hidden message">
      <div class="content"><p>You can't see me</p></div>
    </div>
    <div class="ui message">
      <div class="content"><p>A hidden message sits above me.</p></div>
    </div>
  </section>

  <section>
    <h4>Visible</h4>
    <div class="ui visible message">
      <div class="content"><p>You can always see me</p></div>
    </div>
  </section>
</div>
