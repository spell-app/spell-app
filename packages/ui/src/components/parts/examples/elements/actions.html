<!-- `src/components/parts/examples/actions.html` as element markup. -->
<!-- Owners are the real elements, except `stub-*` stand-ins (`StubOwner`) for modal and toast (overlays, hidden until opened;  toast owns no parts yet). -->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <ui-actions><button type="button">OK</button></ui-actions>
  </section>

  <section>
    <h4>In owners</h4>
    <ui-comments>
      <ui-comment>
        <ui-content>
          <ui-actions><a href="#reply">Reply</a><a href="#save">Save</a></ui-actions>
        </ui-content>
      </ui-comment>
    </ui-comments>
    <stub-modal>
      <ui-header>Delete your account</ui-header>
      <ui-actions><button type="button">No</button><button type="button">Yes</button></ui-actions>
    </stub-modal>
    <stub-toast style="padding: 1em">
      <ui-content>Saved</ui-content>
      <ui-actions><button type="button">Undo</button></ui-actions>
    </stub-toast>
  </section>
</div>
