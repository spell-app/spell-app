<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plan Doc Template</title>
    <meta name="description" content="Plan doc template:  copied by `spell dev plan-doc new <name>`." />
    <link rel="stylesheet" href="../../packages/docs/tools/_assets/spell-doc.css" />
  </head>
  <body class="spell-doc-page plan-doc">
    <ui-root>
      <ui-components source="../../packages/epics/pack/epics.pack.js"></ui-components>
      <spell-site-header root="../.."></spell-site-header>
      <div class="spell-doc">
        <main class="spell-doc-main">
          <!--
            PLAN DOC TEMPLATE.  NEVER copy by hand:  `spell dev plan-doc new <name>` fills the {{placeholders}}.
            - The tool's own template, in <epic-*> markup (packages/epics/src/tool/PLAN-DOC.md):  data in attributes,
              prose in children;  the elements draw the rest (crumbs, header, meta lines, step label, chips ...).
            - Sections are fixed:  each <epic-section kind> once, in this order, with its id.
          -->
          <epic-page
            epic="{{name}}"
            title="{{title}}"
            branch="{{branch}}"
            worktree="{{worktree}}"
            started="{{date}}"
            updated="{{date}}"
          >
            <epic-overview id="overview">
              <epic-summary>Two sentences: what this plan does, and why.</epic-summary>
              <epic-section id="o1" kind="overview-part" title="Structure">
                <p>What goes where: the part that becomes durable docs in the last phase.</p>
              </epic-section>
            </epic-overview>
            <epic-section id="phases" kind="phases"></epic-section>
            <epic-section id="decisions" kind="questions"></epic-section>
            <epic-section id="judgements" kind="judgements"></epic-section>
            <epic-section id="caveats" kind="caveats"></epic-section>
            <epic-section id="todos" kind="todos"></epic-section>
            <epic-section id="issues" kind="issues"></epic-section>
            <epic-section id="tests" kind="tests"></epic-section>
            <epic-section id="log" kind="log">
              <epic-event at="{{at}}">plan doc created</epic-event>
            </epic-section>
          </epic-page>
        </main>
      </div>
    </ui-root>
    <script src="../../packages/docs/tools/_assets/highlight.min.js"></script>
    <script src="../../packages/docs/tools/_assets/spell-ui.js"></script>
  </body>
</html>
