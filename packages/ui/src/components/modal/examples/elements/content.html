<!-- `src/components/modal/examples/content.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Shorthand header and content</h4>
    <button type="button" class="ui button" commandfor="modal-content-shorthand" command="--show">Show</button>
    <ui-modal id="modal-content-shorthand" header="Header" content="Content, from the attribute." closable>
      <ui-actions><ui-button class="ok">Action</ui-button></ui-actions>
    </ui-modal>
  </section>

  <section>
    <h4>Scrolling content</h4>
    <button type="button" class="ui button" commandfor="modal-content-scrolling" command="--show">Show terms</button>
    <ui-modal id="modal-content-scrolling" header="Terms" closable>
      <ui-content scrolling>
        <p>A scrolling content block caps its height and scrolls.</p>
        <p>Very long terms go here, paragraph after paragraph.</p>
        <p>And more of them, so that the block has to scroll.</p>
        <p>Until the very end.</p>
      </ui-content>
      <ui-actions><ui-button class="approve" primary>I agree</ui-button></ui-actions>
    </ui-modal>
  </section>
</div>
