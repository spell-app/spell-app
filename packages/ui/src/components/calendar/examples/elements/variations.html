<!-- `src/components/calendar/examples/variations.html` as element markup, plus positions and a first weekday. -->
<div class="ui-stack">
  <section>
    <h4>Sizes</h4>
    <div class="ui-cluster">
      <ui-calendar inline size="small" type="month" value="2026-09" locale="en-US" aria-label="Small"></ui-calendar>
      <ui-calendar inline size="large" type="month" value="2026-09" locale="en-US" aria-label="Large"></ui-calendar>
    </div>
  </section>

  <section>
    <h4>Inverted</h4>
    <ui-segment inverted>
      <ui-calendar inline inverted type="date" value="2026-09-30" locale="en-US" aria-label="Inverted"></ui-calendar>
    </ui-segment>
  </section>

  <section>
    <h4>Compact</h4>
    <ui-calendar inline compact type="month" value="2026-09" locale="en-US" aria-label="Compact"></ui-calendar>
  </section>

  <section>
    <h4>Coloured</h4>
    <div class="ui-cluster">
      <ui-calendar inline color="red" type="month" value="2026-09" locale="en-US" aria-label="Red"></ui-calendar>
      <ui-calendar inline color="teal" type="date" value="2026-09-12" locale="en-US" aria-label="Teal"></ui-calendar>
    </div>
  </section>

  <section>
    <h4>Fluid</h4>
    <ui-calendar fluid type="date" value="2026-09-30" locale="en-US" placeholder="Fluid date"></ui-calendar>
  </section>

  <section>
    <h4>Positions and the first day of the week</h4>
    <div class="ui-cluster">
      <ui-calendar position="top left" type="date" locale="en-US" placeholder="Opens above"></ui-calendar>
      <ui-calendar position="bottom right" type="date" locale="de-DE" placeholder="German, Monday first"></ui-calendar>
      <ui-calendar first-day-of-week="1" type="date" locale="en-US" placeholder="Monday first"></ui-calendar>
    </div>
  </section>
</div>
