<!-- `src/components/flag/examples/variations.html` as element markup. -->
<!-- Size:  `size="medium"` is the unsized 1em flag for elements, not Fomantic's 3em `.medium`. -->
<div class="ui-stack">
  <section>
    <h4>Size</h4>
    <p>
      <ui-flag country="fr" size="small"></ui-flag>
      <ui-flag country="fr" size="medium"></ui-flag>
      <ui-flag country="fr" size="large"></ui-flag>
      <ui-flag country="fr" size="big"></ui-flag>
      <ui-flag country="fr" size="huge"></ui-flag>
      <ui-flag country="fr" size="massive"></ui-flag>
    </p>
  </section>

  <section>
    <h4>Autosizing</h4>
    <h2><ui-flag country="de"></ui-flag>Header</h2>
    <p>
      <button type="button"><ui-flag country="it"></ui-flag>Button</button>
    </p>
    <p>
      <span style="font-size: 1.5em"><ui-flag country="es"></ui-flag>Larger text</span>
    </p>
    <p>
      <small><ui-flag country="se"></ui-flag>Smaller text</small>
    </p>
  </section>
</div>
