# spell_quart:  a Python spell program served as a web app on Quart, Flask's asyncio twin (epic python-target P20).
# - A program compiled to `py/asyncio` runs here, a game per visitor;  its page draws it in javascript.
# - Python's web server, in the spaces package (epic people-and-orgs P14;  it was py's `quart/`).
# - Run from the repo root:
#   - its tests:  `uv run --directory packages/spaces/src/server/py pytest`
#   - tidy it:  `uv run --directory packages/spaces/src/server/py ruff check --fix` and `... ruff format`
# - Spaces' own `yarn test` runs the tests too (its package.json), so `yarn review` does.
# - spell_core, in py's `core/`, stays standard library only:  the web is this package's.

[project]
name = "spell-quart"
version = "0.1.0"
description = "A Python spell program served as a web app, on Quart:  its page draws it, a game per visitor."
requires-python = ">=3.12"
dependencies = ["spell-core", "quart==0.22.0"]

[tool.uv.sources]
# py's `core/`, from here
spell-core = { path = "../../../../py/core", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# the package is `spell_quart/`, beside this file, not under `src/`
module-root = ""

[tool.pytest.ini_options]
testpaths = ["../../../../../tests/spaces/src/server/py/tests"]
addopts = ["--strict-markers"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear, naming, simplify, ruff's own
select = ["E", "W", "F", "I", "UP", "B", "N", "SIM", "RUF"]
