<!-- `src/components/ui-checkbox/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Read-only</h4>
    <ui-checkbox readonly selected>This checkbox is read-only</ui-checkbox>
  </section>

  <section>
    <h4>Checked</h4>
    <ui-checkbox checked>This checkbox comes pre-checked</ui-checkbox>
  </section>

  <section>
    <h4>Indeterminate</h4>
    <div class="ui-stack">
      <ui-checkbox indeterminate>Some of these</ui-checkbox>
      <ui-checkbox type="toggle" indeterminate>Some of those</ui-checkbox>
    </div>
  </section>

  <section>
    <h4>Disabled</h4>
    <div class="ui-stack">
      <ui-checkbox disabled>Disabled</ui-checkbox>
      <ui-checkbox type="toggle" disabled selected>Disabled toggle</ui-checkbox>
    </div>
  </section>
</div>
