<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Detail | Spell UI</title>
    <meta
      name="description"
      content="A detail is a label's dimmer second value, such as a count."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../_assets/site.css" />
    <script type="module" src="../_assets/site.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Detail">
      <ui-segment vertical class="site-masthead">
        <ui-container>
          <ui-menu icon floated="right" class="site-page-links" aria-label="About this page">
            <ui-item
              href="https://github.com/spell-app/spell-app/blob/main/packages/ui/site/components/ui-detail.html"
              icon="pen to square"
              aria-label="This page's source on GitHub"
              title="This page's source on GitHub"
            ></ui-item>
            <ui-item
              href="https://github.com/spell-app/spell-app/issues/new?title=ui-detail%3A%20%20"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Detail
            <ui-header>A detail is a label's dimmer second value, such as a count.</ui-header>
          </ui-header>
          <ui-docs-themes for="ui-detail" show="theme" class="site-themes"></ui-docs-themes>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history basic appearance="segmented" alignment="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  `<ui-detail>` in each owner that gives it a look (from the owners' own pages and
              `src/components/ui-parts/examples/elements/`), then its attributes.  The Content parts page
              (`ui-header.html`) shows every part together.
            -->
            <ui-section id="examples-owners" header="Owners" sticky collapsible dividing>
              <ui-section id="examples-owners-label" header="Label" sticky collapsible dividing>
                <ui-docs-example description="A label's detail:  a dimmer second value after its text.">
                  <ui-label icon="mail">Mail<ui-detail>23</ui-detail></ui-label>
                  <ui-label>Dogs<ui-detail>214</ui-detail></ui-label>
                  <ui-label color="blue">Veronika<ui-detail>Friend</ui-detail></ui-label>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-variations" header="Variations" sticky collapsible dividing>
              <ui-section id="examples-variations-link" header="Link" sticky collapsible dividing>
                <ui-docs-example description="With `href`, the detail is a link of its own.">
                  <ui-label color="teal">Tag<ui-detail href="#tags">See all</ui-detail></ui-label>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <ui-section id="usage-using-it" header="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-detail>` is a label's dimmer second value, such as a count: Fomantic's `.detail` inside a `ui label`.

                  - Slot it into a `<ui-label>`, after the label's text.
                  - `href` renders it as a link of its own (`<a class="detail">`), apart from the label.
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-owners" header="Owners" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-detail>` finds its nearest owner and sets `:state(in-<owner>)` on itself; `ui-parts.css` styles it by that
                  state. Its owners, and what each makes of it:

                  - [Label](ui-label.html) (`:state(in-label)`): dimmer and bold, after the label's text

                  Anywhere else it is an unstyled block. More on how parts find their owners: [Content parts](ui-header.html#usage-owners).
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-accessibility" header="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - Read together with the label's text ("Dogs 214"): make the pair make sense out loud, or give the label an
                    `aria-label`.
                  - With `href` it is a real `<a>`: **Tab** reaches it, **Enter** follows it.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json`);  nothing to write. -->
            <ui-docs-api tag="ui-detail"></ui-docs-api>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
