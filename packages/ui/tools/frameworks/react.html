<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>React 19 host -- smoke page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./frameworks.css" />
  </head>
  <body>
    <h1>React 19</h1>
    <p>
      React 19 sets <code>options</code> / <code>value</code> / <code>open</code> as PROPERTIES (<code
        >"options" in el</code
      >) and listens through <code>onui-change</code>.
    </p>
    <div id="root"></div>
    <pre id="result">checking...</pre>
    <script type="module">
      import "@spell/ui"
      import React from "https://esm.sh/react@19"
      import { createRoot } from "https://esm.sh/react-dom@19/client"
      import { OPTIONS, roundTrip } from "./check.js"

      const h = React.createElement

      /** Controlled dropdown:  React owns `value` and `open`;  the element reports through `ui-*` events. */
      function App() {
        const [value, setValue] = React.useState("b")
        const [open, setOpen] = React.useState(true)
        return h(
          "div",
          null,
          h("ui-dropdown", {
            selection: true,
            placeholder: "Fruit",
            options: OPTIONS,
            value,
            open,
            "onui-change": (event) => setValue(event.detail.value),
            "onui-open": () => setOpen(true),
            "onui-close": () => setOpen(false)
          }),
          h("p", null, "React state: ", h("output", { id: "value" }, value)),
          h("button", { id: "set", type: "button", onClick: () => setValue("c") }, "set cherry"),
          h("button", { id: "open", type: "button", onClick: () => setOpen(true) }, "open")
        )
      }
      createRoot(document.querySelector("#root")).render(h(App))
      roundTrip(`react ${React.version}`)
    </script>
  </body>
</html>
