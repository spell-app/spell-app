<!-- `src/components/ui-rating/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Size</h4>
    <div class="ui-stack ui-align-items-start">
      <ui-rating size="mini" value="3" aria-label="Mini"></ui-rating>
      <ui-rating size="tiny" value="3" aria-label="Tiny"></ui-rating>
      <ui-rating size="small" value="3" aria-label="Small"></ui-rating>
      <ui-rating size="large" value="3" aria-label="Large"></ui-rating>
      <ui-rating size="huge" value="3" aria-label="Huge"></ui-rating>
      <ui-rating size="massive" value="3" aria-label="Massive"></ui-rating>
    </div>
  </section>

  <section>
    <h4>Colors</h4>
    <div class="ui-stack ui-align-items-start">
      <ui-rating color="red" value="2" max-rating="3" aria-label="Red"></ui-rating>
      <ui-rating color="orange" value="2" max-rating="3" aria-label="Orange"></ui-rating>
      <ui-rating color="yellow" value="2" max-rating="3" aria-label="Yellow"></ui-rating>
      <ui-rating color="green" value="2" max-rating="3" aria-label="Green"></ui-rating>
      <ui-rating color="blue" value="2" max-rating="3" aria-label="Blue"></ui-rating>
      <ui-rating color="violet" value="2" max-rating="3" aria-label="Violet"></ui-rating>
    </div>
  </section>
</div>
