<!-- `src/components/ui-input/examples/types.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Input</h4>
    <ui-input placeholder="Search..." aria-label="Search"></ui-input>
  </section>

  <section>
    <h4>Native types</h4>
    <div class="ui-cluster">
      <ui-input type="password" placeholder="Password" aria-label="Password"></ui-input>
      <ui-input type="email" placeholder="E-mail" aria-label="E-mail"></ui-input>
      <ui-input type="number" placeholder="Quantity" aria-label="Quantity"></ui-input>
      <ui-input type="date" aria-label="Date"></ui-input>
    </div>
  </section>

  <section>
    <h4>Textarea</h4>
    <ui-textarea fluid rows="3" placeholder="Tell us more" aria-label="Tell us more"></ui-textarea>
  </section>
</div>
