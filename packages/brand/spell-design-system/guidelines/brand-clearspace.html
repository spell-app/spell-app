<!-- @dsCard group="Brand" viewport="700x200" name="Mark: clear space & misuse" subtitle="Clear space = brim height; never rotate, outline or gradient" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;box-sizing:border-box}</style></head><body><div style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px;height:160px;align-items:stretch"><div style="border:1px dashed var(--violet-300);border-radius:12px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(224,214,255,.35) 6px 7px)"><div style="background:#fff;padding:18px"><img class="sp-logo__mark" src="../assets/logo/logo-mark-aubergine.svg" alt="" style="display:block;height:64px;"></div></div><div style="border-radius:12px;background:var(--neutral-50);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative"><img class="sp-logo__mark" src="../assets/logo/logo-mark-aubergine.svg" alt="" style="display:block;height:52px;transform:rotate(-24deg)"><span style="font:500 12px var(--font-sans);color:var(--danger)">✕ Don’t rotate</span></div><div style="border-radius:12px;background:var(--neutral-50);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative"><img class="sp-logo__mark" src="../assets/logo/logo-mark-aubergine.svg" alt="" style="display:block;height:52px;background:linear-gradient(90deg,#ff5fa2,#6F4CC7,#29c6ff)"><span style="font:500 12px var(--font-sans);color:var(--danger)">✕ No gradients</span></div><div style="border-radius:12px;background:var(--neutral-50);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative"><img class="sp-logo__mark" src="../assets/logo/logo-mark-aubergine.svg" alt="" style="display:block;height:52px;opacity:.35"><span style="font:500 12px var(--font-sans);color:var(--danger)">✕ No low contrast</span></div></div></body></html>
