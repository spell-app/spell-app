<!--
  Button variations, after Fomantic's docs (elements/button.html, "Variations").
-->
<div class="ui-stack">
  <section>
    <h4>Size</h4>
    <button class="ui mini button">Mini</button>
    <button class="ui tiny button">Tiny</button>
    <button class="ui small button">Small</button>
    <button class="ui medium button">Medium</button>
    <button class="ui large button">Large</button>
    <button class="ui big button">Big</button>
    <button class="ui huge button">Huge</button>
    <button class="ui massive button">Massive</button>
  </section>

  <section>
    <h4>Floated</h4>
    <div style="display: flow-root">
      <button class="ui right floated button">Right Floated</button>
      <button class="ui left floated button">Left Floated</button>
    </div>
  </section>

  <section>
    <h4>Colored</h4>
    <button class="ui red button">Red</button>
    <button class="ui orange button">Orange</button>
    <button class="ui yellow button">Yellow</button>
    <button class="ui olive button">Olive</button>
    <button class="ui green button">Green</button>
    <button class="ui teal button">Teal</button>
    <button class="ui blue button">Blue</button>
    <button class="ui violet button">Violet</button>
    <button class="ui purple button">Purple</button>
    <button class="ui pink button">Pink</button>
    <button class="ui brown button">Brown</button>
    <button class="ui grey button">Grey</button>
    <button class="ui black button">Black</button>
  </section>

  <section>
    <h4>Basic colored</h4>
    <button class="ui red basic button">Red</button>
    <button class="ui yellow basic button">Yellow</button>
    <button class="ui green basic button">Green</button>
    <button class="ui blue basic button">Blue</button>
    <button class="ui black basic button">Black</button>
  </section>

  <section>
    <h4>Compact</h4>
    <button class="ui compact button">Hold</button>
    <button class="ui compact icon button" aria-label="Pause">
      <svg class="icon" viewBox="0 0 384 512" aria-hidden="true">
        <path
          d="M48 32C21.5 32 0 53.5 0 80L0 432c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48L48 32zm224 0c-26.5 0-48 21.5-48 48l0 352c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48l-64 0z"
        />
      </svg>
    </button>
    <button class="ui compact labeled icon button">
      <svg class="icon" viewBox="0 0 384 512" aria-hidden="true">
        <path
          d="M48 32C21.5 32 0 53.5 0 80L0 432c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48L48 32zm224 0c-26.5 0-48 21.5-48 48l0 352c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48l-64 0z"
        />
      </svg>
      Pause
    </button>
  </section>

  <section>
    <h4>Positive / negative</h4>
    <button class="ui positive button">Positive Button</button>
    <button class="ui negative button">Negative Button</button>
  </section>

  <section>
    <h4>Fluid</h4>
    <button class="ui fluid button">Fits container</button>
  </section>

  <section>
    <h4>Circular</h4>
    <button class="ui circular icon button" aria-label="Settings">
      <svg class="icon" viewBox="0 0 512 512" aria-hidden="true">
        <path
          d="M195.1 9.5C198.1-5.3 211.2-16 226.4-16l59.8 0c15.2 0 28.3 10.7 31.3 25.5L332 79.5c14.1 6 27.3 13.7 39.3 22.8l67.8-22.5c14.4-4.8 30.2 1.2 37.8 14.4l29.9 51.8c7.6 13.2 4.9 29.8-6.5 39.9L447 233.3c.9 7.4 1.3 15 1.3 22.7s-.5 15.3-1.3 22.7l53.4 47.5c11.4 10.1 14 26.8 6.5 39.9l-29.9 51.8c-7.6 13.1-23.4 19.2-37.8 14.4l-67.8-22.5c-12.1 9.1-25.3 16.7-39.3 22.8l-14.4 69.9c-3.1 14.9-16.2 25.5-31.3 25.5l-59.8 0c-15.2 0-28.3-10.7-31.3-25.5l-14.4-69.9c-14.1-6-27.2-13.7-39.3-22.8L73.5 432.3c-14.4 4.8-30.2-1.2-37.8-14.4L5.8 366.1c-7.6-13.2-4.9-29.8 6.5-39.9l53.4-47.5c-.9-7.4-1.3-15-1.3-22.7s.5-15.3 1.3-22.7L12.3 185.8c-11.4-10.1-14-26.8-6.5-39.9L35.7 94.1c7.6-13.2 23.4-19.2 37.8-14.4l67.8 22.5c12.1-9.1 25.3-16.7 39.3-22.8L195.1 9.5zM256.3 336a80 80 0 1 0 -.6-160 80 80 0 1 0 .6 160z"
        />
      </svg>
    </button>
    <button class="ui circular blue icon button" aria-label="Like">
      <svg class="icon" viewBox="0 0 512 512" aria-hidden="true">
        <path
          d="M80 160c17.7 0 32 14.3 32 32l0 256c0 17.7-14.3 32-32 32l-48 0c-17.7 0-32-14.3-32-32L0 192c0-17.7 14.3-32 32-32l48 0zM270.6 16C297.9 16 320 38.1 320 65.4l0 4.2c0 6.8-1.3 13.6-3.8 19.9L288 160 448 160c26.5 0 48 21.5 48 48 0 19.7-11.9 36.6-28.9 44 17 7.4 28.9 24.3 28.9 44 0 23.4-16.8 42.9-39 47.1 4.4 7.3 7 15.8 7 24.9 0 22.2-15 40.8-35.4 46.3 2.2 5.5 3.4 11.5 3.4 17.7 0 26.5-21.5 48-48 48l-87.9 0c-36.3 0-71.6-12.4-99.9-35.1L184 435.2c-15.2-12.1-24-30.5-24-50l0-186.6c0-14.9 3.5-29.6 10.1-42.9L226.3 43.3C234.7 26.6 251.8 16 270.6 16z"
        />
      </svg>
    </button>
    <button class="ui circular button">Circular text</button>
  </section>

  <section>
    <h4>Vertically attached</h4>
    <div>
      <button class="ui top attached button">Top</button>
      <p class="ui-p-m" style="margin: 0; border-inline: 1px solid var(--ui-border-color)">Segment</p>
      <button class="ui bottom attached button">Bottom</button>
    </div>
  </section>

  <section>
    <h4>Horizontally attached</h4>
    <button class="ui left attached button">Left</button><button class="ui right attached button">Right</button>
  </section>
</div>
