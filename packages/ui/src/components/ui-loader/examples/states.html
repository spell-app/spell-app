<!--
  Loader states, after Fomantic's docs (elements/loader.html, "States").
  Fomantic puts these loaders in a dimmed segment;  here they sit in plain positioned boxes.
-->
<div class="ui-stack">
  <section>
    <h4>Indeterminate</h4>
    <div
      style="position: relative; height: 8em; border: 1px solid var(--ui-border-color); border-radius: var(--ui-radius)"
    >
      <div class="ui active indeterminate text loader" role="status">Preparing files</div>
    </div>
  </section>

  <section>
    <h4>Active</h4>
    <div
      style="position: relative; height: 8em; border: 1px solid var(--ui-border-color); border-radius: var(--ui-radius)"
    >
      <div class="ui active loader" role="status" aria-label="Loading…"></div>
    </div>
  </section>

  <section>
    <h4>Disabled</h4>
    <div
      style="position: relative; height: 8em; border: 1px solid var(--ui-border-color); border-radius: var(--ui-radius)"
    >
      <div class="ui active disabled loader"></div>
    </div>
  </section>
</div>
