<!-- `src/components/ui-progress/examples/types.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Standard</h4>
    <ui-progress value="74" bar-text="percent" aria-label="Standard"></ui-progress>
  </section>

  <section>
    <h4>Indicating</h4>
    <div class="ui-stack">
      <ui-progress indicating value="12" label="{percent}% funded"></ui-progress>
      <ui-progress indicating value="47" label="{percent}% funded"></ui-progress>
      <ui-progress indicating value="91" label="{percent}% funded"></ui-progress>
    </div>
  </section>
</div>
