<!--
  `<ui-author>` standalone and in each owner (a feed's `user`).
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <span class="author">Matt</span>
  </section>

  <section>
    <h4>In owners</h4>
    <div class="ui comments">
      <div class="comment">
        <div class="content in-comment"><a class="author in-comment" href="#matt">Matt</a></div>
      </div>
    </div>
    <div class="ui feed">
      <div class="event">
        <div class="content in-feed">
          <div class="summary in-feed"><a class="author in-feed" href="#elliot">Elliot Fu</a> posted on his page</div>
        </div>
      </div>
    </div>
  </section>
</div>
