<!--
  `<ui-title>` standalone and in each owner.
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <div class="title">A title with no owner is an unstyled block.</div>
  </section>

  <section>
    <h4>In owners</h4>
    <div class="ui steps">
      <div class="step">
        <div class="content in-step"><div class="title in-step">Shipping</div></div>
      </div>
    </div>
    <div class="ui steps">
      <div class="active step" style="--_ui-step-state: active">
        <div class="content in-step"><div class="title in-step">Active step</div></div>
      </div>
    </div>
    <div class="ui accordion"><div class="title in-accordion">What is a dog?</div></div>
    <div class="ui styled accordion" style="--_ui-accordion-style: styled">
      <div class="title in-accordion">Styled title</div>
      <div class="title in-accordion">Second title</div>
    </div>
    <div class="ui search">
      <div class="results">
        <div class="result">
          <div class="content in-search"><div class="title in-search">Search result</div></div>
        </div>
      </div>
    </div>
  </section>
</div>
