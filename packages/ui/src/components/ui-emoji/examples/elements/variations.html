<!-- `src/components/ui-emoji/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Size</h4>
    <p>
      <ui-emoji name="grinning_face_with_smiling_eyes" size="small"></ui-emoji>
      <ui-emoji name="grinning_face_with_smiling_eyes"></ui-emoji>
      <ui-emoji name="grinning_face_with_smiling_eyes" size="large"></ui-emoji>
      <ui-emoji name="grinning_face_with_smiling_eyes" size="big"></ui-emoji>
    </p>
  </section>

  <section>
    <h4>Link</h4>
    <p>
      <button type="button" aria-label="React with a heart" style="border: 0; background: none; padding: 0">
        <ui-emoji name="red_heart" link></ui-emoji>
      </button>
    </p>
  </section>

  <section>
    <h4>Disabled</h4>
    <p><ui-emoji name="grinning_face_with_smiling_eyes" disabled></ui-emoji></p>
  </section>

  <section>
    <h4>Loading</h4>
    <p><ui-emoji name="hourglass_done" loading></ui-emoji></p>
  </section>
</div>
