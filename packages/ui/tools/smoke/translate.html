<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Translated tags -- smoke page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <h1>Translated tags, from <code>dist/</code></h1>
    <p>
      <ie-boton primario tamano="grande">Guardar</ie-boton>
      <ie-boton color="rojo" basic>Borrar</ie-boton>
      <ie-boton color="azul" tamano="pequeno" disabled="yes">Desactivado</ie-boton>
    </p>
    <p>
      <ie-desplegable seleccion marcador="Elige un color" id="colores">
        <ui-item value="r">Rojo</ui-item>
        <ui-item value="v">Verde</ui-item>
        <ui-item value="a">Azul</ui-item>
      </ie-desplegable>
    </p>
    <p>Último <code>ie-cambio</code>: <output id="value">(ninguno)</output></p>
    <pre id="result">checking...</pre>
    <script type="module">
      import { flush } from "solid-js"
      import { UIButton, UIDropdown } from "@spell/ui"
      import { es } from "/test/dictionary.es.ts"

      UIButton.define("ie-boton", es)
      UIDropdown.define("ie-desplegable", es)

      const dropdown = document.querySelector("#colores")
      const output = document.querySelector("#value")
      dropdown.addEventListener("ie-cambio", (event) => (output.textContent = JSON.stringify(event.detail.value)))
      const buttons = [...document.querySelectorAll("ie-boton")]
      await Promise.all([...buttons, dropdown].map((element) => element.ready))
      flush()
      const classes = buttons.map((button) => button.shadowRoot.querySelector("button").className)
      dropdown.open = true
      flush()
      dropdown.shadowRoot.querySelector("[role=option]:last-of-type").click()
      flush()
      buttons[1].color = "verde"
      flush()
      const checks = {
        largePrimary: classes[0] === "ui large primary button",
        redBasic: classes[1] === "ui red basic button",
        smallBlueDisabled: classes[2] === "ui small blue disabled button",
        localizedEvent: output.textContent === '"a"',
        localizedPropertyValue:
          buttons[1].color === "green" &&
          buttons[1].getAttribute("color") === "verde" &&
          buttons[1].shadowRoot.querySelector("button").className === "ui green basic button"
      }
      const ok = Object.values(checks).every(Boolean)
      window.smokeResult = { ok, label: "es (ie-boton, ie-desplegable)", checks }
      document.querySelector("#result").textContent = `${ok ? "PASS" : "FAIL"} ${JSON.stringify({ classes, checks })}`
    </script>
  </body>
</html>
