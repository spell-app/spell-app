<!--
  Section states, after Fomantic's header / segment / accordion docs.
  Light-DOM markup in the class grammar `ui-section.css` styles inside `<ui-section>`'s shadow root:  the title
  bar (`header.title` > `hN.heading` > `.toggle`, then the badge and actions), the subhead and the content.
-->
<div class="ui-stack">
  <section>
    <h4>Collapsed</h4>
    <section class="ui bordered section">
      <header class="title">
        <h2 class="heading">
          <button type="button" class="toggle" aria-expanded="false" aria-controls="section-collapsed-content">
            <span class="fold icon"
              ><svg viewBox="0 0 448 512" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M201.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 338.7 54.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"
                /></svg></span
            ><span class="icon"
              ><svg viewBox="0 0 512 512" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M256 512a256 256 0 1 0 0-512 256 256 0 1 0 0 512zm0-336c-17.7 0-32 14.3-32 32 0 13.3-10.7 24-24 24s-24-10.7-24-24c0-44.2 35.8-80 80-80s80 35.8 80 80c0 47.2-36 67.2-56 74.5l0 3.8c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-8.1c0-20.5 14.8-35.2 30.1-40.2 6.4-2.1 13.2-5.5 18.2-10.3 4.3-4.2 7.7-10 7.7-19.6 0-17.7-14.3-32-32-32zM224 368a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"
                /></svg></span
            ><span class="header">Details</span>
          </button>
        </h2>
      </header>
      <div id="section-collapsed-content" class="content" hidden="until-found">
        <p>Folded: only the title shows.</p>
      </div>
    </section>
  </section>

  <section>
    <h4>Loading</h4>
    <section class="ui bordered loading section" aria-busy="true">
      <header class="title">
        <h2 class="heading">
          <span class="toggle"
            ><span class="icon"
              ><svg viewBox="0 0 512 512" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M448 256a192 192 0 1 0 -384 0 192 192 0 1 0 384 0zM0 256a256 256 0 1 1 512 0 256 256 0 1 1 -512 0zm256 80a80 80 0 1 0 0-160 80 80 0 1 0 0 160zm0-224a144 144 0 1 1 0 288 144 144 0 1 1 0-288zM224 256a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"
                /></svg></span
            ><span class="header">Results</span></span
          >
        </h2>
      </header>
      <div class="content"><p>Dimmed under a spinner while busy.</p></div>
    </section>
  </section>

  <section>
    <h4>Disabled</h4>
    <section class="ui disabled dividing section">
      <header class="title">
        <h2 class="heading">
          <button type="button" class="toggle" aria-expanded="true" aria-controls="section-disabled-content" disabled>
            <span class="fold icon"
              ><svg viewBox="0 0 448 512" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M201.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 338.7 54.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"
                /></svg></span
            ><span class="header">Archived</span>
          </button>
        </h2>
      </header>
      <div id="section-disabled-content" class="content"><p>Dimmed and inert: it can't be folded.</p></div>
    </section>
  </section>
</div>
