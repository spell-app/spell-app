<!--
  `<ui-description>` standalone and in each owner.
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <div class="description">A description with no owner is an unstyled block.</div>
  </section>

  <section>
    <h4>In owners</h4>
    <div class="ui card">
      <div class="content in-card">
        <div class="header in-card">Elliot</div>
        <div class="description in-card">Card description after a header.</div>
      </div>
    </div>
    <div class="ui items">
      <div class="item">
        <div class="content in-item"><div class="description in-item">Item description.</div></div>
      </div>
    </div>
    <div class="ui comments">
      <div class="comment">
        <div class="content in-comment"><div class="description in-comment">How artistic!</div></div>
      </div>
    </div>
    <div class="ui modal">
      <div class="image content in-modal">
        <img
          src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
          alt=""
          width="100"
        />
        <div class="description in-modal">Modal description beside an image.</div>
      </div>
    </div>
    <div class="ui list">
      <div class="item">
        <div class="content in-list"><div class="description in-list">List description.</div></div>
      </div>
    </div>
    <div class="ui steps">
      <div class="step">
        <div class="content in-step">
          <div class="title in-step">Billing</div>
          <div class="description in-step">Enter billing information</div>
        </div>
      </div>
    </div>
    <div class="ui search">
      <div class="results">
        <div class="result">
          <div class="content in-search">
            <div class="title in-search">Result</div>
            <div class="description in-search">Search description.</div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
