<!--
  Progress content, after Fomantic's docs (modules/progress.html, "Content"):  bar, progress text, label.
-->
<div class="ui-stack">
  <section>
    <h4>Bar</h4>
    <div class="ui progress" data-percent="30">
      <div class="bar" style="width: 30%"></div>
    </div>
  </section>

  <section>
    <h4>Progress</h4>
    <div class="ui progress" data-percent="60">
      <div class="bar" style="width: 60%"><div class="progress">60%</div></div>
    </div>
  </section>

  <section>
    <h4>Ratio</h4>
    <div class="ui progress" data-percent="45">
      <div class="bar" style="width: 45%"><div class="progress">9 of 20</div></div>
    </div>
  </section>

  <section>
    <h4>Label</h4>
    <div class="ui progress" data-percent="55">
      <div class="bar" style="width: 55%"><div class="progress">55%</div></div>
      <div class="label">Uploading Files</div>
    </div>
  </section>
</div>
