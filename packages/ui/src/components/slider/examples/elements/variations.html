<!-- `src/components/slider/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Reversed</h4>
    <ui-slider reversed value="6" aria-label="Reversed"></ui-slider>
  </section>

  <section>
    <h4>Vertical</h4>
    <div class="ui-cluster">
      <ui-slider vertical value="6" style="height: 180px" aria-label="Vertical"></ui-slider>
      <ui-slider vertical reversed value="6" style="height: 180px" aria-label="Vertical reversed"></ui-slider>
    </div>
  </section>

  <section>
    <h4>Bottom aligned labels</h4>
    <ui-slider labeled ticked aligned="bottom" max="10" value="4" aria-label="Bottom labels"></ui-slider>
  </section>

  <section>
    <h4>Hover</h4>
    <ui-slider hover value="10" aria-label="Hover"></ui-slider>
  </section>

  <section>
    <h4>Basic</h4>
    <ui-slider basic color="blue" value="10" aria-label="Basic"></ui-slider>
  </section>

  <section>
    <h4>Size</h4>
    <ui-slider size="small" value="4" aria-label="Small"></ui-slider>
    <ui-slider size="large" value="10" aria-label="Large"></ui-slider>
    <ui-slider size="big" value="16" aria-label="Big"></ui-slider>
  </section>

  <section>
    <h4>Colors</h4>
    <ui-slider color="red" value="4" aria-label="Red"></ui-slider>
    <ui-slider color="green" value="8" aria-label="Green"></ui-slider>
    <ui-slider color="blue" value="12" aria-label="Blue"></ui-slider>
    <ui-slider color="violet" value="16" aria-label="Violet"></ui-slider>
  </section>

  <section>
    <h4>Inverted</h4>
    <ui-segment inverted>
      <ui-slider inverted labeled ticked max="10" value="7" aria-label="Inverted"></ui-slider>
    </ui-segment>
  </section>
</div>
