<!doctype html>
<!--

  page-styles load="visible">` (`__parts/layout.html`), shaped like Epic UI's (`packages/epics/docs/__parts/footer.html`).
  - Relative links are rewritten against THIS file as served (`/components/brand/__parts/`) by `<ui-include>`:  the
    set's pages are `../x.html`, the checkout's root `../../../`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brand UI site footer</title>
  </head>
  <body>
    <ui-segment vertical class="site-footer-segment">
      <ui-container>
        <ui-grid stackable columns="3">
          <ui-column>
            <ui-header level="4">Brand UI</ui-header>
            <ui-list link>
              <ui-item href="../index.html" icon="wand magic sparkles">The Brand Elements</ui-item>
              <ui-item href="../brand-logo.html" icon="hat wizard">The logo</ui-item>
              <ui-item href="../brand-color-picker.html" icon="palette">The colour picker</ui-item>
            </ui-list>
          </ui-column>
          <ui-column>
            <ui-header level="4">Brand</ui-header>
            <ui-list link>
              <ui-item href="../../../brand/index.html" icon="swatchbook">The Brand tab</ui-item>
              <ui-item href="../../../guides/design-system/design-system.html" icon="book open"
                >The Design System</ui-item
              >
            </ui-list>
          </ui-column>
          <ui-column>
            <ui-header level="4">Project</ui-header>
            <ui-list link>
              <ui-item href="https://github.com/spell-app/spell-app" icon="github">GitHub repository</ui-item>
              <ui-item href="https://github.com/spell-app/spell-app/tree/main/packages/brand" icon="code">
                Source of the brand pack
              </ui-item>
              <ui-item href="https://github.com/spell-app/spell-app/tree/main/packages/brand/docs" icon="code">
                Source of these pages
              </ui-item>
            </ui-list>
          </ui-column>
        </ui-grid>
        <ui-divider section></ui-divider>
        <ui-list horizontal divided link size="small">
          <ui-item>Brand UI: the <code>&lt;brand-*&gt;</code> elements the Brand tab's pages are built from</ui-item>
          <ui-item>Spell UI's page shape, on Spell UI's site bundle</ui-item>
        </ui-list>
      </ui-container>
    </ui-segment>
  </body>
</html>
