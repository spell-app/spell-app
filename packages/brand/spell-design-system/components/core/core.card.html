<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;box-sizing:border-box}</style></head><body><div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="sp-btn sp-btn--primary"><i class="fa-solid fa-wand-magic-sparkles"></i>Build</button><button class="sp-btn sp-btn--ink">Get started</button><button class="sp-btn sp-btn--secondary">Cancel</button><button class="sp-btn sp-btn--soft">Open app <i class="fa-solid fa-arrow-right"></i></button><button class="sp-btn sp-btn--ghost">Skip</button><button class="sp-btn sp-btn--danger">Delete</button></div><div style="display:flex;gap:10px;align-items:center"><button class="sp-btn sp-btn--primary sp-btn--sm">Small</button><button class="sp-btn sp-btn--primary">Medium</button><button class="sp-btn sp-btn--primary sp-btn--lg">Large</button><button class="sp-btn sp-btn--primary" disabled>Disabled</button></div><div style="display:flex;gap:8px;align-items:center"><button class="sp-btn sp-iconbtn sp-btn--ghost"><i class="fa-solid fa-gear"></i></button><button class="sp-btn sp-iconbtn sp-btn--secondary"><i class="fa-solid fa-share-nodes"></i></button><button class="sp-btn sp-iconbtn sp-btn--soft"><i class="fa-solid fa-play"></i></button><button class="sp-btn sp-iconbtn sp-btn--primary"><i class="fa-solid fa-arrow-right"></i></button><div data-theme="dark" style="margin-left:16px;background:var(--bg-canvas);padding:8px;border-radius:999px;display:flex;gap:8px"><button class="sp-btn sp-btn--primary sp-btn--sm">+ Add habit</button><button class="sp-btn sp-btn--soft sp-btn--sm">Run</button></div></div></div></body></html>
