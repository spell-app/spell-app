<!-- `src/components/ui-modal/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Size</h4>
    <p class="ui-cluster">
      <button type="button" class="ui button" commandfor="modal-variations-mini" command="--show">Mini</button>
      <button type="button" class="ui button" commandfor="modal-variations-large" command="--show">Large</button>
    </p>
    <ui-modal id="modal-variations-mini" size="mini" header="Mini" content="A mini modal." closable></ui-modal>
    <ui-modal id="modal-variations-large" size="large" header="Large" content="A large modal." closable></ui-modal>
  </section>

  <section>
    <h4>Full screen, overlay full screen</h4>
    <p class="ui-cluster">
      <button type="button" class="ui button" commandfor="modal-variations-full" command="--show">Full</button>
      <button type="button" class="ui button" commandfor="modal-variations-overlay" command="--show">Overlay</button>
    </p>
    <ui-modal id="modal-variations-full" fullscreen header="Full screen" content="Nearly as wide." closable></ui-modal>
    <ui-modal
      id="modal-variations-overlay"
      overlay
      fullscreen
      header="Overlay full screen"
      content="Edge to edge."
      closable
    ></ui-modal>
  </section>

  <section>
    <h4>Inverted, top aligned</h4>
    <button type="button" class="ui button" commandfor="modal-variations-inverted" command="--show">Show</button>
    <ui-modal id="modal-variations-inverted" inverted vertical-align="top" header="Inverted" closable>
      <ui-content><p>The dark scheme, pinned near the top.</p></ui-content>
      <ui-actions><ui-button class="ok">OK</ui-button></ui-actions>
    </ui-modal>
  </section>
</div>
