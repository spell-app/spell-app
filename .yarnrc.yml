# Copied from spell-app's (epic `repo-split` P8):  the same settings and the one catalog of tool versions.
# - No `yarnPath`:  the yarn release lives once, in the top repo `spell`, whose install covers this repo
#   (`packageManager` in package.json names the version).
# - Keep the catalog in step with the top repo's:  bump them together (vite-plus and every `catalog:` entry).
approvedGitRepositories:
  - "**"

enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

# Hoist everything to the root `node_modules`, so there's ONE physical copy of each package version -- above all
# Solid, whose reactivity (owners, context, signals) breaks when two copies load.  Pinned by root `resolutions`.
# Tools find each other through `<package>/node_modules/.bin/*` (still created per package) or by resolving from
# the root;  NEVER hardcode `<package>/node_modules/<dep>`.  Set explicitly (not just omitted) so a parent folder's
# `.yarnrc.yml` -- e.g. a worktree nested inside another checkout -- can't impose a limit.
nmHoistingLimits: none

npmMinimalAgeGate: 0

npmPreapprovedPackages:
  - vitest
  - "@vitest/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
  "@vitest/browser-playwright": 5.0.1
  "@vitest/coverage-v8": 5.0.1
  "@vitest/ui": 5.0.1
