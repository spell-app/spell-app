<!-- `src/components/accordion/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Active</h4>
    <ui-accordion styled open="1">
      <ui-title>Closed panel</ui-title>
      <ui-content><p>Hidden until opened.</p></ui-content>
      <ui-title>Open panel</ui-title>
      <ui-content><p>Shown: its title is the active one.</p></ui-content>
    </ui-accordion>
  </section>

  <section>
    <h4>Not exclusive</h4>
    <ui-accordion styled exclusive="no" open="0 1">
      <ui-title>First</ui-title>
      <ui-content
        ><p>Both panels can be open: <code>exclusive="no"</code>.</p></ui-content
      >
      <ui-title>Second</ui-title>
      <ui-content><p>Still open.</p></ui-content>
    </ui-accordion>
  </section>
</div>
