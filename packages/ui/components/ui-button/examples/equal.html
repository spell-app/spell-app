<!--
  Equal-width button groups:  ours (`equal`), not Fomantic's docs.  `equal` => `equal`;  each button as wide as the
  widest (a grid), or with `fluid` an equal share of the row.
-->
<div class="ui-stack">
  <section>
    <h4>Equal</h4>
    <div class="ui equal buttons">
      <button class="ui button">One</button>
      <button class="ui button">Two, a longer one</button>
      <button class="ui button">Three</button>
    </div>
  </section>

  <section>
    <h4>Equal and fluid</h4>
    <div class="ui basic equal fluid buttons">
      <button class="ui button">One</button>
      <button class="ui button">Two, a longer one</button>
      <button class="ui button">Three</button>
    </div>
  </section>

  <section>
    <h4>Equal, coloured</h4>
    <div class="ui primary equal buttons">
      <button class="ui button">Save</button>
      <button class="ui button">Save as draft</button>
    </div>
  </section>
</div>
