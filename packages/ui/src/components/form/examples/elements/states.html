<!-- `src/components/form/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Loading</h4>
    <ui-form loading>
      <form>
        <ui-field>
          <label for="fm-states-email-1">E-mail</label>
          <ui-input id="fm-states-email-1" type="email" placeholder="joe@schmoe.com"></ui-input>
        </ui-field>
      </form>
    </ui-form>
  </section>

  <section>
    <h4>Success</h4>
    <ui-form state="success">
      <form>
        <ui-field>
          <label for="fm-states-email-2">E-mail</label>
          <ui-input id="fm-states-email-2" type="email" placeholder="joe@schmoe.com"></ui-input>
        </ui-field>
        <ui-message state="success" header="Form Completed"><p>You're all signed up.</p></ui-message>
        <ui-message state="error"><p>Hidden: the form isn't in the error state.</p></ui-message>
      </form>
    </ui-form>
  </section>

  <section>
    <h4>Error</h4>
    <ui-form state="error">
      <form>
        <ui-field>
          <label for="fm-states-email-3">E-mail</label>
          <ui-input id="fm-states-email-3" type="email" placeholder="joe@schmoe.com"></ui-input>
        </ui-field>
        <ui-message state="error" header="Action Forbidden"
          ><p>You can only sign up for an account once.</p></ui-message
        >
      </form>
    </ui-form>
  </section>

  <section>
    <h4>Field error, warning, info</h4>
    <ui-form>
      <form>
        <ui-fields widths="2">
          <ui-field state="error">
            <label for="fm-states-first">First Name</label>
            <ui-input id="fm-states-first" placeholder="First Name"></ui-input>
          </ui-field>
          <ui-field state="warning">
            <label for="fm-states-last">Last Name</label>
            <ui-input id="fm-states-last" placeholder="Last Name"></ui-input>
          </ui-field>
        </ui-fields>
        <ui-field state="info">
          <label for="fm-states-nick">Nickname</label>
          <ui-input id="fm-states-nick" placeholder="Nickname"></ui-input>
        </ui-field>
      </form>
    </ui-form>
  </section>

  <section>
    <h4>Disabled field</h4>
    <ui-form>
      <form>
        <ui-field disabled>
          <label for="fm-states-disabled">Disabled</label>
          <ui-input id="fm-states-disabled" placeholder="Disabled" disabled></ui-input>
        </ui-field>
      </form>
    </ui-form>
  </section>
</div>
