<!-- `src/components/ui-tab/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Loading</h4>
    <ui-tabs tabular attached aria-label="Loading demo">
      <ui-tab label="First" loading><p>Loading content</p></ui-tab>
      <ui-tab label="Second">Second</ui-tab>
    </ui-tabs>
  </section>

  <section>
    <h4>Active and disabled</h4>
    <ui-tabs tabular attached aria-label="Disabled demo">
      <ui-tab label="First">First</ui-tab>
      <ui-tab label="Second" selected>Second</ui-tab>
      <ui-tab label="Third" disabled>Third</ui-tab>
    </ui-tabs>
  </section>
</div>
