<!-- `src/components/ui-select/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Sizes</h4>
    <div class="ui-stack">
      <ui-select size="mini" aria-label="Mini" value="a"><ui-item value="a">Mini</ui-item></ui-select>
      <ui-select size="small" aria-label="Small" value="a"><ui-item value="a">Small</ui-item></ui-select>
      <ui-select size="medium" aria-label="Medium" value="a"><ui-item value="a">Medium</ui-item></ui-select>
      <ui-select size="large" aria-label="Large" value="a"><ui-item value="a">Large</ui-item></ui-select>
      <ui-select size="massive" aria-label="Massive" value="a"><ui-item value="a">Massive</ui-item></ui-select>
    </div>
  </section>

  <section>
    <h4>Fluid</h4>
    <ui-select fluid placeholder="Fills its container"><ui-item value="a">A</ui-item></ui-select>
  </section>

  <section>
    <h4>Compact</h4>
    <ui-select compact aria-label="Compact" value="a">
      <ui-item value="a">Or</ui-item>
      <ui-item value="b">And</ui-item>
    </ui-select>
  </section>

  <section>
    <h4>Inverted</h4>
    <div class="ui-dark" style="padding: 1em; background: var(--ui-surface); color: var(--ui-text-color)">
      <ui-select inverted placeholder="Inverted"><ui-item value="a">A</ui-item></ui-select>
    </div>
  </section>
</div>
