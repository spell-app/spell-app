<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<style>body{margin:0}</style>
</helmet>
<div style="min-height:100vh;background:var(--bg-canvas);color:var(--text-body);font-family:var(--font-sans);padding:36px 40px 72px;box-sizing:border-box">
  <a data-backlink="1" href="Design%20System.dc.html" target="_top" style="position:fixed;right:16px;bottom:16px;z-index:100;display:flex;align-items:center;gap:8px;height:34px;padding:0 16px 0 12px;border-radius:999px;background:var(--surface-inverse);color:var(--text-inverse);box-shadow:var(--shadow-lg);font:500 13px/1 var(--font-sans);text-decoration:none;white-space:nowrap" style-hover="text-decoration:none;filter:brightness(1.1)"><i class="fa-solid fa-arrow-left"></i>Design System</a>
  <div style="max-width:1080px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;align-items:start">
    <nav style="position:sticky;top:24px;display:flex;flex-direction:column;gap:4px">
      <div style="font:500 11px/1 var(--font-mono);letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);padding:0 12px 8px">On this page</div>
      <sc-for list="{{ toc }}" as="t" hint-placeholder-count="6">
        <a href="{{ t.href }}" style="display:block;padding:8px 12px;border-radius:8px;font:500 13px/1.3 var(--font-sans);color:var(--text-body);text-decoration:none" style-hover="background:var(--surface-tint);color:var(--text-strong);text-decoration:none">{{ t.label }}</a>
      </sc-for>
      <div style="padding:12px 12px 0;font:400 12px/1.4 var(--font-sans);color:var(--text-subtle)">Shows the live readme.md, so it’s always current.</div>
    </nav>
    <article style="min-width:0;display:flex;flex-direction:column;gap:8px">
      <header style="display:flex;flex-direction:column;gap:8px;margin-bottom:8px">
        <div style="font:500 12px/1 var(--font-mono);letter-spacing:0.14em;text-transform:uppercase;color:var(--text-accent)">Design guide</div>
        <h1 style="margin:0;font:700 44px/1.05 var(--font-serif);letter-spacing:-0.02em;color:var(--text-strong)">How Spell looks and sounds.</h1>
        <p style="margin:0;font:italic 400 20px/1.3 var(--font-serif);color:var(--text-strong)">Voice, colour, type and the rules behind them.</p>
      </header>
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}"><div style="font:400 14px/1.5 var(--font-sans);color:var(--text-muted)">Loading the guide…</div></sc-if>
      {{ body }}
    </article>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { md: null };
  componentDidMount() { fetch(new URL('readme.md', location.href)).then(r => r.text()).then(md => this.setState({ md })).catch(() => this.setState({ md: '' })); }
  render_md(md) {
    const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const inline = t => esc(t)
      .replace(/`([^`]+)`/g, '<code style="font:400 0.88em/1 var(--font-mono);background:var(--surface-code);padding:2px 6px;border-radius:4px;color:var(--text-strong)">$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b style="color:var(--text-strong)">$1</b>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, l, h) => { const href = /\.dc\.html|^https?:/.test(h) ? h.replace(/ /g, '%20') : h; return `<a href="${href}" target="_top">${l}</a>`; });
    const lines = md.split('\n'); const out = []; const toc = []; let list = null, para = [];
    const flushP = () => { if (para.length) { out.push(`<p style="margin:0 0 12px;font:400 15px/1.65 var(--font-sans);color:var(--text-body);max-width:72ch;text-wrap:pretty">${inline(para.join(' '))}</p>`); para = []; } };
    const flushL = () => { if (list) { out.push(`<ul style="margin:0 0 16px;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:72ch">${list.map(li => `<li style="font:400 15px/1.6 var(--font-sans);color:var(--text-body);padding-left:4px">${inline(li)}</li>`).join('')}</ul>`); list = null; } };
    let n = 0, skippedTitle = false;
    for (const raw of lines) {
      const l = raw.replace(/\s+$/, '');
      let m;
      if (/^---+$/.test(l)) { flushP(); flushL(); out.push('<div style="height:1px;background:var(--border-subtle);margin:24px 0"></div>'); continue; }
      if ((m = l.match(/^(#{1,3})\s+(.*)$/))) {
        flushP(); flushL();
        const lvl = m[1].length, text = m[2];
        if (lvl === 1 && !skippedTitle) { skippedTitle = true; continue; }
        const id = 'g' + (n++);
        if (lvl <= 2) { toc.push({ label: text.replace(/[`*]/g, ''), href: '#' + id }); out.push(`<h2 id="${id}" style="margin:32px 0 12px;font:700 28px/1.15 var(--font-serif);letter-spacing:-0.012em;color:var(--text-strong);scroll-margin-top:24px">${inline(text)}</h2>`); }
        else out.push(`<h3 id="${id}" style="margin:20px 0 8px;font:700 19px/1.25 var(--font-serif);color:var(--text-strong)">${inline(text)}</h3>`);
        continue;
      }
      if ((m = l.match(/^\s*[-*]\s+(.*)$/))) { flushP(); (list = list || []).push(m[1]); continue; }
      if (list && /^\s{2,}\S/.test(l)) { list[list.length - 1] += ' ' + l.trim(); continue; }
      if (!l.trim()) { flushP(); flushL(); continue; }
      flushL(); para.push(l.trim());
    }
    flushP(); flushL();
    return { html: out.join(''), toc };
  }
  renderVals() {
    const md = this.state.md;
    if (md == null) return { loading: true, toc: [], body: null };
    const { html, toc } = this.render_md(md);
    return { loading: false, toc, body: React.createElement('div', { dangerouslySetInnerHTML: { __html: html } }) };
  }
}
</script>
</body>
</html>
