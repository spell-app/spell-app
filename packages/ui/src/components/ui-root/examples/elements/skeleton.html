  <ui-card>
    <ui-content>
      <ui-header>Report</ui-header>
      <ui-description>Shown once every component inside is ready; until then, placeholders.</ui-description>
    </ui-content>
  </ui-card>
  <ui-button primary>Save</ui-button>
  <ui-button>Cancel</ui-button>
</ui-root>
