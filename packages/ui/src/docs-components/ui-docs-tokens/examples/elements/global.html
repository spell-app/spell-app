<!-- `<ui-docs-tokens global>`:  the foundation tokens, a table per group;  `groups` picks some. -->
<div class="ui-stack">
  <ui-docs-tokens global groups="typography radii surfaces"></ui-docs-tokens>

  <ui-docs-tokens global playground tokens="--ui-font-size --ui-radius --ui-blue --ui-primary">
    <ui-button primary>Primary</ui-button>
    <ui-label color="blue">Blue</ui-label>
    <ui-input placeholder="Type here"></ui-input>
  </ui-docs-tokens>
</div>
