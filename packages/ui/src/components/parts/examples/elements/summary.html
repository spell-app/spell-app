<!-- `src/components/parts/examples/summary.html` as element markup. -->
<!-- Owners are the real elements. -->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <ui-summary>A summary with no owner is an unstyled block.</ui-summary>
  </section>

  <section>
    <h4>In a feed</h4>
    <ui-feed>
      <ui-event>
        <ui-content>
          <ui-summary>
            <ui-author href="#elliot">Elliot Fu</ui-author> added you as a friend
            <ui-date datetime="PT1H">1 hour ago</ui-date>
          </ui-summary>
        </ui-content>
      </ui-event>
    </ui-feed>
  </section>
</div>
