<!-- `src/components/statistic/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Horizontal</h4>
    <ui-statistic horizontal value="2,204" label="Views"></ui-statistic>
    <ui-statistics horizontal>
      <ui-statistic value="2,204" label="Views"></ui-statistic>
      <ui-statistic value="3,322" label="Downloads"></ui-statistic>
    </ui-statistics>
  </section>

  <section>
    <h4>Colored</h4>
    <ui-statistics size="mini">
      <ui-statistic color="red" value="27" label="Red"></ui-statistic>
      <ui-statistic color="green" value="14" label="Green"></ui-statistic>
      <ui-statistic color="blue" value="49" label="Blue"></ui-statistic>
      <ui-statistic color="violet" value="8" label="Violet"></ui-statistic>
    </ui-statistics>
  </section>

  <section>
    <h4>Inverted</h4>
    <ui-segment inverted>
      <ui-statistic inverted value="54" label="Inverted"></ui-statistic>
      <ui-statistic inverted color="red" value="27" label="Red"></ui-statistic>
    </ui-segment>
  </section>

  <section>
    <h4>Evenly divided</h4>
    <ui-statistics widths="3">
      <ui-statistic value="22" label="Saves"></ui-statistic>
      <ui-statistic value="31,200" label="Views"></ui-statistic>
      <ui-statistic value="22" label="Members"></ui-statistic>
    </ui-statistics>
  </section>

  <section>
    <h4>Floated</h4>
    <ui-segment clearing>
      <ui-statistic floated="right" value="2,204" label="Views"></ui-statistic>
      <p>Te eum doming eirmod, nominati pertinacia argumentum ad his. Ex eam alia facete scriptorem.</p>
    </ui-segment>
  </section>

  <section>
    <h4>Stackable</h4>
    <ui-statistics stackable widths="3">
      <ui-statistic value="7" label="Days"></ui-statistic>
      <ui-statistic value="12" label="Hours"></ui-statistic>
      <ui-statistic value="40" label="Minutes"></ui-statistic>
    </ui-statistics>
  </section>

  <section>
    <h4>Size</h4>
    <ui-statistic size="mini" value="2,204" label="Mini"></ui-statistic>
    <ui-statistic size="small" value="2,204" label="Small"></ui-statistic>
    <ui-statistic value="2,204" label="Medium"></ui-statistic>
    <ui-statistic size="large" value="2,204" label="Large"></ui-statistic>
    <ui-statistic size="huge" value="2,204" label="Huge"></ui-statistic>
  </section>
</div>
