<!-- `src/components/ui-form/examples/types.html` as element markup:  a `ui-form` element around a native `form`. -->
<ui-form>
  <form>
    <ui-field>
      <label for="fm-types-first">First Name</label>
      <ui-input id="fm-types-first" name="first-name" placeholder="First Name"></ui-input>
    </ui-field>
    <ui-field>
      <label for="fm-types-last">Last Name</label>
      <ui-input id="fm-types-last" name="last-name" placeholder="Last Name"></ui-input>
    </ui-field>
    <ui-field>
      <ui-checkbox name="terms">I agree to the Terms and Conditions</ui-checkbox>
    </ui-field>
    <ui-button type="submit">Submit</ui-button>
  </form>
</ui-form>
