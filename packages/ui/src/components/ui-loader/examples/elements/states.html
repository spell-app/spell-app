<!-- `src/components/ui-loader/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Indeterminate</h4>
    <div
      style="position: relative; height: 8em; border: 1px solid var(--ui-border-color); border-radius: var(--ui-radius)"
    >
      <ui-loader visible indeterminate text>Preparing files</ui-loader>
    </div>
  </section>

  <section>
    <h4>Active</h4>
    <div
      style="position: relative; height: 8em; border: 1px solid var(--ui-border-color); border-radius: var(--ui-radius)"
    >
      <ui-loader visible></ui-loader>
    </div>
  </section>

  <section>
    <h4>Disabled</h4>
    <div
      style="position: relative; height: 8em; border: 1px solid var(--ui-border-color); border-radius: var(--ui-radius)"
    >
      <ui-loader visible disabled></ui-loader>
    </div>
  </section>
</div>
