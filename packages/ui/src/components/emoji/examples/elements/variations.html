<!-- `src/components/emoji/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Size</h4>
    <p>
      <ui-emoji name="smile" size="small"></ui-emoji> <ui-emoji name="smile"></ui-emoji>
      <ui-emoji name="smile" size="large"></ui-emoji> <ui-emoji name="smile" size="big"></ui-emoji>
    </p>
  </section>

  <section>
    <h4>Link</h4>

        <ui-emoji name="heart" link></ui-emoji>

  <section>
    <h4>Disabled</h4>
    <p><ui-emoji name="smile" disabled></ui-emoji></p>
  </section>

  <section>
    <h4>Loading</h4>
    <p><ui-emoji name="hourglass" loading></ui-emoji></p>
  </section>
</div>
