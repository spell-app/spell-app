<!--
  `<ui-avatar>` standalone and in each owner.
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <span class="avatar" style="display: inline-block; width: 3em"
      ><img
        src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
        alt=""
    /></span>
  </section>

  <section>
    <h4>In owners</h4>
    <div class="ui comments">
      <div class="comment">
        <span class="avatar in-comment"
          ><img
            src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
            alt=""
        /></span>
        <div class="content in-comment">
          <a class="author in-comment" href="#matt">Matt</a>
          <div class="description in-comment">How artistic!</div>
        </div>
      </div>
    </div>
    <div class="ui card">
      <div class="content in-card">
        <span class="avatar in-card"
          ><img
            src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
            alt=""
        /></span>
        Elliot
      </div>
    </div>
    <div class="ui items">
      <div class="item">
        <div class="content in-item">
          <span class="avatar in-item" style="width: 2em; height: 2em"
            ><img
              src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
              alt=""
          /></span>
          Stevie
        </div>
      </div>
    </div>
  </section>
</div>
