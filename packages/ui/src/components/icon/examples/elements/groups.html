<!-- `src/components/icon/examples/groups.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Icons</h4>
    <ui-icons size="huge">
      <ui-icon name="circle outline" size="big"></ui-icon>
      <ui-icon name="user"></ui-icon>
    </ui-icons>
    <ui-icons size="huge">
      <ui-icon name="ban" size="big" color="red"></ui-icon>
      <ui-icon name="user" color="black"></ui-icon>
    </ui-icons>
  </section>

  <section>
    <h4>Corner icon</h4>
    <ui-icons size="huge">
      <ui-icon name="puzzle-piece"></ui-icon>
      <ui-icon name="plus" corner></ui-icon>
    </ui-icons>
    <ui-icons size="huge">
      <ui-icon name="puzzle-piece"></ui-icon>
      <ui-icon name="plus" corner="top left"></ui-icon>
    </ui-icons>
    <ui-icons size="huge">
      <ui-icon name="puzzle-piece"></ui-icon>
      <ui-icon name="plus" corner="top right"></ui-icon>
    </ui-icons>
    <ui-icons size="huge">
      <ui-icon name="puzzle-piece"></ui-icon>
      <ui-icon name="plus" corner="bottom left"></ui-icon>
    </ui-icons>
    <ui-icons size="huge">
      <ui-icon name="puzzle-piece"></ui-icon>
      <ui-icon name="plus" corner="bottom right"></ui-icon>
    </ui-icons>
  </section>

  <section>
    <h4>Bordered and circular groups</h4>
    <ui-icons size="big" bordered>
      <ui-icon name="user"></ui-icon>
      <ui-icon name="gear" corner></ui-icon>
    </ui-icons>
    <ui-icons size="big" circular>
      <ui-icon name="user"></ui-icon>
      <ui-icon name="gear" corner="top right"></ui-icon>
    </ui-icons>
    <ui-icons size="big" circular inverted>
      <ui-icon name="user"></ui-icon>
      <ui-icon name="gear" inverted corner></ui-icon>
    </ui-icons>
  </section>

  <section>
    <h4>In text</h4>
    <p>
      <ui-icons size="large">
        <ui-icon name="twitter"></ui-icon>
        <ui-icon name="plus" inverted corner></ui-icon>
      </ui-icons>
      Add on Twitter
    </p>
  </section>
</div>
