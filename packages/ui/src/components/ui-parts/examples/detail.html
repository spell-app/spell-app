<!--
  `<ui-detail>` standalone and in its owner, the label.  The label boxes stand in for `ui label`s;  an image
  label sets the `--_ui-label-layout: image` owner token (`UILabel.css` does, on its root).
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <span class="detail">214</span>
  </section>

  <section>
    <h4>In a label</h4>
    <span
      class="ui label"
      style="display: inline-block; padding: 0.5833em 0.833em; background: var(--ui-surface-strong)"
      >Dogs<span class="detail in-label">214</span></span
    >
    <span
      class="ui image label"
      style="
        display: inline-block;
        padding: 0.5833em 0.833em;
        background: var(--ui-surface-strong);
        --_ui-label-layout: image;
      "
      >Veronika<span class="detail in-label">Friend</span></span
    >
  </section>
</div>
