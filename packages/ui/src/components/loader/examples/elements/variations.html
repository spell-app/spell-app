<!-- `src/components/loader/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Inline</h4>
    <p>Saving your changes <ui-loader active inline></ui-loader></p>
  </section>

  <section>
    <h4>Inline center</h4>
    <ui-loader active centered inline></ui-loader>
  </section>

  <section>
    <h4>Speed</h4>
    <div class="ui-cluster">
      <ui-loader speed="slow" active inline></ui-loader>
      <ui-loader active inline></ui-loader>
      <ui-loader speed="fast" active inline></ui-loader>
    </div>
  </section>

  <section>
    <h4>Colors</h4>
    <div class="ui-cluster">
      <ui-loader color="primary" active inline></ui-loader>
      <ui-loader color="secondary" active inline></ui-loader>
      <ui-loader color="red" active inline></ui-loader>
      <ui-loader color="orange" active inline></ui-loader>
      <ui-loader color="yellow" active inline></ui-loader>
      <ui-loader color="olive" active inline></ui-loader>
      <ui-loader color="green" active inline></ui-loader>
      <ui-loader color="teal" active inline></ui-loader>
      <ui-loader color="blue" active inline></ui-loader>
      <ui-loader color="violet" active inline></ui-loader>
      <ui-loader color="purple" active inline></ui-loader>
      <ui-loader color="pink" active inline></ui-loader>
      <ui-loader color="brown" active inline></ui-loader>
      <ui-loader color="grey" active inline></ui-loader>
      <ui-loader color="black" active inline></ui-loader>
    </div>
  </section>

  <section>
    <h4>Size</h4>
    <div class="ui-cluster">
      <ui-loader size="mini" active inline></ui-loader>
      <ui-loader size="tiny" active inline></ui-loader>
      <ui-loader size="small" active inline></ui-loader>
      <ui-loader size="medium" active inline></ui-loader>
      <ui-loader active inline></ui-loader>
      <ui-loader size="large" active inline></ui-loader>
      <ui-loader size="big" active inline></ui-loader>
      <ui-loader size="huge" active inline></ui-loader>
      <ui-loader size="massive" active inline></ui-loader>
    </div>
    <div class="ui-cluster">
      <ui-loader size="small" active inline text>Loading</ui-loader>
      <ui-loader active inline text>Loading</ui-loader>
      <ui-loader size="large" active inline text>Loading</ui-loader>
    </div>
  </section>

  <section>
    <h4>Inverted</h4>
    <div
      class="ui-dark"
      style="position: relative; height: 8em; border-radius: var(--ui-radius); background: var(--ui-background)"
    >
      <ui-loader active inverted text>Loading</ui-loader>
    </div>
    <div
      class="ui-dark ui-cluster"
      style="padding: 1em; border-radius: var(--ui-radius); background: var(--ui-background)"
    >
      <ui-loader color="red" active inverted inline></ui-loader>
      <ui-loader color="teal" active inverted inline></ui-loader>
      <ui-loader active inverted inline double></ui-loader>
    </div>
  </section>

  <section>
    <h4>Styles</h4>
    <div class="ui-cluster">
      <ui-loader active inline double></ui-loader>
      <ui-loader active inline elastic></ui-loader>
      <ui-loader color="blue" speed="slow" active inline double></ui-loader>
      <ui-loader color="green" speed="fast" active inline elastic></ui-loader>
      <ui-loader active inline indeterminate double></ui-loader>
    </div>
  </section>
</div>
