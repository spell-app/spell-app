<!doctype html>
<!--
  A brand element's docs page, in Spell UI's docs format (`packages/docs/content/templates/spell-ui-docs.html`):  masthead, then
  Examples / Usage / API / Theming tabs.  Without the Spell UI site's shell:  the site header on top, one page.
  - Loads `brand-docs.js` (`src/brand-docs.ts`):  the brand bundle + Spell UI's docs widgets;  API and tokens come
    from `_data/components.json` (`yarn site:data` here).
  - Example ids:  `<tab>-<section>-<example>`, as Spell UI's pages.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Brand Panel</title>
    <meta
      name="description"
      content="<ui-brand-panel>:  the brand's inspector panel, a tinted box of fields under a header band, with sub-head bands that fold."
    />
    <link rel="stylesheet" href="../_assets/ui/brand-ui.css" />
    <link rel="stylesheet" href="../_assets/brand-docs.css" />
    <script type="module" src="../_assets/ui/brand-docs.js"></script>
  </head>
  <body class="ui-typography">
    <spell-site-header root="../../.."></spell-site-header>
    <main id="main" class="brand-docs-main">
      <ui-segment vertical basic class="brand-docs-masthead">
        <ui-container>
          <div class="brand-docs-eyebrow"><a href="../index.html">Brand</a> · Components</div>
          <ui-header level="1" class="brand-docs-title">
            Brand Panel
            <ui-label color="yellow" size="small">New</ui-label>
            <ui-header
              >An inspector: a tinted box of fields under a header band, with sub-head bands that fold.</ui-header
            >
          </ui-header>
        </ui-container>
      </ui-segment>

      <ui-container class="brand-docs-body">
        <ui-tabs
          id="brand-docs-tabs"
          class="brand-docs-tabs"
          history
          basic
          appearance="segmented"
          alignment="fluid"
          equal
        >
          <ui-tab value="examples" label="Examples">
            <ui-section id="examples-types" header="Types" collapsible dividing>
              <ui-section id="examples-types-panel" header="Panel" collapsible dividing>
                <ui-docs-example
                  description="A panel is a tinted box under a header band:  `header` is the band's title.  Its content is a column of fields, 8px apart."
                >
                  <ui-brand-panel header="Theme" class="brand-docs-panel">
                    <ui-input placeholder="Name, e.g. sunrise" aria-label="Name"></ui-input>
                    <ui-brand-field label="Text size" value="16px">
                      <ui-slider min="13" max="19" value="16"></ui-slider>
                    </ui-brand-field>
                  </ui-brand-panel>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-types-sub-panels" header="Sub-panels" collapsible dividing>
                <ui-docs-example
                  description="A panel inside a panel is a SUB-HEAD BAND:  small capitals, a hairline above, reaching the box's edges.  Group a panel's fields under them."
                >
                  <ui-brand-panel header="Color Set" class="brand-docs-panel">
                    <ui-input placeholder="Name, e.g. brand" aria-label="Name"></ui-input>
                    <ui-brand-panel header="Tweak">
                      <ui-brand-field label="Vibrancy" value="100%">
                        <ui-slider min="0" max="200" step="20" value="100"></ui-slider>
                      </ui-brand-field>
                      <ui-brand-field label="Hue drift toward dark" value="0°">
                        <ui-slider min="-40" max="40" step="8" value="0"></ui-slider>
                      </ui-brand-field>
                    </ui-brand-panel>
                  </ui-brand-panel>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-types-collapsible" header="Collapsible" collapsible dividing>
                <ui-docs-example
                  description="`collapsible` bands fold and unfold when clicked;  `collapsed` starts one folded.  A folded LAST band closes the box, no gap under it."
                >
                  <ui-brand-panel header="Color Set" collapsible class="brand-docs-panel">
                    <ui-brand-panel header="Tweak" collapsible>
                      <ui-brand-field label="Vibrancy" value="100%">
                        <ui-slider min="0" max="200" step="20" value="100"></ui-slider>
                      </ui-brand-field>
                    </ui-brand-panel>
                    <ui-brand-panel header="Presets" collapsible collapsed>
                      <p>Six preset chips.</p>
                    </ui-brand-panel>
                  </ui-brand-panel>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-content" header="Content" collapsible dividing>
              <ui-section id="examples-content-actions" header="Actions" collapsible dividing>
                <ui-docs-example
                  description='`slot="actions"` puts small buttons at the end of a band, before the chevron:  a reset, a copy.'
                >
                  <ui-brand-panel header="CSS" collapsible class="brand-docs-panel">
                    <ui-button slot="actions" size="mini" circular basic icon="copy">Copy</ui-button>
                    <ui-code language="css"
                      ><script type="text/plain">
                        :root { --brand-500: #8e96b5; }
                      </script></ui-code
                    >
                  </ui-brand-panel>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-content-subhead" header="Subhead" collapsible dividing>
                <ui-docs-example description="`subhead` is a line of small, muted text under the band.">
                  <ui-brand-panel header="Theme" subhead="Saved to themes/sunrise.css" class="brand-docs-panel">
                    <ui-brand-field label="Corners" value="Round">
                      <ui-slider min="0" max="3" value="2"></ui-slider>
                    </ui-brand-field>
                  </ui-brand-panel>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-variations" header="Variations" collapsible dividing>
              <ui-section id="examples-variations-colors" header="Colors" collapsible dividing>
                <ui-docs-example
                  description="`color` paints the whole panel from a hue:  the header band, a lighter box, the border, the sub-head bands.  No `color` is `primary`;  `accent` is Polished Ivory;  sub-panels follow their panel's hue."
                >
                  <div class="brand-docs-row">
                    <ui-brand-panel header="Default">
                      <ui-brand-panel header="Tweak"
                        ><p>No <code>color</code>: primary.</p></ui-brand-panel
                      >
                    </ui-brand-panel>
                    <ui-brand-panel header="Accent" color="accent">
                      <ui-brand-panel header="Tweak"><p>Polished Ivory.</p></ui-brand-panel>
                    </ui-brand-panel>
                    <ui-brand-panel header="Violet" color="violet">
                      <ui-brand-panel header="Tweak"><p>Spell Purple.</p></ui-brand-panel>
                    </ui-brand-panel>
                    <ui-brand-panel header="Grey" color="grey">
                      <ui-brand-panel header="Tweak"><p>House of Owen.</p></ui-brand-panel>
                    </ui-brand-panel>
                    <ui-brand-panel header="Teal" color="teal">
                      <ui-brand-panel header="Tweak"><p>Any hue.</p></ui-brand-panel>
                    </ui-brand-panel>
                  </div>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-variations-tokens" header="Tokens" collapsible dividing>
                <ui-docs-example
                  description="Every colour, the radius and the padding are tokens (`--ui-brand-panel-*`):  set them on the panel or any ancestor.  The Theming tab lists them."
                >
                  <ui-brand-panel
                    header="Settings"
                    class="brand-docs-panel"
                    style="
                      --ui-brand-panel-background: var(--ui-surface);
                      --ui-brand-panel-header-background: var(--spell-surface-selected);
                      --ui-brand-panel-radius: 22px;
                    "
                  >
                    <ui-brand-field label="Notifications" inline>
                      <ui-checkbox type="toggle" selected></ui-checkbox>
                    </ui-brand-field>
                  </ui-brand-panel>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <ui-section id="usage-using-it" header="Using it" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  A `<ui-brand-panel>` is a `<ui-section>` in the brand's inspector look, so it takes every section
                  attribute: `header`, `subhead`, `icon`, `badge`, `collapsible`, `collapsed`, and the `header`,
                  `subhead`, `icon`, `badge` and `actions` slots.

                  - Put fields straight inside: `<ui-brand-field>`s, inputs, checkboxes. They stack 8px apart.
                  - Nest a panel to start a sub-head band; its fields follow it.
                  - `collapsed` is controlled: set it to fold or unfold; cancel `ui-open` / `ui-close` to keep the
                    user's click from changing it.
                </script>
              </ui-markdown>
              <ui-code language="js">
                <script type="text/plain">
                  document.querySelector("ui-brand-panel").addEventListener("ui-close", (event) => {
                    if (unsavedChanges) event.preventDefault() // keep it open
                  })
                </script>
              </ui-code>
            </ui-section>
            <ui-section id="usage-keyboard" header="Keyboard" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  A collapsible band is a button: Tab reaches it, Enter or Space folds and unfolds it. Find in page
                  opens a folded band when it matches text inside.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" header="Accessibility" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Each band is a real heading (`h2`, nested ones one level deeper), and a collapsible band's button
                  says whether it's expanded (`aria-expanded`) and which content it controls.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <ui-docs-api family="ui-brand-panel"></ui-docs-api>
          </ui-tab>

          <ui-tab value="theming" label="Theming">
            <ui-section id="theming-tokens" header="Tokens" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Set a `--ui-brand-panel-*` token on the panel, any ancestor or `:root`. The defaults come from the
                  panel's hue (`color`, else `primary`). Edit
                  a value below to try it.
                </script>
              </ui-markdown>
              <ui-docs-tokens family="ui-brand-panel" playground>
                <ui-brand-panel header="Color Set" collapsible class="brand-docs-panel">
                  <ui-input placeholder="Name, e.g. brand" aria-label="Name"></ui-input>
                  <ui-brand-panel header="Tweak" collapsible>
                    <ui-brand-field label="Vibrancy" value="100%">
                      <ui-slider min="0" max="200" step="20" value="100"></ui-slider>
                    </ui-brand-field>
                  </ui-brand-panel>
                </ui-brand-panel>
              </ui-docs-tokens>
            </ui-section>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
