<!-- `src/components/ui-loader/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Inline</h4>
    <p>Saving your changes <ui-loader visible inline></ui-loader></p>
  </section>

  <section>
    <h4>Inline center</h4>
    <ui-loader visible centered inline></ui-loader>
  </section>

  <section>
    <h4>Speed</h4>
    <div class="ui-cluster">
      <ui-loader speed="slow" visible inline></ui-loader>
      <ui-loader visible inline></ui-loader>
      <ui-loader speed="fast" visible inline></ui-loader>
    </div>
  </section>

  <section>
    <h4>Colors</h4>
    <div class="ui-cluster">
      <ui-loader color="primary" visible inline></ui-loader>
      <ui-loader color="secondary" visible inline></ui-loader>
      <ui-loader color="red" visible inline></ui-loader>
      <ui-loader color="orange" visible inline></ui-loader>
      <ui-loader color="yellow" visible inline></ui-loader>
      <ui-loader color="olive" visible inline></ui-loader>
      <ui-loader color="green" visible inline></ui-loader>
      <ui-loader color="teal" visible inline></ui-loader>
      <ui-loader color="blue" visible inline></ui-loader>
      <ui-loader color="violet" visible inline></ui-loader>
      <ui-loader color="purple" visible inline></ui-loader>
      <ui-loader color="pink" visible inline></ui-loader>
      <ui-loader color="brown" visible inline></ui-loader>
      <ui-loader color="grey" visible inline></ui-loader>
      <ui-loader color="black" visible inline></ui-loader>
    </div>
  </section>

  <section>
    <h4>Size</h4>
    <div class="ui-cluster">
      <ui-loader size="mini" visible inline></ui-loader>
      <ui-loader size="tiny" visible inline></ui-loader>
      <ui-loader size="small" visible inline></ui-loader>
      <ui-loader size="medium" visible inline></ui-loader>
      <ui-loader visible inline></ui-loader>
      <ui-loader size="large" visible inline></ui-loader>
      <ui-loader size="big" visible inline></ui-loader>
      <ui-loader size="huge" visible inline></ui-loader>
      <ui-loader size="massive" visible inline></ui-loader>
    </div>
    <div class="ui-cluster">
      <ui-loader size="small" visible inline text>Loading</ui-loader>
      <ui-loader visible inline text>Loading</ui-loader>
      <ui-loader size="large" visible inline text>Loading</ui-loader>
    </div>
  </section>

  <section>
    <h4>Inverted</h4>
    <div
      class="ui-dark"
      style="position: relative; height: 8em; border-radius: var(--ui-radius); background: var(--ui-background)"
    >
      <ui-loader visible inverted text>Loading</ui-loader>
    </div>
    <div
      class="ui-dark ui-cluster"
      style="padding: 1em; border-radius: var(--ui-radius); background: var(--ui-background)"
    >
      <ui-loader color="red" visible inverted inline></ui-loader>
      <ui-loader color="teal" visible inverted inline></ui-loader>
      <ui-loader visible inverted inline double></ui-loader>
    </div>
  </section>

  <section>
    <h4>Styles</h4>
    <div class="ui-cluster">
      <ui-loader visible inline double></ui-loader>
      <ui-loader visible inline elastic></ui-loader>
      <ui-loader color="blue" speed="slow" visible inline double></ui-loader>
      <ui-loader color="green" speed="fast" visible inline elastic></ui-loader>
      <ui-loader visible inline indeterminate double></ui-loader>
    </div>
  </section>
</div>
