<!--
  Progress states, after Fomantic's docs (modules/progress.html, "States").
-->
<div class="ui-stack">
  <section>
    <h4>Active</h4>
    <div class="ui active progress" data-percent="42">
      <div class="bar" style="width: 42%"><div class="progress">42%</div></div>
      <div class="label">Uploading Files</div>
    </div>
  </section>

  <section>
    <h4>Success</h4>
    <div class="ui success progress" data-percent="100">
      <div class="bar" style="width: 100%"><div class="progress">100%</div></div>
      <div class="label">Everything worked, your file is all ready.</div>
    </div>
  </section>

  <section>
    <h4>Warning</h4>
    <div class="ui warning progress" data-percent="100">
      <div class="bar" style="width: 100%"><div class="progress">100%</div></div>
      <div class="label">Your file didn't meet the minimum resolution requirements.</div>
    </div>
  </section>

  <section>
    <h4>Error</h4>
    <div class="ui error progress" data-percent="100">
      <div class="bar" style="width: 100%"><div class="progress">100%</div></div>
      <div class="label">There was an error.</div>
    </div>
  </section>

  <section>
    <h4>Disabled</h4>
    <div class="ui disabled progress" data-percent="80">
      <div class="bar" style="width: 80%"><div class="progress">80%</div></div>
      <div class="label">This progress bar is disabled</div>
    </div>
  </section>
</div>
