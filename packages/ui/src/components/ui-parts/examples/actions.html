<!--
  `<ui-actions>` standalone and in each owner.
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <div class="actions"><button type="button">OK</button></div>
  </section>

  <section>
    <h4>In owners</h4>
    <div class="ui comments">
      <div class="comment">
        <div class="content in-comment">
          <div class="actions in-comment"><a href="#reply">Reply</a><a href="#save">Save</a></div>
        </div>
      </div>
    </div>
    <div class="ui modal">
      <div class="header in-modal">Delete your account</div>
      <div class="actions in-modal"><button type="button">No</button><button type="button">Yes</button></div>
    </div>
    <div class="ui toast" style="padding: 1em">
      <div class="content in-toast">Saved</div>
      <div class="actions in-toast"><button type="button">Undo</button></div>
    </div>
  </section>
</div>
