<!--
  Comment states, after Fomantic's docs (views/comment.html, "States").
  Static class grammar `UIComment.css` styles:  the list, each comment (`.ui.comments .comment`) and its threads
  (`.comment > .comments`), and the content parts (`in-comment`, as `UIParts.css` expects static parts:  Fomantic's
  `.metadata` is `meta`, its `.text` is `description`);  element markup renders the same.
-->
<div class="ui-stack">
  <section>
    <h4>Disabled comment</h4>
    <div class="ui comments">
      <div class="disabled comment">
        <span class="avatar in-comment"
          ><img
            src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
            alt=""
        /></span>
        <div class="content in-comment">
          <a class="author in-comment" href="#matt">Matt</a>
          <div class="meta in-comment"><span>Today at 5:42PM</span></div>
          <div class="description in-comment">How artistic!</div>
          <div class="actions in-comment"><button type="button">Reply</button></div>
        </div>
      </div>
      <div class="comment">
        <span class="avatar in-comment"
          ><img
            src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
            alt=""
        /></span>
        <div class="content in-comment">
          <a class="author in-comment" href="#elliot-fu">Elliot Fu</a>
          <div class="meta in-comment"><span>Yesterday at 12:30AM</span></div>
          <div class="description in-comment">This has been very useful for my research. Thanks as well!</div>
          <div class="actions in-comment"><button type="button">Reply</button></div>
        </div>
      </div>
    </div>
  </section>
</div>
