<!-- `src/components/ui-reveal/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Active</h4>
    <ui-reveal move active>
      <img
        slot="visible"
        src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
        alt="Avatar"
        width="150"
        height="150"
      />
      <img
        slot="hidden"
        src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%230f766e%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23ccfbf1%22/%3E%3C/svg%3E"
        alt="Profile"
        width="150"
        height="150"
      />
    </ui-reveal>
  </section>

  <section>
    <h4>Disabled</h4>
    <ui-reveal move disabled>
      <img
        slot="visible"
        src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
        alt="Avatar"
        width="150"
        height="150"
      />
      <img
        slot="hidden"
        src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%230f766e%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23ccfbf1%22/%3E%3C/svg%3E"
        alt="Profile"
        width="150"
        height="150"
      />
    </ui-reveal>
  </section>

  <section>
    <h4>Focusable content</h4>
    <ui-reveal move="up">
      <img
        slot="visible"
        src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%225%22 cy=%224%22 r=%222%22 fill=%22%23e2e8f0%22/%3E%3C/svg%3E"
        alt="Avatar"
        width="150"
        height="150"
      />
      <a slot="hidden" href="#profile" style="display: block; width: 150px; line-height: 150px; text-align: center"
        >View profile</a
      >
    </ui-reveal>
  </section>
</div>
