<!-- `src/components/ui-rating/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Disabled</h4>
    <ui-rating disabled value="2" aria-label="Disabled"></ui-rating>
  </section>

  <section>
    <h4>Read-only</h4>
    <label for="rt-readonly">Read-only</label>
    <ui-rating id="rt-readonly" color="yellow" readonly value="3" max-rating="5"></ui-rating>
  </section>

  <section>
    <h4>Partial</h4>
    <ui-rating color="yellow" disabled value="3.5" max-rating="5" aria-label="Partial"></ui-rating>
  </section>
</div>
