<!-- `src/components/label/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Fluid</h4>
    <ui-label fluid>Fluid label</ui-label>
  </section>

  <section>
    <h4>Centered</h4>
    <ui-label fluid centered>Centered label</ui-label>
  </section>

  <section>
    <h4>Circular</h4>
    <ui-label color="red" circular>2</ui-label>
    <ui-label color="orange" circular>2</ui-label>
    <ui-label color="green" circular>22</ui-label>
    <ui-label color="blue" circular>222</ui-label>
    <ui-label color="red" empty circular></ui-label>
    <ui-label color="green" empty circular></ui-label>
  </section>

  <section>
    <h4>Basic</h4>
    <ui-label basic>Basic</ui-label>
    <ui-label basic pointing>Pointing</ui-label>
    <ui-label
      basic
      image="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22%3E%3Crect width=%221%22 height=%221%22 fill=%22%2394a3b8%22/%3E%3C/svg%3E"
      >Elliot</ui-label
    >
    <ui-label color="red" basic>Red</ui-label>
    <ui-label color="blue" basic pointing="below">Blue</ui-label>
  </section>

  <section>
    <h4>Colored</h4>
    <ui-label color="primary">Primary</ui-label>
    <ui-label color="secondary">Secondary</ui-label>
    <ui-label color="red">Red</ui-label>
    <ui-label color="orange">Orange</ui-label>
    <ui-label color="yellow">Yellow</ui-label>
    <ui-label color="olive">Olive</ui-label>
    <ui-label color="green">Green</ui-label>
    <ui-label color="teal">Teal</ui-label>
    <ui-label color="blue">Blue</ui-label>
    <ui-label color="violet">Violet</ui-label>
    <ui-label color="purple">Purple</ui-label>
    <ui-label color="pink">Pink</ui-label>
    <ui-label color="brown">Brown</ui-label>
    <ui-label color="grey">Grey</ui-label>
    <ui-label color="black">Black</ui-label>
  </section>

  <section>
    <h4>Basic tag</h4>
    <ui-label basic tag>Basic</ui-label>
    <ui-label color="red" basic tag>Red</ui-label>
  </section>

  <section>
    <h4>Size</h4>
    <ui-label size="mini">Mini</ui-label>
    <ui-label size="tiny">Tiny</ui-label>
    <ui-label size="small">Small</ui-label>
    <ui-label>Plain</ui-label>
    <ui-label size="medium">Medium</ui-label>
    <ui-label size="large">Large</ui-label>
    <ui-label size="big">Big</ui-label>
    <ui-label size="huge">Huge</ui-label>
    <ui-label size="massive">Massive</ui-label>
  </section>
</div>
