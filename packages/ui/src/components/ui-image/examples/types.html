<!--
  Image types, after Fomantic's docs (elements/image.html, "Types").
  Light-DOM markup in the class grammar `UIImage.css` styles inside `<ui-image>`'s shadow root:  a bare
  `<img class="ui image">`, or with `href` an `<a class="ui image">` around the `<img>`.
-->
<div class="ui-stack">
  <section>
    <h4>Image</h4>
    <img
      class="ui image"
      src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22480%22 height=%22320%22 viewBox=%220 0 30 20%22%3E%3Crect width=%2230%22 height=%2220%22 fill=%22%23cbd5e1%22/%3E%3Cpath d=%22M3 17l7-8 5 6 4-4 8 6z%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%2222%22 cy=%226%22 r=%222%22 fill=%22%2394a3b8%22/%3E%3C/svg%3E"
      alt=""
    />
  </section>

  <section>
    <h4>Image link</h4>
    <a class="ui image" href="#image-link"
      ><img
        src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22480%22 height=%22320%22 viewBox=%220 0 30 20%22%3E%3Crect width=%2230%22 height=%2220%22 fill=%22%23cbd5e1%22/%3E%3Cpath d=%22M3 17l7-8 5 6 4-4 8 6z%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%2222%22 cy=%226%22 r=%222%22 fill=%22%2394a3b8%22/%3E%3C/svg%3E"
        alt="A landscape"
    /></a>
  </section>
</div>
