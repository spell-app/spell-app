<!--
  Button content, after Fomantic's docs (elements/button.html, "Content").
  `.or` is `<ui-or>`'s shadow root;  `data-text` carries a translated word.
-->
<div class="ui-stack">
  <section>
    <h4>Conditionals</h4>
    <div class="ui buttons">
      <button class="ui button">Cancel</button>
      <div class="or"></div>
      <button class="ui positive button">Save</button>
    </div>
  </section>

  <section>
    <h4>Conditionals, translated</h4>
    <div class="ui buttons">
      <button class="ui button">un</button>
      <div class="or" data-text="ou"></div>
      <button class="ui button">deux</button>
    </div>
  </section>

  <section>
    <h4>Icon and text</h4>
    <button class="ui button">
      <svg class="icon" viewBox="0 0 576 512" aria-hidden="true">
        <path
          d="M0 336c0 79.5 64.5 144 144 144l304 0c70.7 0 128-57.3 128-128 0-51.6-30.5-96.1-74.5-116.3 6.7-13.1 10.5-28 10.5-43.7 0-53-43-96-96-96-17.7 0-34.2 4.8-48.4 13.1-24.1-45.8-72.2-77.1-127.6-77.1-79.5 0-144 64.5-144 144 0 8 .7 15.9 1.9 23.5-56.9 19.2-97.9 73.1-97.9 136.5z"
        />
      </svg>
      Upload
    </button>
    <button class="ui primary button">
      <svg class="icon" viewBox="0 0 448 512" aria-hidden="true">
        <path
          d="M256 32c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 210.7-41.4-41.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l96 96c12.5 12.5 32.8 12.5 45.3 0l96-96c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 242.7 256 32zM64 320c-35.3 0-64 28.7-64 64l0 32c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-32c0-35.3-28.7-64-64-64l-46.9 0-56.6 56.6c-31.2 31.2-81.9 31.2-113.1 0L110.9 320 64 320zm304 56a24 24 0 1 1 0 48 24 24 0 1 1 0-48z"
        />
      </svg>
      Download
    </button>
    <button class="ui button">
      Next
      <svg class="right icon" viewBox="0 0 512 512" aria-hidden="true">
        <path
          d="M502.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l370.7 0-105.4 105.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"
        />
      </svg>
    </button>
  </section>

  <section>
    <h4>Link</h4>
    <a class="ui button" href="#example">A link styled as a button</a>
  </section>
</div>
