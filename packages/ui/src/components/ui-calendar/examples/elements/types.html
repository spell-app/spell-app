<!-- `src/components/ui-calendar/examples/types.html` as element markup, plus a range. -->
<div class="ui-stack">
  <section>
    <h4>Date and time (Fomantic's default)</h4>
    <ui-calendar value="2026-09-30T14:30" locale="en-US" placeholder="Date and time" today></ui-calendar>
  </section>

  <section>
    <h4>Date, time, month, year</h4>
    <div class="ui-cluster">
      <ui-calendar type="date" locale="en-US" placeholder="Date"></ui-calendar>
      <ui-calendar type="time" locale="en-US" placeholder="Time"></ui-calendar>
      <ui-calendar type="month" locale="en-US" placeholder="Month"></ui-calendar>
      <ui-calendar type="year" locale="en-US" placeholder="Year"></ui-calendar>
    </div>
  </section>

  <section>
    <h4>Inline</h4>
    <div class="ui-cluster">
      <ui-calendar inline type="date" value="2026-09-30" locale="en-US" aria-label="Inline date"></ui-calendar>
      <ui-calendar inline type="month" value="2026-09" locale="en-US" aria-label="Inline month"></ui-calendar>
      <ui-calendar inline type="time" value="14:30" locale="en-US" aria-label="Inline time"></ui-calendar>
    </div>
  </section>

  <section>
    <h4>Range: two linked calendars</h4>
    <div class="ui-cluster">
      <ui-calendar
        id="range-start"
        end-calendar="range-end"
        type="date"
        value="2026-09-14"
        locale="en-US"
        placeholder="Start"
      ></ui-calendar>
      <ui-calendar
        id="range-end"
        start-calendar="range-start"
        type="date"
        value="2026-09-18"
        locale="en-US"
        placeholder="End"
      ></ui-calendar>
    </div>
  </section>
</div>
