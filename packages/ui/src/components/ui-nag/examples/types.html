<!--
  Nag types and variations, after Fomantic's docs (modules/nag.html).
  Light-DOM markup in the class grammar `UINag.css` styles inside `<ui-nag>`'s shadow root:  the bar, a title and the
  close icon.  `fixed` / `overlay` nags would leave the example's flow, so they sit in a positioned frame here.
-->
<div class="ui-stack">
  <section>
    <h4>Nag</h4>
    <div class="ui nag">
      <span class="title">We have updated our privacy policy.</span>
      <button type="button" class="close icon" aria-label="Close">
        <svg viewBox="0 0 384 512" aria-hidden="true">
          <path
            fill="currentColor"
            d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"
          />
        </svg>
      </button>
    </div>
  </section>

  <section>
    <h4>Overlay, bottom</h4>
    <div style="position: relative; height: 6em; border: 1px dashed var(--ui-border-color)">
      <div class="ui overlay nag"><span class="title">Over the top of the frame</span></div>
      <div class="ui bottom overlay nag"><span class="title">Over its bottom</span></div>
    </div>
  </section>

  <section>
    <h4>Inverted</h4>
    <div class="ui inverted nag"><span class="title">A light nag</span></div>
  </section>

  <section>
    <h4>Colored</h4>
    <div class="ui teal nag"><span class="title">A teal nag</span></div>
    <div class="ui red inverted nag"><span class="title">A tinted red nag</span></div>
  </section>

  <section>
    <h4>Sizes</h4>
    <div class="ui mini nag"><span class="title">Mini</span></div>
    <div class="ui small nag"><span class="title">Small</span></div>
    <div class="ui medium nag"><span class="title">Medium</span></div>
    <div class="ui large nag"><span class="title">Large</span></div>
    <div class="ui huge nag"><span class="title">Huge</span></div>
  </section>
</div>
