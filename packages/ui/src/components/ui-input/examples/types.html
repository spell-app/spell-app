<!--
  Input types, after Fomantic's docs (elements/input.html, "Types"), plus the native types the element passes
  through and a textarea (Fomantic styles one inside `.ui.input` / `.ui.form`).
-->
<div class="ui-stack">
  <section>
    <h4>Input</h4>
    <div class="ui input"><input type="text" placeholder="Search..." aria-label="Search" /></div>
  </section>

  <section>
    <h4>Native types</h4>
    <div class="ui-cluster">
      <div class="ui input"><input type="password" placeholder="Password" aria-label="Password" /></div>
      <div class="ui input"><input type="email" placeholder="E-mail" aria-label="E-mail" /></div>
      <div class="ui input"><input type="number" placeholder="Quantity" aria-label="Quantity" /></div>
      <div class="ui input"><input type="date" aria-label="Date" /></div>
    </div>
  </section>

  <section>
    <h4>Textarea</h4>
    <div class="ui fluid input">
      <textarea rows="3" placeholder="Tell us more" aria-label="Tell us more"></textarea>
    </div>
  </section>
</div>
