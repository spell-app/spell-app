<!-- `src/components/ui-button/examples/content.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Conditionals</h4>
    <ui-buttons>
      <ui-button>Cancel</ui-button>
      <ui-or></ui-or>
      <ui-button positive>Save</ui-button>
    </ui-buttons>
  </section>

  <section>
    <h4>Conditionals, translated</h4>
    <ui-buttons>
      <ui-button>un</ui-button>
      <ui-or text="ou"></ui-or>
      <ui-button>deux</ui-button>
    </ui-buttons>
  </section>

  <section>
    <h4>Icon and text</h4>
    <ui-button icon="cloud-arrow-up">Upload</ui-button>
    <ui-button primary icon="download">Download</ui-button>
    <ui-button content="Next" icon-position="right"
      ><svg slot="icon" viewBox="0 0 512 512" aria-hidden="true">
        <path
          d="M502.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l370.7 0-105.4 105.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"
        /></svg
    ></ui-button>
  </section>

  <section>
    <h4>Link</h4>
    <ui-button href="#example">A link styled as a button</ui-button>
  </section>
</div>
