# Self-contained install for the docs site;  mirrors the root `.yarnrc.yml` (same pinned yarn, same age gate).
enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

# Yarn 4.18 quarantines freshly published versions by default;  this repo tracks latest tooling.
npmMinimalAgeGate: 0

yarnPath: ../.yarn/releases/yarn-4.18.0.cjs
