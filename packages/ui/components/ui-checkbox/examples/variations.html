<!--
  Checkbox variations, after Fomantic's docs (modules/checkbox.html, "Variations").
  Left out:  compact / image invisible checkboxes.
-->
<div class="ui-stack">
  <section>
    <h4>Fitted</h4>
    <div class="ui-cluster">
      <div class="ui fitted checkbox">
        <input type="checkbox" id="cb-var-1" aria-label="Fitted" /><label for="cb-var-1"></label>
      </div>
      <div class="ui fitted slider checkbox">
        <input type="checkbox" id="cb-var-2" role="switch" aria-label="Fitted slider" /><label for="cb-var-2"></label>
      </div>
      <div class="ui fitted toggle checkbox">
        <input type="checkbox" id="cb-var-3" role="switch" aria-label="Fitted toggle" /><label for="cb-var-3"></label>
      </div>
    </div>
  </section>

  <section>
    <h4>Right aligned</h4>
    <div class="ui-stack">
      <div class="ui right aligned checkbox">
        <input type="checkbox" id="cb-var-4" /><label for="cb-var-4">Checkbox</label>
      </div>
      <div class="ui right aligned toggle checkbox">
        <input type="checkbox" id="cb-var-5" role="switch" checked /><label for="cb-var-5">Toggle</label>
      </div>
    </div>
  </section>

  <section>
    <h4>Invisible</h4>
    <div class="ui-cluster">
      <div class="ui invisible checkbox">
        <input type="checkbox" id="cb-var-6" /><label for="cb-var-6">Unchosen</label>
      </div>
      <div class="ui invisible checkbox">
        <input type="checkbox" id="cb-var-7" checked /><label for="cb-var-7">Chosen</label>
      </div>
    </div>
  </section>

  <section>
    <h4>Colored</h4>
    <div class="ui-cluster">
      <div class="ui red checkbox">
        <input type="checkbox" id="cb-var-8" checked /><label for="cb-var-8">Red</label>
      </div>
      <div class="ui green toggle checkbox">
        <input type="checkbox" id="cb-var-9" role="switch" checked /><label for="cb-var-9">Green</label>
      </div>
      <div class="ui blue slider checkbox">
        <input type="checkbox" id="cb-var-10" role="switch" checked /><label for="cb-var-10">Blue</label>
      </div>
      <div class="ui purple radio checkbox">
        <input type="radio" id="cb-var-11" name="cb-var-color" checked /><label for="cb-var-11">Purple</label>
      </div>
    </div>
  </section>

  <section>
    <h4>Inverted</h4>
    <div class="ui-dark ui-p-m ui-cluster" style="background: var(--ui-background)">
      <div class="ui inverted checkbox">
        <input type="checkbox" id="cb-var-12" /><label for="cb-var-12">Checkbox</label>
      </div>
      <div class="ui inverted toggle checkbox">
        <input type="checkbox" id="cb-var-13" role="switch" checked /><label for="cb-var-13">Toggle</label>
      </div>
      <div class="ui inverted slider checkbox">
        <input type="checkbox" id="cb-var-14" role="switch" /><label for="cb-var-14">Slider</label>
      </div>
    </div>
  </section>

  <section>
    <h4>Size</h4>
    <div class="ui-stack">
      <div class="ui mini checkbox"><input type="checkbox" id="cb-var-15" /><label for="cb-var-15">Mini</label></div>
      <div class="ui small toggle checkbox">
        <input type="checkbox" id="cb-var-16" role="switch" /><label for="cb-var-16">Small</label>
      </div>
      <div class="ui large radio checkbox">
        <input type="radio" id="cb-var-17" name="cb-var-size" /><label for="cb-var-17">Large</label>
      </div>
      <div class="ui huge checkbox">
        <input type="checkbox" id="cb-var-18" checked /><label for="cb-var-18">Huge</label>
      </div>
    </div>
  </section>
</div>
