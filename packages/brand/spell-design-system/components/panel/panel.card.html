<!-- @dsCard group="Components" viewport="700x420" name="Panel" subtitle="Panel · PanelHeader · PanelSubHead · Fieldset" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;box-sizing:border-box;background:var(--bg-canvas)}</style></head><body>
<div style="display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start">
<div class="sp-panel">
  <div class="sp-panel__header" aria-expanded="true"><span class="sp-panel__title">Color</span><i class="sp-panel__chevron fa-solid fa-chevron-up"></i></div>
  <div class="sp-panel__body"><input class="sp-input" value="brand"></div>
  <div class="sp-panel__subhead" aria-expanded="false"><span class="sp-panel__title">Presets</span><i class="sp-panel__chevron fa-solid fa-chevron-down"></i></div>
  <div class="sp-panel__subhead" aria-expanded="true"><span class="sp-panel__title">Tweak</span><i class="sp-panel__chevron fa-solid fa-chevron-up"></i></div>
  <div class="sp-panel__body">
    <fieldset class="sp-fieldset"><div class="sp-fieldset__row"><span>Vibrancy</span><span class="sp-fieldset__actions"><span class="sp-fieldset__value">100%</span></span><span class="sp-fieldset__icon"><i class="fa-solid fa-circle-info"></i></span></div><input type="range" style="accent-color:var(--accent)"></fieldset>
    <fieldset class="sp-fieldset"><div class="sp-fieldset__row"><span>Hue drift</span><span class="sp-fieldset__actions"><span class="sp-fieldset__value">0°</span></span><span class="sp-fieldset__icon"><i class="fa-solid fa-circle-info"></i></span></div><input type="range" style="accent-color:var(--accent)"></fieldset>
  </div>
</div>
<div style="font:400 13px/1.6 var(--font-sans);color:var(--text-muted)"><b style="color:var(--text-strong)">Panel</b> — the card.<br><b style="color:var(--text-strong)">PanelHeader</b> — top title band (14px, brand-100).<br><b style="color:var(--text-strong)">PanelSubHead</b> — collapsible group band (12px, tint).<br><b style="color:var(--text-strong)">Fieldset</b> — label · actions · value · icon · tooltip, then the control.</div>
</div></body></html>
