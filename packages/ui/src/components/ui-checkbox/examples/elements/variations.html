<!-- `src/components/ui-checkbox/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Fitted</h4>
    <div class="ui-cluster">
      <ui-checkbox fitted aria-label="Fitted"></ui-checkbox>
      <ui-checkbox fitted type="slider" aria-label="Fitted slider"></ui-checkbox>
      <ui-checkbox fitted type="toggle" aria-label="Fitted toggle"></ui-checkbox>
    </div>
  </section>

  <section>
    <h4>Right aligned</h4>
    <div class="ui-stack">
      <ui-checkbox right-aligned>Checkbox</ui-checkbox>
      <ui-checkbox right-aligned type="toggle" selected>Toggle</ui-checkbox>
    </div>
  </section>

  <section>
    <h4>Invisible</h4>
    <div class="ui-cluster">
      <ui-checkbox invisible>Unchosen</ui-checkbox>
      <ui-checkbox invisible selected>Chosen</ui-checkbox>
    </div>
  </section>

  <section>
    <h4>Colored</h4>
    <div class="ui-cluster">
      <ui-checkbox color="red" selected>Red</ui-checkbox>
      <ui-checkbox color="green" type="toggle" selected>Green</ui-checkbox>
      <ui-checkbox color="blue" type="slider" selected>Blue</ui-checkbox>
      <ui-radio color="purple" name="color" selected>Purple</ui-radio>
    </div>
  </section>

  <section>
    <h4>Inverted</h4>
    <div class="ui-dark ui-p-m ui-cluster" style="background: var(--ui-background)">
      <ui-checkbox inverted>Checkbox</ui-checkbox>
      <ui-checkbox inverted type="toggle" selected>Toggle</ui-checkbox>
      <ui-checkbox inverted type="slider">Slider</ui-checkbox>
    </div>
  </section>

  <section>
    <h4>Size</h4>
    <div class="ui-stack">
      <ui-checkbox size="mini">Mini</ui-checkbox>
      <ui-checkbox size="small" type="toggle">Small</ui-checkbox>
      <ui-radio size="large" name="size">Large</ui-radio>
      <ui-checkbox size="huge" selected>Huge</ui-checkbox>
    </div>
  </section>
</div>
