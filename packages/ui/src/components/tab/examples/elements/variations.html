<!-- `src/components/tab/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Vertical</h4>
    <ui-tabs vertical tabular aria-label="Vertical demo">
      <ui-tab label="Bio">This is a stretched grid column. This segment will always match the tab height.</ui-tab>
      <ui-tab label="Pics">Pictures</ui-tab>
      <ui-tab label="Companies">Companies</ui-tab>
    </ui-tabs>
  </section>

  <section>
    <h4>Bottom attached</h4>
    <ui-tabs tabular attached="bottom" aria-label="Bottom demo">
      <ui-tab label="First">First</ui-tab>
      <ui-tab label="Second">Second</ui-tab>
    </ui-tabs>
  </section>

  <section>
    <h4>Inverted</h4>
    <ui-segment inverted>
      <ui-tabs inverted pointing secondary aria-label="Inverted demo">
        <ui-tab label="First">First</ui-tab>
        <ui-tab label="Second">Second</ui-tab>
      </ui-tabs>
    </ui-segment>
  </section>

  <section>
    <h4>Colored and sized</h4>
    <ui-tabs size="small" color="red" pointing secondary aria-label="Colored demo">
      <ui-tab label="First">First</ui-tab>
      <ui-tab label="Second">Second</ui-tab>
    </ui-tabs>
  </section>

  <section>
    <h4>Icons</h4>
    <ui-tabs pointing secondary aria-label="Icon demo">
      <ui-tab label="Mail" icon="envelope">Inbox</ui-tab>
      <ui-tab label="Settings" icon="gear">Preferences</ui-tab>
    </ui-tabs>
  </section>
</div>
