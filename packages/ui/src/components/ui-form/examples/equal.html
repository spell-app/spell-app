<!--
  A row of equal fields with no count:  `<ui-fields equal>` => `equal width fields` (Fomantic's own class).
-->
<form class="ui form" onsubmit="return false">
  <div class="equal width fields">
    <div class="field">
      <label for="fm-equal-first">First name</label>
      <div class="ui input"><input type="text" id="fm-equal-first" placeholder="First Name" /></div>
    </div>
    <div class="field">
      <label for="fm-equal-middle">Middle name</label>
      <div class="ui input"><input type="text" id="fm-equal-middle" placeholder="Middle Name" /></div>
    </div>
    <div class="field">
      <label for="fm-equal-last">Last name</label>
      <div class="ui input"><input type="text" id="fm-equal-last" placeholder="Last Name" /></div>
    </div>
  </div>
</form>
