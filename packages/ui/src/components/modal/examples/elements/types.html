<!--
  `src/components/modal/examples/types.html` as element markup.  Each modal opens from a native button through an
  invoker command (`commandfor` + `command="--show"`);  the approve / deny buttons close it.
-->
<div class="ui-stack">
  <section>
    <h4>Standard</h4>
    <button type="button" class="ui button" commandfor="modal-types-standard" command="--show">Show</button>
    <ui-modal id="modal-types-standard" closable>
      <ui-header>Profile Picture</ui-header>
      <ui-content>
        <ui-description>
          <p>We've found the following gravatar image associated with your e-mail address.</p>
          <p>Is it okay to use this photo?</p>
        </ui-description>
      </ui-content>
      <ui-actions>
        <ui-button class="deny" color="black">Nope</ui-button>
        <ui-button class="approve" positive>Yep, that's me</ui-button>
      </ui-actions>
    </ui-modal>
  </section>

  <section>
    <h4>Basic</h4>
    <button type="button" class="ui button" commandfor="modal-types-basic" command="--show">Show basic</button>
    <ui-modal id="modal-types-basic" basic size="small" header="Archive Old Messages">
      <ui-content>
        <p>Your inbox is getting full. Would you like us to enable automatic archiving of old messages?</p>
      </ui-content>
      <ui-actions>
        <ui-button class="cancel" basic inverted>No</ui-button>
        <ui-button class="ok" color="green" inverted>Yes</ui-button>
      </ui-actions>
    </ui-modal>
  </section>
</div>
