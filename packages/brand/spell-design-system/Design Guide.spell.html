<!doctype html>
<!--
  Design Guide, on Spell UI:  the copy of `Design Guide.dc.html`.
  - Shows the live `readme.md` (the brand rules) with `<ui-markdown source>`, so it's always current;  its own
    title is dropped (`skip-title`:  the page has its own headline), as the original drops it.
  - "On this page":  the readme's top-level sections, built from the headings `<ui-markdown>` reports (`ui-render`);
    each a plain `#id` link, which `<ui-markdown>` reveals by itself (on `hashchange`, and on load).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Guide</title>
    <meta name="description" content="How Spell looks and sounds:  voice, colour, type and the rules behind them." />
    <link rel="stylesheet" href="../_assets/ui/brand-ui.css" />
    <style>
      /* page layout only:  every colour, font and radius comes from the theme's tokens */
      body {
        margin: 0;
        background: var(--ui-background);
        color: var(--spell-text-body);
        font: var(--spell-type-body);
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 36px 40px 72px;
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 48px;
        align-items: start;
      }

      /* ## "On this page":  sticky below the site header */
      nav {
        position: sticky;
        top: calc(var(--spell-site-header-height, 0px) + 24px);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      nav > h2 {
        margin: 0;
        padding: 0 12px 8px;
        font: 500 11px/1 var(--spell-font-mono);
        letter-spacing: var(--spell-tracking-eyebrow);
        text-transform: uppercase;
        color: var(--spell-text-muted);
      }
      /* a link list, each item an 8px-radius pill on hover */
      nav > ui-list {
        --ui-list-margin: 0;
        --ui-list-font-size: 13px;
        --ui-list-item-padding-block: 8px;
        --ui-list-item-padding-left: 12px;
        --ui-list-item-padding-right: 12px;
        --ui-list-item-first-padding-top: 8px;
        --ui-list-item-last-padding-bottom: 8px;
        --ui-list-item-margin: 0 0 4px;
        --ui-list-item-line-height: 1.3;
        --ui-list-item-radius: var(--ui-radius-s);
        --ui-list-link-color: var(--spell-text-body);
        --ui-list-link-hover-color: var(--spell-text-strong);
        --ui-list-link-down-color: var(--spell-text-strong);
        --ui-list-item-hover-background: var(--spell-surface-tint);
        --ui-list-item-down-background: var(--spell-surface-tint);
        font: var(--spell-type-ui);
      }
      nav > p {
        margin: 0;
        padding: 12px 12px 0;
        font: 400 12px/1.4 var(--spell-font-sans);
        color: var(--spell-text-subtle);
      }

      /* ## The guide:  eyebrow, headline, lede, then the readme */
      article {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      article > header {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }
      .eyebrow {
        font: var(--spell-type-eyebrow);
        letter-spacing: var(--spell-tracking-eyebrow);
        text-transform: uppercase;
        color: var(--spell-text-accent);
      }
      h1 {
        margin: 0;
        font: var(--spell-type-h1);
        font-size: 44px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: var(--spell-text-strong);
      }
      .lede {
        margin: 0;
        font: var(--spell-type-lede);
        line-height: 1.3;
        color: var(--spell-text-strong);
      }
      /* headings, rules and code look as the theme says (`spell-brand.css`);  the page sets the guide's size and measure */
      ui-markdown {
        --ui-font-size: 15px;
        --ui-markdown-line-height: 1.65;
        --ui-markdown-color: var(--spell-text-body);
        --ui-markdown-link-color: var(--spell-text-accent);
        --ui-markdown-radius: calc(var(--ui-radius-s) / 2);
        /* 72ch of the guide's 15px text, as the original */
        font-size: 15px;
        max-width: 72ch;
      }
    </style>
  </head>
  <body>
    <spell-site-header root="../../.."></spell-site-header>
    <main>
      <nav aria-labelledby="toc">
        <h2 id="toc">On this page</h2>
        <ui-list link></ui-list>
        <p>Shows the live readme.md, so it’s always current.</p>
      </nav>
      <article>
        <header>
          <span class="eyebrow">Design guide</span>
          <h1>How Spell looks and sounds.</h1>
          <p class="lede">Voice, colour, type and the rules behind them.</p>
        </header>
        <ui-markdown source="readme.md" skip-title></ui-markdown>
      </article>
    </main>
    <script type="module" src="../_assets/ui/brand-ui.js"></script>
    <script type="module">
      const guide = document.querySelector("ui-markdown")
      const toc = document.querySelector("nav > ui-list")

      // the table of contents:  every top-level section (`#` / `##`), from the headings of the last render
      guide.addEventListener("ui-render", ({ detail }) => {
        toc.replaceChildren(
          ...detail.headings.filter(({ level }) => level <= 2).map(({ text, id }) => tocItem(text, id))
        )
      })

      /** A list item linking to heading `id`:  `<ui-markdown>` reveals it on the `hashchange`. */
      function tocItem(text, id) {
        const item = document.createElement("ui-item")
        item.setAttribute("href", `#${id}`)
        item.textContent = text
        return item
      }
    </script>
  </body>
</html>
