<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@spell-app/ui: translation hook</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>&lt;ie-boton&gt; / &lt;ie-desplegable&gt;</h1>
    <p>
      <ie-boton primario>Guardar</ie-boton>
      <ie-boton color="rojo" tamano="grande">Borrar</ie-boton>
      <ie-boton alternable color="verde">Votar</ie-boton>
    </p>
    <p>
      <ie-desplegable seleccion marcador="Género" name="genero">
        <ui-item value="f">Femenino</ui-item>
        <ui-item value="m">Masculino</ui-item>
        <ui-item value="x">Otro</ui-item>
      </ie-desplegable>
    </p>
    <pre id="log"></pre>
    <script type="module" src="./translate.ts"></script>
  </body>
</html>
