<!--
  Checkbox types, after Fomantic's docs (modules/checkbox.html, "Types").
  Radios of one name share a group;  in class grammar they are plain native radios.
-->
<div class="ui-stack">
  <section>
    <h4>Checkbox</h4>
    <div class="ui checkbox">
      <input type="checkbox" id="cb-types-1" /><label for="cb-types-1">Make my profile visible</label>
    </div>
  </section>

  <section>
    <h4>Radio</h4>
    <div class="ui-stack">
      <div class="ui radio checkbox">
        <input type="radio" id="cb-types-2" name="cb-types-often" checked /><label for="cb-types-2">Once a week</label>
      </div>
      <div class="ui radio checkbox">
        <input type="radio" id="cb-types-3" name="cb-types-often" /><label for="cb-types-3">Once a day</label>
      </div>
    </div>
  </section>

  <section>
    <h4>Slider</h4>
    <div class="ui slider checkbox">
      <input type="checkbox" id="cb-types-4" role="switch" /><label for="cb-types-4">Accept terms and conditions</label>
    </div>
  </section>

  <section>
    <h4>Toggle</h4>
    <div class="ui toggle checkbox">
      <input type="checkbox" id="cb-types-5" role="switch" /><label for="cb-types-5"
        >Subscribe to weekly newsletter</label
      >
    </div>
  </section>
</div>
