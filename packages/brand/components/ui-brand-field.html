<!doctype html>
<!--
  A brand element's docs page, in Spell UI's docs format (`packages/docs/templates/spell-ui-docs.html`):  masthead, then
  Examples / Usage / API / Theming tabs.  Without the Spell UI site's shell:  the site header on top, one page.
  - Loads `brand-docs.js` (`src/brand-docs.ts`):  the brand bundle + Spell UI's docs widgets;  API and tokens come
    from `_data/components.json` (`yarn site:data` here).
  - Example ids:  `<tab>-<section>-<example>`, as Spell UI's pages.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Brand Field</title>
    <meta
      name="description"
      content="<ui-brand-field>:  one control with its label, a value readout, action buttons, an info tip, help and errors."
    />
    <link rel="stylesheet" href="../_assets/ui/brand-ui.css" />
    <link rel="stylesheet" href="../_assets/brand-docs.css" />
    <script type="module" src="../_assets/ui/brand-docs.js"></script>
  </head>
  <body class="ui-typography">
    <spell-site-header root="../../.."></spell-site-header>
    <main id="main" class="brand-docs-main">
      <ui-segment vertical basic class="brand-docs-masthead">
        <ui-container>
          <div class="brand-docs-eyebrow"><a href="../index.html">Brand</a> · Components</div>
          <ui-header level="1" class="brand-docs-title">
            Brand Field
            <ui-label color="yellow" size="small">New</ui-label>
            <ui-header>One control with its label, a value readout, actions, an info tip, help and errors.</ui-header>
          </ui-header>
        </ui-container>
      </ui-segment>

      <ui-container class="brand-docs-body">
        <ui-tabs
          id="brand-docs-tabs"
          class="brand-docs-tabs"
          history
          basic
          appearance="segmented"
          alignment="fluid"
          equal
        >
          <ui-tab value="examples" label="Examples">
            <ui-section id="examples-types" header="Types" collapsible dividing>
              <ui-section id="examples-types-inspector-field" header="Inspector field" collapsible dividing>
                <ui-docs-example
                  description="The brand's inspector row:  the label, then at the far end the actions, the value and an info tip;  the control right under it."
                >
                  <ui-brand-panel header="Tweak" class="brand-docs-panel">
                    <ui-brand-field label="Vibrancy" value="100%" info="How colourful the middle steps are.">
                      <ui-button slot="actions" size="mini" circular basic icon="rotate left">Reset</ui-button>
                      <ui-slider min="0" max="200" step="20" value="100"></ui-slider>
                    </ui-brand-field>
                  </ui-brand-panel>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-types-form-field" header="Form field" collapsible dividing>
                <ui-docs-example
                  description="In a form:  `label`, `help` under the control, `required` for the asterisk.  The label names the control for screen readers."
                >
                  <ui-brand-field label="App name" help="Shown on the home screen." required class="brand-docs-panel">
                    <ui-input value="Habit Tracker"></ui-input>
                  </ui-brand-field>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-content" header="Content" collapsible dividing>
              <ui-section id="examples-content-actions" header="Actions" collapsible dividing>
                <ui-docs-example
                  description='`slot="actions"`:  small buttons at the end of the label row, before the value.'
                >
                  <ui-brand-field label="Base color sits at" value="400" class="brand-docs-panel">
                    <ui-button slot="actions" size="mini" circular basic icon="check">Auto</ui-button>
                    <ui-slider min="0" max="16" value="6"></ui-slider>
                  </ui-brand-field>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-content-info-tip" header="Info tip" collapsible dividing>
                <ui-docs-example
                  description="`info` adds an (i) icon at the end of the row;  hover or tab to it for the tip.  The icon is described by the tip."
                >
                  <ui-brand-field
                    label="Hue drift toward dark"
                    value="+8°"
                    info="Turns the darkest steps warmer (+) or cooler (−), as real pigments do."
                    class="brand-docs-panel"
                  >
                    <ui-slider min="-40" max="40" step="8" value="8"></ui-slider>
                  </ui-brand-field>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-content-rich-label" header="Rich label and value" collapsible dividing>
                <ui-docs-example
                  description='`slot="label"` and `slot="value"` take markup:  a code word, a colour chip.'
                >
                  <ui-brand-field class="brand-docs-panel">
                    <span slot="label">Token <code>--brand-500</code></span>
                    <span slot="value">#8E96B5</span>
                    <ui-input value="#8E96B5" aria-label="--brand-500"></ui-input>
                  </ui-brand-field>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-states" header="States" collapsible dividing>
              <ui-section id="examples-states-error" header="Error" collapsible dividing>
                <ui-docs-example
                  description="`error` shows a message under the control and tints the label;  `<ui-form>`'s validation does the same through `showErrors()`."
                >
                  <ui-brand-field label="Email" error="That doesn't look like an email." class="brand-docs-panel">
                    <ui-input value="owen@" type="email"></ui-input>
                  </ui-brand-field>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-states-disabled" header="Disabled" collapsible dividing>
                <ui-docs-example description="`disabled`:  faded, and nothing inside can be used (`inert`).">
                  <ui-brand-field label="Dark mode surfaces" disabled class="brand-docs-panel">
                    <ui-select value="primary">
                      <ui-item value="primary">Primary</ui-item>
                      <ui-item value="neutral">Neutral</ui-item>
                    </ui-select>
                  </ui-brand-field>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-variations" header="Variations" collapsible dividing>
              <ui-section id="examples-variations-inline" header="Inline" collapsible dividing>
                <ui-docs-example description="`inline`:  the label row beside the control, for short controls.">
                  <ui-brand-field label="Notifications" inline class="brand-docs-panel">
                    <ui-checkbox type="toggle" selected></ui-checkbox>
                  </ui-brand-field>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <ui-section id="usage-using-it" header="Using it" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Wrap ONE control: `<ui-input>`, `<ui-slider>`, `<ui-select>`, a checkbox, or a native input.

                  - `label` names it; a click on the label focuses it.
                  - `value` is a READOUT, not the control's value: keep it in step from the control's `ui-change`.
                  - Put small buttons in `slot="actions"`; `info` adds a tip; `help` a line under the control.
                  - In a `<ui-form>`, validation finds the field as it finds a `<ui-field>`, and shows its messages
                    under the control.
                </script>
              </ui-markdown>
              <ui-code language="js">
                <script type="text/plain">
                  const field = document.querySelector("ui-brand-field")
                  field.querySelector("ui-slider").addEventListener("ui-change", (event) => {
                    field.setAttribute("value", `${event.detail.value}%`)
                  })
                </script>
              </ui-code>
            </ui-section>
            <ui-section id="usage-keyboard" header="Keyboard" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  The control keeps its own keys. Tab also reaches the info icon, which shows its tip while focused.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" header="Accessibility" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - A `<label for>` can't reach across the field's shadow root, so the field names the control itself:
                    `aria-label` from `label`, on a control that has no `aria-label` / `aria-labelledby` of its own.
                  - The info icon is an image named "More about <label>", described by its tip.
                  - Error messages are an alert: read out as they appear.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <ui-docs-api family="ui-brand-field"></ui-docs-api>
          </ui-tab>

          <ui-tab value="theming" label="Theming">
            <ui-section id="theming-tokens" header="Tokens" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Set a `--ui-brand-field-*` token on the field, any ancestor or `:root`. The defaults come from the
                  `spell-brand` theme's roles, with plain Spell UI tokens under any other theme. Edit a value below to
                  try it.
                </script>
              </ui-markdown>
              <ui-docs-tokens family="ui-brand-field" playground>
                <ui-brand-field
                  label="Vibrancy"
                  value="100%"
                  info="How colourful the middle steps are."
                  help="Above 100% can leave sRGB."
                  class="brand-docs-panel"
                >
                  <ui-slider min="0" max="200" step="20" value="100"></ui-slider>
                </ui-brand-field>
              </ui-docs-tokens>
            </ui-section>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
