<!--
  Placeholder types, after Fomantic's docs (elements/placeholder.html, "Types").
  Light-DOM markup in the class grammar `UIPlaceholder.css` styles inside the placeholder elements' shadow roots.
  Fomantic's card grid is plain bordered boxes here:  `UICard.css` isn't adopted.
-->
<div class="ui-stack">
  <section>
    <h4>Placeholder</h4>
    <div class="ui placeholder">
      <div class="image header">
        <div class="line"></div>
        <div class="line"></div>
      </div>
      <div class="paragraph">
        <div class="medium line"></div>
        <div class="short line"></div>
      </div>
    </div>
  </section>

  <section>
    <h4>Cards</h4>
    <div class="ui-grid" style="--min-column-size: 12em">
      <div style="padding: 1em; border: 1px solid var(--ui-border-color); border-radius: var(--ui-radius)">
        <div class="ui fluid placeholder">
          <div class="rectangular image"></div>
          <div class="header">
            <div class="very short line"></div>
            <div class="medium line"></div>
          </div>
          <div class="paragraph">
            <div class="short line"></div>
          </div>
        </div>
      </div>
      <div style="padding: 1em; border: 1px solid var(--ui-border-color); border-radius: var(--ui-radius)">
        <div class="ui fluid placeholder">
          <div class="rectangular image"></div>
          <div class="header">
            <div class="very short line"></div>
            <div class="medium line"></div>
          </div>
          <div class="paragraph">
            <div class="short line"></div>
          </div>
        </div>
      </div>
      <div style="padding: 1em; border: 1px solid var(--ui-border-color); border-radius: var(--ui-radius)">
        <div class="ui fluid placeholder">
          <div class="rectangular image"></div>
          <div class="header">
            <div class="very short line"></div>
            <div class="medium line"></div>
          </div>
          <div class="paragraph">
            <div class="short line"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h4>Consecutive placeholders</h4>
    <div>
      <div class="ui placeholder">
        <div class="image header">
          <div class="line"></div>
          <div class="line"></div>
        </div>
      </div>
      <div class="ui placeholder">
        <div class="image header">
          <div class="line"></div>
          <div class="line"></div>
        </div>
      </div>
      <div class="ui placeholder">
        <div class="image header">
          <div class="line"></div>
          <div class="line"></div>
        </div>
      </div>
    </div>
  </section>
</div>
