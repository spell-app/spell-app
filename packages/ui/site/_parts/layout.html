<!doctype html>
<!--
  The Spell UI site's LAYOUT:  every page's chrome, written ONCE.  A page's own file holds only its `<head>` and
  `<main id="main" class="site-main">`;  the site bundle wraps that `main` in this file's `<body>` on first load
  (`_src/SiteShell.ts`), and from then on the router (`_src/SiteRouter.ts`) swaps only the `main`, through a
  `<ui-include select="main#main">` in `.site-content`, while everything here stays on screen.
  - Relative URLs here are against THIS file (`_parts/`):  the shell makes them absolute as it mounts, so they hold
    whichever page is shown.
  - `<ui-root display="when-ready">`:  the page stays hidden until the layout is in and every element in it is
    ready, then shows at once:  no flash of unstyled markup (plan doc ui-docs-rework, D2).
  - `.site-content`:  the shell puts the page's `main` in here.
  - Only `<body>` is used.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spell UI site layout</title>
  </head>
  <body>
    <ui-root class="site" stack-with="page" icons="fa7-brands, fomantic" display="when-ready">
      <!--
        Top bar:  ONLY while the right column is hidden (narrower than 1200px);  wide screens have none (Owen:  "lose the
        top bar entirely").  The menu button and the brand only below 992px, where the nav panel moves into the flyout.
      -->
      <header class="site-topbar">
        <ui-button
          class="site-menu-button"
          icon="bars"
          basic
          circular
          aria-label="Components"
          title="Components"
          commandfor="site-nav-flyout"
          command="--show"
        ></ui-button>
        <ui-header class="site-topbar-brand"><a href="../index.html">Spell UI</a></ui-header>
        <spell-site-header docked root="../../../.."></spell-site-header>
        <ui-docs-themes size="small" class="site-topbar-themes"></ui-docs-themes>
      </header>

      <ui-flyout id="site-nav-flyout" position="left" inverted closable class="site-nav-flyout" aria-label="Components">
        <ui-docs-nav aria-label="Components (menu)">
          <ui-docs-themes slot="header" inverted size="small" class="site-flyout-themes"></ui-docs-themes>
        </ui-docs-nav>
      </ui-flyout>

      <div class="site-layout">
        <aside class="site-nav">
          <ui-docs-nav></ui-docs-nav>
        </aside>

        <div class="site-page">
          <div class="site-content"></div>
          <ui-include class="site-footer" source="footer.html" page-styles load="visible"></ui-include>
        </div>

        <!--
          Right column (1200px and wider):  its header holds the repo-wide site header, docked (Docs / Goals / Spell UI /
          App, branch, VS Code, edit), and the look controls;  then "On this page", which the router points at each page
          (`for` its tabs, `header` its main's data-toc-header).  Shown on every tab, the API tab too:  no width jump.
        -->
        <aside class="site-aside">
          <header class="site-aside-head">
            <spell-site-header docked root="../../../.."></spell-site-header>
            <ui-docs-themes size="small" class="site-aside-themes"></ui-docs-themes>
          </header>
          <ui-docs-toc class="site-toc"></ui-docs-toc>
        </aside>
      </div>
    </ui-root>
  </body>
</html>
