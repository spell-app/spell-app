<!-- `src/components/ui-tab/examples/appearance.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Segmented</h4>
    <ui-tabs appearance="segmented" aria-label="Segmented demo">
      <ui-tab label="Examples">Examples</ui-tab>
      <ui-tab label="Usage">Usage</ui-tab>
      <ui-tab label="API">API</ui-tab>
    </ui-tabs>
  </section>

  <section>
    <h4>Segmented, centered, equal</h4>
    <ui-tabs appearance="segmented" alignment="center" equal color="violet" aria-label="Segmented centered demo">
      <ui-tab label="Day">Day</ui-tab>
      <ui-tab label="Week" selected>Week</ui-tab>
      <ui-tab label="Month and year">Month and year</ui-tab>
    </ui-tabs>
  </section>

  <section>
    <h4>Pointing, fluid, equal</h4>
    <ui-tabs appearance="pointing" secondary alignment="fluid" equal aria-label="Pointing fluid demo">
      <ui-tab label="Bio">Bio</ui-tab>
      <ui-tab label="Photos and videos">Photos and videos</ui-tab>
      <ui-tab label="Friends">Friends</ui-tab>
    </ui-tabs>
  </section>

  <section>
    <h4>Tabular, right</h4>
    <ui-tabs appearance="tabular" alignment="right" attached aria-label="Tabular right demo">
      <ui-tab label="First">First</ui-tab>
      <ui-tab label="Second">Second</ui-tab>
    </ui-tabs>
  </section>
</div>
