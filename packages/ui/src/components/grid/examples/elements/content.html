<div class="ui-stack">
  <section>
    <h4>Rows</h4>
    <ui-grid columns="4">
      <ui-row>
        <ui-column><p>One</p></ui-column>
        <ui-column><p>Two</p></ui-column>
      </ui-row>
      <ui-row>
        <ui-column><p>Three</p></ui-column>
        <ui-column><p>Four</p></ui-column>
        <ui-column><p>Five</p></ui-column>

  <section>

      <ui-column><p>11</p></ui-column>
      <ui-column><p>12</p></ui-column>
      <ui-column><p>13</p></ui-column>
      <ui-column><p>14</p></ui-column>
      <ui-column><p>15</p></ui-column>
      <ui-column><p>16</p></ui-column>
    </ui-grid>
  </section>

  <section>
    <h4>A single column fills its line</h4>
    <ui-grid>
      <ui-column><p>Only child</p></ui-column>
    </ui-grid>
  </section>
</div>
