<!--
  Items states, after Fomantic's docs (views/item.html, "States").
  Static class grammar `UIItems.css` styles:  the group, its items (`.ui.items > .item`), their images, and the
  content parts (`in-item`, as `UIParts.css` expects static parts);  element markup is the GENERIC `<ui-item>` in a
  `<ui-items>`, which owns its parts there.
-->
<div class="ui-stack">
  <section>
    <h4>Disabled item</h4>
    <div class="ui items">
      <div class="disabled item">
        <img
          class="ui tiny image"
          src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%23cbd5e1%22/%3E%3Cpath d=%22M1 9l3-4 2 3 1-1 2 2z%22 fill=%22%2394a3b8%22/%3E%3C/svg%3E"
          alt=""
        />
        <div class="content in-item">
          <a class="header in-item" href="#cute-dog">Cute Dog</a>
          <div class="meta in-item"><span>Description</span></div>
          <div class="description in-item">
            <p>Many people also have their own barometers for what makes a cute dog.</p>
          </div>
        </div>
      </div>
      <div class="item">
        <img
          class="ui tiny image"
          src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%23cbd5e1%22/%3E%3Cpath d=%22M1 9l3-4 2 3 1-1 2 2z%22 fill=%22%2394a3b8%22/%3E%3C/svg%3E"
          alt=""
        />
        <div class="content in-item">
          <a class="header in-item" href="#arrowhead-valley-camp">Arrowhead Valley Camp</a>
          <div class="meta in-item"><span>$1200 1 month</span></div>
          <div class="description in-item"><p>Ours is a life of constant reruns.</p></div>
        </div>
      </div>
    </div>
  </section>
</div>
