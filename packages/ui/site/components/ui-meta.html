<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Meta | Spell UI</title>
    <meta
      name="description"
      content="A meta holds metadata about the content, such as a date or a category."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../_assets/site.css" />
    <script type="module" src="../_assets/site.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Meta">
      <ui-segment vertical class="site-masthead">
        <ui-container>
          <ui-menu icon floated="right" class="site-page-links" aria-label="About this page">
            <ui-item
              href="https://github.com/spell-app/spell-app/blob/main/packages/ui/site/components/ui-meta.html"
              icon="pen to square"
              aria-label="This page's source on GitHub"
              title="This page's source on GitHub"
            ></ui-item>
            <ui-item
              href="https://github.com/spell-app/spell-app/issues/new?title=ui-meta%3A%20%20"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Meta
            <ui-header>A meta holds metadata about the content, such as a date or a category.</ui-header>
          </ui-header>
          <ui-docs-themes for="ui-meta" show="theme" class="site-themes"></ui-docs-themes>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history basic appearance="segmented" alignment="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  `<ui-meta>` in each owner that gives it a look (from the owners' own pages and
              `src/components/ui-parts/examples/elements/`), then its attributes.  The Content parts page
              (`ui-header.html`) shows every part together.
            -->
            <ui-section id="examples-owners" header="Owners" sticky collapsible dividing>
              <ui-section id="examples-owners-card" header="Card" sticky collapsible dividing>
                <ui-docs-example description="A card's meta:  small and muted, under its header.">
                  <ui-card>
                    <ui-content>
                      <ui-header>Kristy</ui-header>
                      <ui-meta><span>Joined in 2013</span></ui-meta>
                      <ui-description>Kristy is an art director living in New York.</ui-description>
                    </ui-content>
                  </ui-card>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-owners-item" header="Item" sticky collapsible dividing>
                <ui-docs-example description="An item's meta:  each piece spaced apart.">
                  <ui-items>
                    <ui-item image="../images/wireframe/image.png">
                      <ui-content>
                        <ui-header>Cute Dog</ui-header>
                        <ui-meta><span>Description</span><span>Stevie</span></ui-meta>
                      </ui-content>
                    </ui-item>
                  </ui-items>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-owners-feed" header="Feed" sticky collapsible dividing>
                <ui-docs-example description="A feed event's meta:  a small line under its summary.">
                  <ui-feed>
                    <ui-event>
                      <ui-content>
                        <ui-summary><ui-author href="#elliot">Elliot Fu</ui-author> added you as a friend</ui-summary>
                        <ui-meta><a href="#like"><ui-icon name="heart"></ui-icon> 4 Likes</a></ui-meta>
                      </ui-content>
                    </ui-event>
                  </ui-feed>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-owners-comment" header="Comment" sticky collapsible dividing>
                <ui-docs-example description="A comment's metadata:  inline after the author.">
                  <ui-comments>
                    <ui-comment>
                      <ui-avatar src="../images/avatar/small/matt.jpg"></ui-avatar>
                      <ui-content>
                        <ui-author href="#matt">Matt</ui-author>
                        <ui-meta><span>Today at 5:42PM</span></ui-meta>
                        <ui-description>How artistic!</ui-description>
                      </ui-content>
                    </ui-comment>
                  </ui-comments>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <ui-section id="usage-using-it" header="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-meta>` holds metadata about its owner's content, such as a date or a category: a card's or an item's meta line,
                  a feed event's likes, a comment's `metadata`.

                  - No attributes: the owner decides the look (small and muted almost everywhere).
                  - Put each piece in its own `<span>` or `<a>`: an item spaces them apart, a comment separates them.
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-owners" header="Owners" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-meta>` finds its nearest owner and sets `:state(in-<owner>)` on itself; `ui-parts.css` styles it by that
                  state. Its owners, and what each makes of it:

                  - [Card](ui-card.html) (`:state(in-card)`): small, muted, under the header
                  - [Item](ui-items.html) (`:state(in-item)`): small, muted, each piece spaced apart
                  - [Feed](ui-feed.html) (`:state(in-feed)`): a small line under the summary (likes, replies)
                  - [Comment](ui-comment.html) (`:state(in-comment)`): inline after the author, small and muted

                  Anywhere else it is an unstyled block. More on how parts find their owners: [Content parts](ui-header.html#usage-owners).
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-accessibility" header="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - A neutral block with no role. Its muted colour is a look only: dates belong in `<time>` (or a `<ui-date
                    datetime>` in a feed) for machines.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json`);  nothing to write. -->
            <ui-docs-api tag="ui-meta"></ui-docs-api>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
