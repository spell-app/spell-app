<!--
  `<ui-extra>` standalone and in each owner.
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <div class="extra">Extra content with no owner is an unstyled block.</div>
  </section>

  <section>
    <h4>In owners</h4>
    <div class="ui card" style="display: flex; flex-direction: column; width: 290px">
      <div class="content in-card"><div class="header in-card">Elliot</div></div>
      <div class="extra in-card"><a href="#friends">22 Friends</a></div>
    </div>
    <div class="ui items">
      <div class="item">
        <div class="content in-item">
          <div class="extra in-item"><span>Additional details</span></div>
        </div>
      </div>
    </div>
    <div class="ui feed">
      <div class="event">
        <div class="content in-feed"><div class="extra text in-feed">Ours is a life of constant reruns.</div></div>
      </div>
    </div>
  </section>
</div>
