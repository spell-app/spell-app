<!-- `src/components/ui-select/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Disabled</h4>
    <ui-select disabled placeholder="Gender">
      <ui-item value="male">Male</ui-item>
    </ui-select>
  </section>

  <section>
    <h4>Error</h4>
    <ui-select state="error" placeholder="Gender">
      <ui-item value="male">Male</ui-item>
    </ui-select>
  </section>

  <section>
    <h4>Info, success, warning</h4>
    <div class="ui-cluster">
      <ui-select state="info" aria-label="Info" value="a"><ui-item value="a">Info</ui-item></ui-select>
      <ui-select state="success" aria-label="Success" value="a"><ui-item value="a">Success</ui-item></ui-select>
      <ui-select state="warning" aria-label="Warning" value="a"><ui-item value="a">Warning</ui-item></ui-select>
    </div>
  </section>

  <section>
    <h4>Required, with a disabled option</h4>
    <ui-select required placeholder="Size" name="size">
      <ui-item value="s">Small</ui-item>
      <ui-item value="m" disabled>Medium (sold out)</ui-item>
      <ui-item value="l">Large</ui-item>
    </ui-select>
  </section>
</div>
