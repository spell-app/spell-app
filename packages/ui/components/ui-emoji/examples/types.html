<!--
  Emoji types, after Fomantic's docs (elements/emoji.html, "Types").
  Light-DOM markup in the class grammar `UIEmoji.css` styles inside `<ui-emoji>`'s shadow root:  the glyph is the
  native Unicode emoji the element resolves from `name` (Fomantic drew Twemoji SVGs from a CDN instead).
-->
<div class="ui-stack">
  <section>
    <h4>Emoji</h4>
    <p>
      <span class="ui emoji">😄</span> <span class="ui emoji">😂</span> <span class="ui emoji">👍</span>
      <span class="ui emoji">❤️</span> <span class="ui emoji">☀️</span> <span class="ui emoji">🇺🇸</span>
      <span class="ui emoji">1️⃣</span> <span class="ui emoji">👩‍💻</span>
    </p>
  </section>

  <section>
    <h4>In text</h4>
    <p>
      That was <span class="ui emoji">😂</span> hilarious, thanks
      <span class="ui emoji" role="img" aria-label="Approved">👍</span>
    </p>
  </section>

  <section>
    <h4>Decorative</h4>
    <p><span class="ui emoji" aria-hidden="true">✨️</span> New features</p>
  </section>
</div>
