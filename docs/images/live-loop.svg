<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc">
  <title id="title">The live loop</title>
  <desc id="desc">What happens between your typing and the app changing, in eight steps.  1, open a project.  2, type.  3, compile, in the browser.  4, load the runtime.  5, run.  6, keep the game going.  7, draw.  8, inspect.  The next edit goes back to step 2, type.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6550CA"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1A1C27; }
    .title { font-size: 21px; font-weight: 700; }
    .sub { font-size: 13px; fill: #5B5E6E; }
    .name { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .lbl { font-size: 13px; font-style: italic; fill: #6550CA; }
    .box { fill: #EFECFB; stroke: #6550CA; stroke-width: 2; }
    .start { fill: #F1E7D4; stroke: #C9B48A; stroke-width: 2; }
    .badge { fill: #6550CA; stroke: #FAF9FE; stroke-width: 2; }
    .sbadge { fill: #A88A4E; stroke: #FAF9FE; stroke-width: 2; }
    .edge { fill: none; stroke: #6550CA; stroke-width: 1.8; }
    .again { fill: none; stroke: #6550CA; stroke-width: 2; stroke-dasharray: 7 5; }
    .ring { fill: #F3F0FC; stroke: none; }
  </style>

  <rect x="1" y="1" width="798" height="358" rx="16" fill="#FAF9FE" stroke="#E4E0F5" stroke-width="2"/>
  <text class="title" x="40" y="44">The live loop</text>
  <text class="sub" x="40" y="66">From your typing to the app changing, in eight steps;  every edit goes round again.</text>

  <!-- the loop's ground:  steps 2 to 8 -->
  <rect class="ring" x="170" y="94" width="612" height="226" rx="28"/>

  <!-- edges -->
  <path class="edge" d="M162,140 L178,140" marker-end="url(#arrow)"/>
  <path class="edge" d="M314,140 L330,140" marker-end="url(#arrow)"/>
  <path class="edge" d="M466,140 L482,140" marker-end="url(#arrow)"/>
  <path class="edge" d="M618,140 L634,140" marker-end="url(#arrow)"/>
  <path class="edge" d="M704,170 L704,236" marker-end="url(#arrow)"/>
  <path class="edge" d="M638,270 L622,270" marker-end="url(#arrow)"/>
  <path class="edge" d="M486,270 L470,270" marker-end="url(#arrow)"/>
  <path class="again" d="M334,270 C262,270 248,250 248,174" marker-end="url(#arrow)"/>
  <text class="lbl" x="196" y="300">the next edit</text>

  <!-- top row:  1 to 5 -->
  <rect class="start" x="30" y="110" width="132" height="60" rx="12"/>
  <circle class="sbadge" cx="48" cy="110" r="11"/><text class="num" x="48" y="114">1</text>
  <text class="name" x="96" y="145">Open a project</text>

  <rect class="box" x="182" y="110" width="132" height="60" rx="12"/>
  <circle class="badge" cx="200" cy="110" r="11"/><text class="num" x="200" y="114">2</text>
  <text class="name" x="248" y="145">Type</text>

  <rect class="box" x="334" y="110" width="132" height="60" rx="12"/>
  <circle class="badge" cx="352" cy="110" r="11"/><text class="num" x="352" y="114">3</text>
  <text class="name" x="400" y="136">Compile,</text>
  <text class="name" x="400" y="154">in the browser</text>

  <rect class="box" x="486" y="110" width="132" height="60" rx="12"/>
  <circle class="badge" cx="504" cy="110" r="11"/><text class="num" x="504" y="114">4</text>
  <text class="name" x="552" y="136">Load</text>
  <text class="name" x="552" y="154">the runtime</text>

  <rect class="box" x="638" y="110" width="132" height="60" rx="12"/>
  <circle class="badge" cx="656" cy="110" r="11"/><text class="num" x="656" y="114">5</text>
  <text class="name" x="704" y="145">Run</text>

  <!-- bottom row:  6 to 8, right to left -->
  <rect class="box" x="638" y="240" width="132" height="60" rx="12"/>
  <circle class="badge" cx="656" cy="240" r="11"/><text class="num" x="656" y="244">6</text>
  <text class="name" x="704" y="266">Keep the</text>
  <text class="name" x="704" y="284">game going</text>

  <rect class="box" x="486" y="240" width="132" height="60" rx="12"/>
  <circle class="badge" cx="504" cy="240" r="11"/><text class="num" x="504" y="244">7</text>
  <text class="name" x="552" y="275">Draw</text>

  <rect class="box" x="334" y="240" width="132" height="60" rx="12"/>
  <circle class="badge" cx="352" cy="240" r="11"/><text class="num" x="352" y="244">8</text>
  <text class="name" x="400" y="275">Inspect</text>
</svg>
