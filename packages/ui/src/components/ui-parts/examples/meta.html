<!--
  `<ui-meta>` standalone and in each owner (a comment's `metadata`).
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <div class="meta"><span>2 days ago</span></div>
  </section>

  <section>
    <h4>In owners</h4>
    <div class="ui card">
      <div class="content in-card">
        <div class="meta in-card"><span>Joined in 2013</span><a href="#friends">Friends</a></div>
      </div>
    </div>
    <div class="ui items">
      <div class="item">
        <div class="content in-item">
          <div class="meta in-item"><span>Description</span><span>Stevie</span></div>
        </div>
      </div>
    </div>
    <div class="ui feed">
      <div class="event">
        <div class="content in-feed">
          <div class="meta in-feed"><a href="#like">4 Likes</a><a href="#reply">Reply</a></div>
        </div>
      </div>
    </div>
    <div class="ui comments">
      <div class="comment">
        <div class="content in-comment">
          <a class="author in-comment" href="#matt">Matt</a>
          <div class="meta in-comment"><span>Today at 5:42PM</span></div>
        </div>
      </div>
    </div>
  </section>
</div>
