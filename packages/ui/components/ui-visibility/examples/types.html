<!--
  Visibility, after Fomantic's docs (behaviors/visibility.html).  Visibility is a behaviour with no look of its own,
  so its static markup is just the content:  here the lazy images of Fomantic's "Lazy Loading Images" example,
  already loaded (`src`, as `<ui-visibility type="image">` leaves them).
-->
<div class="ui-stack">
  <section>
    <h4>Lazy loading images</h4>
    <div style="display: flex; gap: 1em; flex-wrap: wrap">
      <img
        alt="First"
        width="96"
        height="96"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
        style="background: var(--ui-surface-strong)"
      />
      <img
        alt="Second"
        width="96"
        height="96"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
        style="background: var(--ui-surface-strong)"
      />
      <img
        alt="Third"
        width="96"
        height="96"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
        style="background: var(--ui-surface-strong)"
      />
    </div>
  </section>
</div>
