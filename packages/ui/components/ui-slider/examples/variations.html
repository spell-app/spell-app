<!--
  Slider variations, after Fomantic's docs (modules/slider.html, "Variations").
-->
<div class="ui-stack">
  <section>
    <h4>Reversed</h4>
    <div class="ui reversed slider">
      <div class="inner" style="--_slider-to: 0.3">
        <div class="track"></div>
        <div class="track-fill"></div>
        <div class="thumb" style="--_slider-at: 0.3"></div>
      </div>
    </div>
  </section>

  <section>
    <h4>Vertical</h4>
    <div class="ui-cluster">
      <div class="ui vertical slider" style="height: 180px">
        <div class="inner" style="--_slider-to: 0.3">
          <div class="track"></div>
          <div class="track-fill"></div>
          <div class="thumb" style="--_slider-at: 0.3"></div>
        </div>
      </div>
      <div class="ui vertical reversed slider" style="height: 180px">
        <div class="inner" style="--_slider-to: 0.3">
          <div class="track"></div>
          <div class="track-fill"></div>
          <div class="thumb" style="--_slider-at: 0.3"></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h4>Bottom aligned labels</h4>
    <div class="ui bottom aligned labeled ticked slider">
      <div class="inner" style="--_slider-to: 0.4">
        <div class="track"></div>
        <div class="track-fill"></div>
        <div class="thumb" style="--_slider-at: 0.4"></div>
      </div>

        <li class="label" style="--_slider-at: 0">0</li>
        <li class="label" style="--_slider-at: 0.1">1</li>
        <li class="label" style="--_slider-at: 0.2">2</li>

        <li class="label" style="--_slider-at: 0.9">9</li>
        <li class="label" style="--_slider-at: 1">10</li>
      </ul>
    </div>
  </section>

  <section>
