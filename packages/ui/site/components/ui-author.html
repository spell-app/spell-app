<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Author | Spell UI</title>
    <meta
      name="description"
      content="An author names who wrote a comment or did a feed event."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../_assets/site.css" />
    <script type="module" src="../_assets/site.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Author">
      <ui-segment vertical class="site-masthead">
        <ui-container>
          <ui-menu icon floated="right" class="site-page-links" aria-label="About this page">
            <ui-item
              href="https://github.com/spell-app/spell-app/blob/main/packages/ui/site/components/ui-author.html"
              icon="pen to square"
              aria-label="This page's source on GitHub"
              title="This page's source on GitHub"
            ></ui-item>
            <ui-item
              href="https://github.com/spell-app/spell-app/issues/new?title=ui-author%3A%20%20"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Author
            <ui-header>An author names who wrote a comment or did a feed event.</ui-header>
          </ui-header>
          <ui-docs-themes for="ui-author" show="theme" class="site-themes"></ui-docs-themes>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history basic appearance="segmented" alignment="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  `<ui-author>` in each owner that gives it a look (from the owners' own pages and
              `src/components/ui-parts/examples/elements/`), then its attributes.  The Content parts page
              (`ui-header.html`) shows every part together.
            -->
            <ui-section id="examples-owners" header="Owners" sticky collapsible dividing>
              <ui-section id="examples-owners-comment" header="Comment" sticky collapsible dividing>
                <ui-docs-example description="A comment's author, before its metadata.">
                  <ui-comments>
                    <ui-comment>
                      <ui-avatar src="../images/avatar/small/matt.jpg"></ui-avatar>
                      <ui-content>
                        <ui-author href="#matt">Matt</ui-author>
                        <ui-meta><span>Today at 5:42PM</span></ui-meta>
                        <ui-description>How artistic!</ui-description>
                      </ui-content>
                    </ui-comment>
                  </ui-comments>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-owners-feed" header="Feed" sticky collapsible dividing>
                <ui-docs-example description="A feed event's user, inline in its summary.">
                  <ui-feed>
                    <ui-event>
                      <ui-content>
                        <ui-summary><ui-author href="#elliot">Elliot Fu</ui-author> added you as a friend</ui-summary>
                      </ui-content>
                    </ui-event>
                  </ui-feed>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-variations" header="Variations" sticky collapsible dividing>
              <ui-section id="examples-variations-link" header="Link" sticky collapsible dividing>
                <ui-docs-example description="With `href`, an author is a real link;  without, plain text.">
                  <ui-comments>
                    <ui-comment>
                      <ui-content>
                        <ui-author href="#stevie">Stevie Feliciano</ui-author>
                        <ui-description>A linked author.</ui-description>
                      </ui-content>
                    </ui-comment>
                    <ui-comment>
                      <ui-content>
                        <ui-author>Anonymous</ui-author>
                        <ui-description>A plain author.</ui-description>
                      </ui-content>
                    </ui-comment>
                  </ui-comments>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <ui-section id="usage-using-it" header="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-author>` names who wrote a comment or did a feed event (Fomantic's comment `author` and feed `user`).

                  - `href` renders a real link (`<a>`), e.g. to a profile; `target` goes with it.
                  - In a feed it sits inline in the `<ui-summary>`; in a comment it opens the content, before the `<ui-meta>`.
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-owners" header="Owners" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-author>` finds its nearest owner and sets `:state(in-<owner>)` on itself; `ui-parts.css` styles it by that
                  state. Its owners, and what each makes of it:

                  - [Comment](ui-comment.html) (`:state(in-comment)`): bold, at the start of the comment's content
                  - [Feed](ui-feed.html) (`:state(in-feed)`): bold, inline in the event's summary

                  Anywhere else it is an unstyled block. More on how parts find their owners: [Content parts](ui-header.html#usage-owners).
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-accessibility" header="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - With `href` it renders a real `<a>`: **Tab** reaches it, **Enter** follows it.
                  - Without `href` it is plain inline text with no role.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json`);  nothing to write. -->
            <ui-docs-api tag="ui-author"></ui-docs-api>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
