<!--
  `<ui-value>` standalone and in each owner (a search result's `price`).  A statistic's label is a
  `<ui-label>` owned by the statistic:  it renders `<div class="label">` and adopts `UIParts.css`.
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <div class="value">5,550</div>
  </section>

  <section>
    <h4>In a statistic</h4>
    <div class="ui statistic">
      <div class="value in-statistic">5,550</div>
      <div class="label in-statistic">Downloads</div>
    </div>
    <div class="ui statistic">
      <div class="text value in-statistic">Three<br />Thousand</div>
      <div class="label in-statistic">Signups</div>
    </div>
    <div class="ui horizontal statistic" style="--_ui-statistic-layout: horizontal">
      <div class="value in-statistic">2,204</div>
      <div class="label in-statistic">Views</div>
    </div>
    <div class="ui red statistic">
      <div class="value in-statistic">27</div>
      <div class="label in-statistic">Red</div>
    </div>
  </section>

  <section>
    <h4>In a search result</h4>
    <div class="ui search">
      <div class="results">
        <div class="result">
          <div class="content in-search">
            <div class="value in-search">$10.99</div>
            <div class="title in-search">Result</div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
