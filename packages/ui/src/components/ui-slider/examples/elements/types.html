<!-- `src/components/ui-slider/examples/types.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Slider</h4>
    <ui-slider value="5" aria-label="Volume"></ui-slider>
  </section>

  <section>
    <h4>Range</h4>
    <ui-slider range value="5" end="15" aria-label="Price"></ui-slider>
  </section>

  <section>
    <h4>Labeled</h4>
    <ui-slider labeled max="10" value="3" aria-label="Rating"></ui-slider>
  </section>

  <section>
    <h4>Labeled ticked</h4>
    <label for="sl-ticked">Guests</label>
    <ui-slider id="sl-ticked" labeled ticked max="10" value="6"></ui-slider>
  </section>
</div>
