<!--
  `<ui-date>` standalone and in its owner, the feed:  on its own line, or inline in a summary.
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <time class="date" datetime="2026-09-29">Today</time>
  </section>

  <section>
    <h4>In a feed</h4>
    <div class="ui feed">
      <div class="event">
        <div class="content in-feed">
          <time class="date in-feed" datetime="P3D">3 days ago</time>
          <div class="summary in-feed">
            You added Jenny Hess to your coworker group. <time class="date in-feed" datetime="PT4H">4 hours ago</time>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
