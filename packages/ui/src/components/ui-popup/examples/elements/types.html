<!-- `src/components/ui-popup/examples/types.html` as element markup:  each popup on its target. -->
<div class="ui-stack">
  <section>
    <h4>Popup</h4>
    <ui-button icon="plus" aria-label="Add users"></ui-button>
    <ui-popup content="Add users to your feed"></ui-popup>
  </section>

  <section>
    <h4>Titled</h4>
    <ui-button id="popup-types-rating">Rating</ui-button>
    <ui-popup for="popup-types-rating" header="User Rating" content="A popup can have a header and content."></ui-popup>
  </section>

  <section>
    <h4>HTML content, on click</h4>
    <ui-button id="popup-types-plan">Choose a plan</ui-button>
    <ui-popup for="popup-types-plan" open-on="click" position="bottom left" flowing header="Basic plan">
      <p>Does not include upload or chat.</p>
      <ui-button size="small" primary>Choose</ui-button>
    </ui-popup>
  </section>

  <section>
    <h4>Content parts</h4>
    <ui-button id="popup-types-parts">Parts</ui-button>
    <ui-popup for="popup-types-parts" open-on="focus">
      <ui-header>Slotted header</ui-header>
      <ui-content>Slotted content, styled by the popup.</ui-content>
    </ui-popup>
  </section>

  <section>
    <h4>Tooltip</h4>
    <p class="ui-cluster">
      <ui-button data-tooltip="Add users to your feed">Top center</ui-button>
      <ui-button data-tooltip="Add users to your feed" data-position="bottom left">Bottom left</ui-button>
      <ui-button data-tooltip="Add users to your feed" data-position="right top">Right top</ui-button>
      <ui-button data-tooltip="An inverted tooltip" data-inverted>Inverted</ui-button>
    </p>
  </section>
</div>
