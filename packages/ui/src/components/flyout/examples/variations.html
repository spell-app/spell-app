<!--
  Flyout variations, after Fomantic's docs (modules/flyout.html, "Variations").  Static class grammar, in flow.
-->
<div class="ui-stack">
  <section>
    <h4>Top</h4>
    <div class="ui top visible flyout" style="position: relative">
      <div class="header">Top flyout</div>
      <div class="content"><p>Full width, as tall as its content.</p></div>
    </div>
  </section>

  <section>
    <h4>Widths</h4>
    <div class="ui left visible thin flyout" style="position: relative; height: 8em">
      <div class="content"><p>Thin</p></div>
    </div>
    <div class="ui left visible four wide flyout" style="position: relative; height: 8em">
      <div class="content"><p>Four wide</p></div>
    </div>
  </section>

  <section>
    <h4>Inverted</h4>
    <div class="ui left visible inverted flyout" style="position: relative; height: 12em">
      <div class="header">Inverted</div>
      <div class="content"><p>The dark scheme.</p></div>
      <div class="actions"><button type="button" class="ui inverted button">Done</button></div>
    </div>
  </section>
</div>
