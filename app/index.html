<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spell.app</title>
    <link rel="stylesheet" type="text/css" href="../static/semantic-ui-css/semantic.min.css" />
    <link rel="stylesheet" type="text/css" href="../static/lato/index.css" />
    <!-- Spell's favicon:  copies the kit's `yarn favicon` writes;  vite bundles them into `dist/` -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/favicon/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: Lato, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- `icons`:  the app's icon names are Fomantic's, for every `<ui-*>` in the page (see `src/app/solid/loadUI.ts`).
         `semantic.min.css` above is for running PROGRAMS, which draw with Semantic UI's React kit. -->
    <ui-root icons="fomantic"><div id="app-root"></div></ui-root>
    <script type="module" src="../src/app/index.tsx"></script>
  </body>
</html>
