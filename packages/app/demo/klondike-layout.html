<!doctype html>
<!--
  Owen's Klondike sketch:  a spell app laid out in plain HTML, around its program.
  - Served by the dev server at `/demo/klondike-layout.html`, after `yarn build:element` (epic `drawable-thing`, P9).
  - The `<spell-app>`'s markup IS the app's drawing:  the game's own `to draw` isn't drawn.
  - Each drawable tag is the program's thing its `id` names, as the part of a reference after its `#` (P18, J43):
    `T1` ... the tableaus;  `clubs` ... the foundations;  `<solitaire-pile id="discards">` is the discards,
    a discard-pile, which is a pile -- `Pile#discards`.
    - With no `id`:  its one thing of that type (the stock).
  - Each card the program draws is named after its card, by its id, e.g. `id="queen-of-hearts"`.
  - A tag's name leaves out the project's word "drawable":  `<solitaire-tableau>`, not `<drawable-solitaire-tableau>`.
  - Each card shows the pile holding it as that pile's reference, e.g. `pile="Tableau#T1"`:  see the inspector.
  - The curly-bracket holes and the handlers are spell, compiled in the page against the program:
    the page loads spell's parser for them, and only for them.
  - A handler goes on any element (P12):  an attribute, `on-click="{auto-play}"` or `when-clicked="{...}"`,
    or a `<spell>` block inside it, `when double clicked` with its statements under it.
  - Quote an attribute's spell:  unquoted, it's put back together from the words the browser splits it into,
    but a word used twice is lost (`{the score of the game}` loses its second `the`).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klondike layout demo</title>
    <script type="module" src="/element/spell-app.js"></script>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: Georgia, serif;
        background: #f4f1ea;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 12px;
        margin-bottom: 16px;
        align-items: start;
      }
      .title {
        grid-column: span 2;
        font-size: 1.4em;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <spell-app project="@examples/Drawable Solitaire" name="Solitaire">
      <div class="row">
        <div class="title">Klondike Solitaire</div>
        <div class="score">Score {the score of the game}</div>
        <button on-click="{auto-play}">AutoPlay</button>
      </div>
      <div class="row">
        <solitaire-pile id="discards"></solitaire-pile>
        <!-- a <spell> block's lines and indents are spell's:  the formatter leaves them alone -->
        <!-- prettier-ignore -->
        <solitaire-stock-pile>
          <spell>
            when double clicked
              play from the stock pile
          </spell>
        </solitaire-stock-pile>
        <div></div>
        <solitaire-foundation id="clubs"></solitaire-foundation>
        <solitaire-foundation id="diamonds"></solitaire-foundation>
        <solitaire-foundation id="hearts"></solitaire-foundation>
        <solitaire-foundation id="spades"></solitaire-foundation>
      </div>
      <div class="row">
        <solitaire-tableau id="T1"></solitaire-tableau>
        <solitaire-tableau id="T2"></solitaire-tableau>
        <solitaire-tableau id="T3"></solitaire-tableau>
        <solitaire-tableau id="T4"></solitaire-tableau>
        <solitaire-tableau id="T5"></solitaire-tableau>
        <solitaire-tableau id="T6"></solitaire-tableau>
        <solitaire-tableau id="T7"></solitaire-tableau>
      </div>
      <div>{the number of cards in the stock} cards left in the stock</div>
    </spell-app>
  </body>
</html>
