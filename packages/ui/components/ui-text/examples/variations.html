<!--
  Text variations, after Fomantic's docs (elements/text.html, "Variations").
  Light-DOM markup in the class grammar `UIText.css` styles inside `<ui-text>`'s shadow root.  The dark box stands
  in for an inverted owner (a segment):  the dark scheme and its surface.
-->
<div class="ui-stack">
  <section>
    <h4>Inverted</h4>
    <p class="ui-dark" style="padding: 1em; background: var(--ui-surface); color: var(--ui-text-color)">
      <span class="ui inverted red text">Red</span> <span class="ui inverted orange text">Orange</span>
      <span class="ui inverted yellow text">Yellow</span> <span class="ui inverted green text">Green</span>
      <span class="ui inverted blue text">Blue</span> <span class="ui inverted purple text">Purple</span>
      <span class="ui inverted text">Uncoloured</span>
    </p>
  </section>

  <section>
    <h4>Size</h4>
    <p>
      <span class="ui mini text">mini text</span>
      <span class="ui tiny text">tiny text</span>
      <span class="ui small text">small text</span>
      <span class="ui medium text">medium text</span>
      <span class="ui large text">large text</span>
      <span class="ui big text">big text</span>
      <span class="ui huge text">huge text</span>
      <span class="ui massive text">massive text</span>
    </p>
  </section>
</div>
