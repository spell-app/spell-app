<!--
  Flag types, after Fomantic's docs (elements/flag.html, "Flag").
  Light-DOM markup in the class grammar `UIFlag.css` styles inside `<ui-flag>`'s shadow root:  the Unicode flag
  emoji the element computes from `country`, labelled for assistive tech.  Without a colour emoji font with
  flags (Windows), the pairs show as letters.
-->
<div class="ui-stack">
  <section>
    <h4>Flag</h4>
    <p>
      <span class="ui flag" role="img" aria-label="France">🇫🇷</span>
      <span class="ui flag" role="img" aria-label="United States">🇺🇸</span>
      <span class="ui flag" role="img" aria-label="United Kingdom">🇬🇧</span>
      <span class="ui flag" role="img" aria-label="Germany">🇩🇪</span>
      <span class="ui flag" role="img" aria-label="Japan">🇯🇵</span>
      <span class="ui flag" role="img" aria-label="Brazil">🇧🇷</span>
      <span class="ui flag" role="img" aria-label="India">🇮🇳</span>
      <span class="ui flag" role="img" aria-label="South Africa">🇿🇦</span>
      <span class="ui flag" role="img" aria-label="European Union">🇪🇺</span>
      <span class="ui flag" role="img" aria-label="United Nations">🇺🇳</span>
    </p>
  </section>

  <section>
    <h4>Other flags</h4>
    <p>
      <span class="ui flag" role="img" aria-label="Rainbow flag">🏳️‍🌈</span>
      <span class="ui flag" role="img" aria-label="Transgender flag">🏳️‍⚧️</span>
      <span class="ui flag" role="img" aria-label="Pirate flag">🏴‍☠️</span>
      <span class="ui flag" role="img" aria-label="England">🏴󠁧󠁢󠁥󠁮󠁧󠁿</span>
      <span class="ui flag" role="img" aria-label="Scotland">🏴󠁧󠁢󠁳󠁣󠁴󠁿</span>
      <span class="ui flag" role="img" aria-label="Wales">🏴󠁧󠁢󠁷󠁬󠁳󠁿</span>
    </p>
  </section>
</div>
