<!--
  `<ui-summary>` standalone and in its owner, the feed.
  Owners are written in plain class grammar (`ui card`, `ui feed` ...);  their own sheets land later, so only the
  parts are styled here.  Each part carries the static `in-<owner>` class that stands in for the
  `:state(in-<owner>)` its element would get from `OwnerContext` (see `UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <div class="summary">A summary with no owner is an unstyled block.</div>
  </section>

  <section>
    <h4>In a feed</h4>
    <div class="ui feed">
      <div class="event">
        <div class="content in-feed">
          <div class="summary in-feed">
            <a class="author in-feed" href="#elliot">Elliot Fu</a> added you as a friend
            <time class="date in-feed" datetime="PT1H">1 hour ago</time>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
