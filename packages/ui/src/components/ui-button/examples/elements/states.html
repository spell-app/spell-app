<!-- `src/components/ui-button/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Active</h4>
    <ui-button active icon="user">Follow</ui-button>
    <ui-button primary active>Primary</ui-button>
    <ui-button basic active>Basic</ui-button>
  </section>

  <section>
    <h4>Disabled</h4>
    <ui-button disabled icon="user">Followed</ui-button>
    <ui-button primary disabled="yes">Disabled attribute</ui-button>
  </section>

  <section>
    <h4>Loading</h4>
    <ui-button loading>Loading</ui-button>
    <ui-button basic loading>Loading</ui-button>
    <ui-button primary loading>Loading</ui-button>
    <ui-button secondary loading>Loading</ui-button>
  </section>

  <section>
    <h4>Toggle</h4>
    <ui-button toggle>Vote</ui-button>
    <ui-button toggle active>Voted</ui-button>
  </section>
</div>
