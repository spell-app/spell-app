<!-- `<ui-docs-toc>`:  the "On this page" menu of a docs page, following the content it names with `for`. -->
<div class="ui-cluster ui-gap-l" style="align-items: flex-start">
  <ui-docs-toc for="toc-example-content" header="Button" style="width: 12em"></ui-docs-toc>

  <section id="toc-example-content" style="flex: 1">
    <ui-header level="2" dividing>Types</ui-header>
    <ui-docs-example header="Button" description="A standard button.">
      <ui-button>Follow</ui-button>
    </ui-docs-example>
    <ui-docs-example header="Emphasis" description="A button can show different levels of emphasis.">
      <ui-button primary>Save</ui-button>
    </ui-docs-example>
    <ui-header level="2" dividing>States</ui-header>
    <ui-docs-example header="Disabled" description="A button can't be used.">
      <ui-button disabled>Followed</ui-button>
    </ui-docs-example>
  </section>
</div>
