<!--
  Slider types, after Fomantic's docs (modules/slider.html, "Types"):  standard, range, labeled, labeled ticked.
  Fomantic's JS writes pixel offsets;  this markup writes the ratios `UISlider.css` positions by.
-->
<div class="ui-stack">
  <section>
    <h4>Slider</h4>
    <div class="ui slider">
      <div class="inner" style="--_slider-to: 0.25">
        <div class="track"></div>
        <div class="track-fill"></div>
        <div class="thumb" style="--_slider-at: 0.25"></div>
      </div>
    </div>
  </section>

  <section>
    <h4>Range</h4>
    <div class="ui range slider">
      <div class="inner" style="--_slider-from: 0.25; --_slider-to: 0.75">
        <div class="track"></div>
        <div class="track-fill"></div>
        <div class="thumb" style="--_slider-at: 0.25"></div>
        <div class="second thumb" style="--_slider-at: 0.75"></div>
      </div>
    </div>
  </section>

  <section>
    <h4>Labeled</h4>
    <div class="ui labeled slider">
      <div class="inner" style="--_slider-to: 0.3">
        <div class="track"></div>
        <div class="track-fill"></div>
        <div class="thumb" style="--_slider-at: 0.3"></div>
      </div>
      <ul class="auto labels">
        <li class="label" style="--_slider-at: 0">0</li>
        <li class="label" style="--_slider-at: 0.1">1</li>
        <li class="label" style="--_slider-at: 0.2">2</li>
        <li class="label" style="--_slider-at: 0.3">3</li>
        <li class="label" style="--_slider-at: 0.4">4</li>
        <li class="label" style="--_slider-at: 0.5">5</li>
        <li class="label" style="--_slider-at: 0.6">6</li>
        <li class="label" style="--_slider-at: 0.7">7</li>
        <li class="label" style="--_slider-at: 0.8">8</li>
        <li class="label" style="--_slider-at: 0.9">9</li>
        <li class="label" style="--_slider-at: 1">10</li>
      </ul>
    </div>
  </section>

  <section>
    <h4>Labeled ticked</h4>
    <div class="ui labeled ticked slider">
      <div class="inner" style="--_slider-to: 0.6">
        <div class="track"></div>
        <div class="track-fill"></div>
        <div class="thumb" style="--_slider-at: 0.6"></div>
      </div>
      <ul class="auto labels">
        <li class="label" style="--_slider-at: 0">0</li>
        <li class="label" style="--_slider-at: 0.1">1</li>
        <li class="label" style="--_slider-at: 0.2">2</li>
        <li class="label" style="--_slider-at: 0.3">3</li>
        <li class="label" style="--_slider-at: 0.4">4</li>
        <li class="label" style="--_slider-at: 0.5">5</li>
        <li class="label" style="--_slider-at: 0.6">6</li>
        <li class="label" style="--_slider-at: 0.7">7</li>
        <li class="label" style="--_slider-at: 0.8">8</li>
        <li class="label" style="--_slider-at: 0.9">9</li>
        <li class="label" style="--_slider-at: 1">10</li>
      </ul>
    </div>
  </section>
</div>
