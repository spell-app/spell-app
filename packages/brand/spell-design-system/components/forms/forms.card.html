<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;box-sizing:border-box}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px 24px"><label class="sp-field"><span class="sp-label">App name</span><input class="sp-input" value="Habit Tracker"><span class="sp-hint">Shown on your home screen.</span></label><label class="sp-field"><span class="sp-label">Spell language</span><select class="sp-select"><option>English</option><option>Español</option></select></label><label class="sp-field"><span class="sp-label">Email</span><input class="sp-input" aria-invalid="true" value="owen@"><span class="sp-hint sp-hint--error">That doesn’t look like an email.</span></label><label class="sp-field"><span class="sp-label">Describe it</span><textarea class="sp-textarea sp-textarea--spell" style="min-height:62px">Add a weekly summary.</textarea></label><div style="display:flex;flex-direction:column;gap:10px"><label class="sp-check"><input type="checkbox" checked><span>Drink water</span></label><label class="sp-check sp-check--done"><input type="checkbox" checked><span>Read</span></label><label class="sp-check sp-check--square"><input type="checkbox"><span>Email me updates</span></label></div><div style="display:flex;flex-direction:column;gap:10px"><label class="sp-check"><input type="radio" name="d" checked><span>Compact</span></label><label class="sp-check"><input type="radio" name="d"><span>Classic</span></label><label class="sp-check" style="justify-content:space-between"><span>Dark mode</span><button class="sp-switch" aria-checked="true"></button></label></div></div></body></html>
