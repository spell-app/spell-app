<!--
  Label variations, after Fomantic's docs (elements/label.html, "Variations").
-->
<div class="ui-stack">
  <section>
    <h4>Fluid</h4>
    <span class="ui fluid label">Fluid label</span>
  </section>

  <section>
    <h4>Centered</h4>
    <span class="ui fluid centered label">Centered label</span>
  </section>

  <section>
    <h4>Circular</h4>
    <span class="ui red circular label">2</span>
    <span class="ui orange circular label">2</span>
    <span class="ui green circular label">22</span>
    <span class="ui blue circular label">222</span>
    <span class="ui red empty circular label"></span>
    <span class="ui green empty circular label"></span>
  </section>

  <section>
    <h4>Basic</h4>
    <span class="ui basic label">Basic</span>
    <span class="ui basic pointing label">Pointing</span>
    <span class="ui basic image label"
      ><img
        class="image"
        src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22%3E%3Crect width=%221%22 height=%221%22 fill=%22%2394a3b8%22/%3E%3C/svg%3E"
        alt=""
      />Elliot</span
    >
    <span class="ui red basic label">Red</span>
    <span class="ui blue basic below pointing label">Blue</span>
  </section>

  <section>
    <h4>Colored</h4>
    <span class="ui primary label">Primary</span>
    <span class="ui secondary label">Secondary</span>
    <span class="ui red label">Red</span>
    <span class="ui orange label">Orange</span>
    <span class="ui yellow label">Yellow</span>
    <span class="ui olive label">Olive</span>
    <span class="ui green label">Green</span>
    <span class="ui teal label">Teal</span>
    <span class="ui blue label">Blue</span>
    <span class="ui violet label">Violet</span>
    <span class="ui purple label">Purple</span>
    <span class="ui pink label">Pink</span>
    <span class="ui brown label">Brown</span>
    <span class="ui grey label">Grey</span>
    <span class="ui black label">Black</span>
  </section>

  <section>
    <h4>Basic tag</h4>
    <span class="ui basic tag label">Basic</span>
    <span class="ui red basic tag label">Red</span>
  </section>

  <section>
    <h4>Size</h4>
    <span class="ui mini label">Mini</span>
    <span class="ui tiny label">Tiny</span>
    <span class="ui small label">Small</span>
    <span class="ui label">Plain</span>
    <span class="ui medium label">Medium</span>
    <span class="ui large label">Large</span>
    <span class="ui big label">Big</span>
    <span class="ui huge label">Huge</span>
    <span class="ui massive label">Massive</span>
  </section>
</div>
