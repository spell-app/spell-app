<!-- `src/components/ui-placeholder/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Line length</h4>
    <ui-placeholder>
      <ui-placeholder-line length="full"></ui-placeholder-line>
      <ui-placeholder-line length="very long"></ui-placeholder-line>
      <ui-placeholder-line length="long"></ui-placeholder-line>
      <ui-placeholder-line length="medium"></ui-placeholder-line>
      <ui-placeholder-line length="short"></ui-placeholder-line>
      <ui-placeholder-line length="very short"></ui-placeholder-line>
    </ui-placeholder>
  </section>

  <section>
    <h4>Fluid</h4>
    <ui-placeholder fluid>
      <ui-placeholder-header image>
        <ui-placeholder-line></ui-placeholder-line>
        <ui-placeholder-line></ui-placeholder-line>
      </ui-placeholder-header>
      <ui-placeholder-paragraph>
        <ui-placeholder-line></ui-placeholder-line>
        <ui-placeholder-line></ui-placeholder-line>
        <ui-placeholder-line></ui-placeholder-line>
      </ui-placeholder-paragraph>
    </ui-placeholder>
  </section>

  <section>
    <h4>Inverted</h4>
    <div class="ui-dark" style="padding: 1em; border-radius: var(--ui-radius); background: var(--ui-background)">
      <ui-placeholder inverted>
        <ui-placeholder-header image>
          <ui-placeholder-line></ui-placeholder-line>
          <ui-placeholder-line></ui-placeholder-line>
        </ui-placeholder-header>
        <ui-placeholder-paragraph>
          <ui-placeholder-line></ui-placeholder-line>
          <ui-placeholder-line></ui-placeholder-line>
          <ui-placeholder-line></ui-placeholder-line>
        </ui-placeholder-paragraph>
      </ui-placeholder>
    </div>
  </section>
</div>
