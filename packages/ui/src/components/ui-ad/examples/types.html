<!--
  Ad units, after Fomantic's docs (views/advertisement.html, "Types").
  Light-DOM markup in the class grammar `UIAd.css` styles inside `<ui-ad>`'s shadow root.  Every example is a `test`
  ad (a grey placeholder with its text), so the unit's box shows;  the mobile unit shows on phone-sized viewports
  only.
-->
<div class="ui-stack">
  <section>
    <h4>Medium rectangle</h4>
    <div class="ui medium rectangle test ad" data-text="Medium rectangle"></div>
  </section>

  <section>
    <h4>Large rectangle</h4>
    <div class="ui large rectangle test ad" data-text="Large rectangle"></div>
  </section>

  <section>
    <h4>Small rectangle</h4>
    <div class="ui small rectangle test ad" data-text="Small rectangle"></div>
  </section>

  <section>
    <h4>Square button</h4>
    <div class="ui square button test ad" data-text="Square button"></div>
  </section>

  <section>
    <h4>Banner</h4>
    <div class="ui banner test ad" data-text="Banner"></div>
  </section>

  <section>
    <h4>Skyscraper</h4>
    <div class="ui skyscraper test ad" data-text="Skyscraper"></div>
  </section>

  <section>
    <h4>Leaderboard</h4>
    <div class="ui leaderboard test ad" data-text="Leaderboard"></div>
  </section>

  <section>
    <h4>Mobile leaderboard</h4>
    <div class="ui mobile leaderboard test ad" data-text="Mobile leaderboard"></div>
  </section>
</div>
