<!-- `src/components/ui-checkbox/examples/types.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Checkbox</h4>
    <ui-checkbox>Make my profile visible</ui-checkbox>
  </section>

  <section>
    <h4>Radio</h4>
    <div class="ui-stack" role="radiogroup" aria-label="How often?">
      <ui-radio name="often" value="week" selected>Once a week</ui-radio>
      <ui-radio name="often" value="day">Once a day</ui-radio>
    </div>
  </section>

  <section>
    <h4>Slider</h4>
    <ui-checkbox type="slider">Accept terms and conditions</ui-checkbox>
  </section>

  <section>
    <h4>Toggle</h4>
    <ui-checkbox type="toggle">Subscribe to weekly newsletter</ui-checkbox>
  </section>
</div>
