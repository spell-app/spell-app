# Review each changed package on a push to `main` or a PR:  type check, lint, format check, tests.
# - Which packages:  `.github/scripts/changed-packages.mjs` (a package's own changes, plus packages it depends on).
# - Non-mutating:  `yarn review` runs `lint:fix` / `format`, so CI runs the check scripts instead.
# - Also by hand:  Actions tab => "review" => "Run workflow" (reviews the last commit's packages).
name: review

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: node .github/scripts/changed-packages.mjs "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" >> "$GITHUB_OUTPUT"

  review:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
        working-directory: .

      # browser tests (ui's, the fork's, util's) run in a real chromium
      - if: contains(fromJSON('["ui", "solid-element", "util"]'), matrix.package)
        run: yarn playwright install --with-deps chromium

      - name: type check
        run: if node -p 'require("./package.json").scripts.ts' | grep -qv undefined; then yarn ts; else yarn tsc; fi
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
