<!-- `src/components/select/examples/types.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Select</h4>
    <ui-select placeholder="Gender" name="gender">
      <ui-item value="male">Male</ui-item>
      <ui-item value="female">Female</ui-item>
    </ui-select>
  </section>

  <section>
    <h4>Chosen value</h4>
    <ui-select aria-label="Fruit" value="banana">
      <ui-item value="apple">Apple</ui-item>
      <ui-item value="banana">Banana</ui-item>
      <ui-item value="cherry">Cherry</ui-item>
    </ui-select>
  </section>

  <section>
    <h4>Groups and dividers</h4>
    <ui-select placeholder="Choose food">
      <ui-item type="header">Fruit</ui-item>
      <ui-item value="apple">Apple</ui-item>
      <ui-item value="pear">Pear</ui-item>
      <ui-item type="header">Vegetables</ui-item>
      <ui-item value="leek">Leek</ui-item>
      <ui-item type="divider"></ui-item>
      <ui-item value="none">Nothing</ui-item>
    </ui-select>
  </section>

  <section>
    <h4>Flags, icons and descriptions</h4>
    <ui-select placeholder="Select Country">
      <ui-item value="fr" flag="fr" description="EU">France</ui-item>
      <ui-item value="gh" flag="gh" description="AU">Ghana</ui-item>
      <ui-item value="jp" icon="sun">Japan</ui-item>
    </ui-select>
  </section>

  <section>
    <h4>Multiple</h4>
    <ui-select multiple aria-label="Skills" value="angular,css">
      <ui-item value="angular">Angular</ui-item>
      <ui-item value="css">CSS</ui-item>
      <ui-item value="html">HTML</ui-item>
      <ui-item value="js">JavaScript</ui-item>
    </ui-select>
  </section>
</div>
