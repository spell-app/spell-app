<!doctype html>
<!--
  The Spell UI site's top bar, shared by every page:  `<ui-include class="site-header" source="<rel>/_parts/header.html"
  page-styles>` (the template, `packages/docs/templates/spell-ui-docs.html`).
  - `page-styles`:  in the page's LIGHT DOM, so `site.css` lays it out and the menu button's `commandfor` finds the
    flyout below.  `<ui-include>` rewrites relative links against THIS file (`_parts/`), so the site's pages are `../index.html` ...
  - The flyout holds a second `<ui-docs-nav>` for narrow screens (the left column is hidden there);  its `current`
    defaults to the page's own file name, so it marks the right row from here too.  Its header holds the theme
    picker on phones, where the top menu has no room for it.
  - Only `<body>` is included.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spell UI site header</title>
  </head>
  <body>
    <ui-menu inverted class="site-top-menu" aria-label="Site">
      <ui-item class="site-menu-item">
        <ui-button
          class="site-menu-button"
          icon="bars"
          inverted
          basic
          compact
          aria-label="Components"
          title="Components"
          commandfor="site-nav-flyout"
          command="--show"
        ></ui-button>
      </ui-item>
      <ui-item href="../index.html" class="site-logo"><b>Spell UI</b></ui-item>
      <ui-item href="../getting-started.html" class="site-top-link">Getting started</ui-item>
      <ui-item href="../grammar.html" class="site-top-link">Grammar</ui-item>
      <ui-item href="../theming.html" class="site-top-link">Theming</ui-item>
      <ui-item href="../icons.html" class="site-top-link">Icons</ui-item>
      <ui-item position="right" class="site-themes-item">
        <ui-docs-themes inverted size="small"></ui-docs-themes>
      </ui-item>
    </ui-menu>

    <ui-flyout id="site-nav-flyout" position="left" inverted closable class="site-nav-flyout" aria-label="Components">
      <ui-docs-nav aria-label="Components (menu)">
        <ui-docs-themes slot="header" inverted size="small" class="site-flyout-themes"></ui-docs-themes>
      </ui-docs-nav>
    </ui-flyout>
  </body>
</html>
