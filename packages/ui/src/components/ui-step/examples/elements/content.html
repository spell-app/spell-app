<!-- `src/components/ui-step/examples/content.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Description</h4>
    <ui-steps>
      <ui-step header="Shipping" description="Choose your shipping options"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Icon</h4>
    <ui-steps>
      <ui-step icon="truck" header="Shipping" description="Choose your shipping options"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Parts</h4>
    <ui-steps>
      <ui-step>
        <ui-content>
          <ui-title>Shipping</ui-title>
          <ui-description>Choose your shipping options</ui-description>
        </ui-content>
      </ui-step>
      <ui-step selected><ui-icon slot="icon" name="credit-card"></ui-icon><ui-title>Billing</ui-title></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Link</h4>
    <ui-steps>
      <ui-step
        selected
        href="#shipping"
        icon="truck"
        header="Shipping"
        description="Choose your shipping options"
      ></ui-step>
      <ui-step href="#billing" icon="credit-card" header="Billing" description="Enter billing information"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Link without a URL</h4>
    <ui-steps>
      <ui-step link icon="truck" header="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step link icon="credit-card" header="Billing" description="Enter billing information"></ui-step>
    </ui-steps>
  </section>
</div>
