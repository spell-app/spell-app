<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Actions | Spell UI</title>
    <meta
      name="description"
      content="Actions hold what a user can do next:  a comment's reply links, a modal's or toast's buttons."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../_assets/site.css" />
    <script type="module" src="../_assets/site.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Actions">
      <ui-segment vertical class="site-masthead">
        <ui-container>
          <ui-menu icon floated="right" class="site-page-links" aria-label="About this page">
            <ui-item
              href="https://github.com/spell-app/spell-app/blob/main/packages/ui/site/components/ui-actions.html"
              icon="pen to square"
              aria-label="This page's source on GitHub"
              title="This page's source on GitHub"
            ></ui-item>
            <ui-item
              href="https://github.com/spell-app/spell-app/issues/new?title=ui-actions%3A%20%20"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Actions
            <ui-header>Actions hold what a user can do next:  a comment's reply links, a modal's or toast's buttons.</ui-header>
          </ui-header>
          <ui-docs-themes for="ui-actions" show="theme" class="site-themes"></ui-docs-themes>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history basic appearance="segmented" alignment="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  `<ui-actions>` in each owner that gives it a look (from the owners' own pages and
              `src/components/ui-parts/examples/elements/`), then its attributes.  The Content parts page
              (`ui-header.html`) shows every part together.
            -->
            <ui-section id="examples-owners" header="Owners" sticky collapsible dividing>
              <ui-section id="examples-owners-comment" header="Comment" sticky collapsible dividing>
                <ui-docs-example description="A comment's actions:  a row of small links under its text.">
                  <ui-comments>
                    <ui-comment>
                      <ui-avatar src="../images/avatar/small/joe.jpg"></ui-avatar>
                      <ui-content>
                        <ui-author href="#joe">Joe Henderson</ui-author>
                        <ui-description>Dude, this is awesome. Thanks so much</ui-description>
                        <ui-actions><a href="#reply">Reply</a><a href="#save">Save</a><a href="#hide">Hide</a></ui-actions>
                      </ui-content>
                    </ui-comment>
                  </ui-comments>
                </ui-docs-example>
              </ui-section>

              <ui-section id="examples-owners-modal" header="Modal" sticky collapsible dividing>
                <ui-docs-example
                  description="A modal's actions:  its footer, buttons on the right;  `approve` and `deny` close it."
                >
                  <ui-button commandfor="actions-modal" command="--show">Show</ui-button>
                  <ui-modal id="actions-modal" size="small" closable>
                    <ui-header>Delete Your Account</ui-header>
                    <ui-content><p>Are you sure you want to delete your account?</p></ui-content>
                    <ui-actions>
                      <ui-button class="deny" negative>No</ui-button>
                      <ui-button class="approve" positive>Yes</ui-button>
                    </ui-actions>
                  </ui-modal>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-standalone" header="Standalone" sticky collapsible dividing>
              <ui-section id="examples-standalone-no-owner" header="No owner" sticky collapsible dividing>
                <ui-docs-example description="Outside an owner, `<ui-actions>` is an unstyled block.">
                  <ui-actions><ui-button size="small">OK</ui-button></ui-actions>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <ui-section id="usage-using-it" header="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-actions>` holds what a user can do next with its owner's content: a comment's reply links, a modal's or
                  flyout's buttons. Put links or `<ui-button>`s inside it; it lays them out the way its owner expects (a comment's
                  links in a row, a modal's buttons on the right, on a footer band).

                  - No attributes: the owner decides the look.
                  - A button's `class="approve"` / `class="deny"` in a modal's actions closes the modal (see the modal page).
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-owners" header="Owners" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-actions>` finds its nearest owner and sets `:state(in-<owner>)` on itself; `ui-parts.css` styles it by that
                  state. Its owners, and what each makes of it:

                  - [Comment](ui-comment.html) (`:state(in-comment)`): a row of small, quiet links under the text; `minimal` comments show them on hover or focus
                  - [Modal](ui-modal.html) (`:state(in-modal)`): the footer band, buttons on the right
                  - [Flyout](ui-flyout.html) (`:state(in-flyout)`): the footer band, buttons on the right
                  - [Toast](ui-toast.html) (`:state(in-toast)`): buttons under the message

                  Anywhere else it is an unstyled block. More on how parts find their owners: [Content parts](ui-header.html#usage-owners).
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-accessibility" header="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - A neutral block with no role: the links and buttons inside it carry the meaning, so give icon-only buttons an
                    `aria-label`.
                  - A comment's `minimal` actions show on hover AND on keyboard focus, so they stay reachable with **Tab**.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json`);  nothing to write. -->
            <ui-docs-api tag="ui-actions"></ui-docs-api>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
