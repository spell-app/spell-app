<!--
  Statistic types, after Fomantic's docs (views/statistic.html, "Types").
  Light-DOM markup in the class grammar `UIStatistic.css` styles inside `<ui-statistic>`'s shadow root;  the value and
  label are the generic parts, each with the static `in-statistic` class (`UIParts.css`).
-->
<div class="ui-stack">
  <section>
    <h4>Statistic</h4>
    <div class="ui statistic">
      <div class="value in-statistic">5,550</div>
      <div class="label in-statistic">Downloads</div>
    </div>
  </section>

  <section>
    <h4>Statistic group</h4>
    <div class="ui statistics">
      <div class="statistic">
        <div class="value in-statistic">22</div>
        <div class="label in-statistic">Saves</div>
      </div>
      <div class="statistic">
        <div class="text value in-statistic">Three<br />Thousand</div>
        <div class="label in-statistic">Signups</div>
      </div>
      <div class="statistic">
        <div class="value in-statistic">5</div>
        <div class="label in-statistic">Flights</div>
      </div>
      <div class="statistic">
        <div class="value in-statistic">42</div>
        <div class="label in-statistic">Team members</div>
      </div>
    </div>
  </section>
</div>
