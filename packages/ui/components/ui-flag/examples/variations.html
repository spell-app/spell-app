<!--
  Flag variations, after Fomantic's docs (elements/flag.html, "Size", "Autosizing").
  Light-DOM markup in the class grammar `UIFlag.css` styles inside `<ui-flag>`'s shadow root.  `medium` is
  Fomantic's 3em flag, for static markup:  `<ui-flag size="medium">` is the unsized 1em flag.
-->
<div class="ui-stack">
  <section>
    <h4>Size</h4>
    <p>
      <span class="ui small flag" role="img" aria-label="France">🇫🇷</span>
      <span class="ui medium flag" role="img" aria-label="France">🇫🇷</span>
      <span class="ui large flag" role="img" aria-label="France">🇫🇷</span>
      <span class="ui big flag" role="img" aria-label="France">🇫🇷</span>
      <span class="ui huge flag" role="img" aria-label="France">🇫🇷</span>
      <span class="ui massive flag" role="img" aria-label="France">🇫🇷</span>
    </p>
  </section>

  <section>
    <h4>Autosizing</h4>
    <h2><span class="ui flag" role="img" aria-label="Germany">🇩🇪</span>Header</h2>
    <p>
      <button type="button"><span class="ui flag" role="img" aria-label="Italy">🇮🇹</span>Button</button>
    </p>
    <p>
      <span style="font-size: 1.5em"><span class="ui flag" role="img" aria-label="Spain">🇪🇸</span>Larger text</span>
    </p>
    <p>
      <small><span class="ui flag" role="img" aria-label="Sweden">🇸🇪</span>Smaller text</small>
    </p>
  </section>
</div>
